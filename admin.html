<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0E5F30"/>
<title>DP সেবা অ্যাডমিন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0E5F30;--primary-d:#083A1C;--primary-l:#1B8044;
  --primary-soft:#E5F2EA;--primary-soft2:#CDE6D9;
  --accent:#C41E3A;--accent-soft:#FCE7EC;
  --gold:#D4A017;--gold-soft:#FBF3DC;
  --income:#16A34A;--income-soft:#E6F7EE;
  --expense:#DC2626;--expense-soft:#FDE8ED;
  --donation:#C41E3A;--donation-soft:#FCE7EC;
  --event:#EA580C;--event-soft:#FEF0E7;
  --warn:#D97706;--warn-soft:#FEF3C7;
  --info:#0284C7;--info-soft:#E0F2FE;
  --danger:#B91C1C;--danger-soft:#FEE2E2;
  --bg:#EAF4EE;--bg-2:#D4E7DC;
  --text:#0A1A12;--text-2:#4E5F55;--text-3:#8B9A92;
  --border:#DCE7E1;--border-2:#E9F2ED;
  --card:rgba(255,255,255,.72);
  --card-2:rgba(255,255,255,.5);
  --card-border:rgba(255,255,255,.85);
  --glass-hi:rgba(255,255,255,.95);
  --shadow:0 8px 24px -10px rgba(14,95,48,.16),0 2px 6px -2px rgba(14,95,48,.06);
  --radius:20px;--nav-h:66px;
}
[data-theme="dark"]{
  --primary:#22A155;--primary-d:#0E5F30;--primary-l:#3DC76F;
  --primary-soft:#0A2A18;--primary-soft2:#123A22;
  --accent:#FF4D6D;--accent-soft:#3A0F1A;
  --gold:#FBBF24;--gold-soft:#3A2E10;
  --income:#2ECC71;--income-soft:#12301F;
  --expense:#FF5C7A;--expense-soft:#3A1520;
  --donation:#FF4D6D;--donation-soft:#3A0F1A;
  --event:#FB923C;--event-soft:#3A2110;
  --warn:#FBBF24;--warn-soft:#3A2E10;
  --info:#38BDF8;--info-soft:#0C2A3A;
  --danger:#F87171;--danger-soft:#3A1010;
  --bg:#06100B;--bg-2:#030806;
  --text:#E8F5EE;--text-2:#95B3A5;--text-3:#627A70;
  --border:#1C2E24;--border-2:#15241C;
  --card:rgba(15,26,21,.62);
  --card-2:rgba(21,36,29,.5);
  --card-border:rgba(255,255,255,.09);
  --glass-hi:rgba(255,255,255,.09);
  --shadow:0 8px 24px -10px rgba(0,0,0,.55),0 2px 6px -2px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:'Hind Siliguri',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-2);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:0;height:0}
#app{
  position:relative;max-width:540px;margin:0 auto;
  height:100dvh;height:100vh;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 0 90px rgba(0,0,0,.12);
  background:
    radial-gradient(circle at 12% 6%,rgba(34,161,85,.24),transparent 42%),
    radial-gradient(circle at 90% 80%,rgba(196,30,58,.16),transparent 46%),
    radial-gradient(circle at 45% 102%,rgba(212,160,23,.16),transparent 46%),
    linear-gradient(160deg,#EAF4EE 0%,#D4E7DC 100%);
  background-attachment:fixed;
}
[data-theme="dark"] #app{
  background:
    radial-gradient(circle at 12% 6%,rgba(34,161,85,.24),transparent 42%),
    radial-gradient(circle at 90% 80%,rgba(255,77,109,.14),transparent 46%),
    radial-gradient(circle at 45% 102%,rgba(251,191,36,.12),transparent 46%),
    linear-gradient(160deg,#0A1810 0%,#030806 100%);
  background-attachment:fixed;
}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + 26px)}
.hd{padding:14px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd h1{font-size:20px;font-weight:700;margin:0}
.hd .sub{font-size:12px;color:var(--text-2);margin-top:2px}
.sec{padding:0 18px;margin-top:14px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-hd h2{font-size:15px;font-weight:700;margin:0}
.sec-hd .link{font-size:12px;color:var(--primary);font-weight:600;cursor:pointer}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--text-2)}.tiny{font-size:11px}.sm{font-size:12px}
.b{font-weight:600}.bb{font-weight:700}.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{text-align:center}.gap6{gap:6px}.gap10{gap:10px}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  border:1px solid var(--card-border);
  padding:16px;
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
}
.card::before{
  content:'';position:absolute;top:0;left:14px;right:14px;height:1px;
  background:linear-gradient(90deg,transparent,var(--glass-hi),transparent);
  pointer-events:none;
}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,var(--c),#000);color:#fff;font-weight:700;flex:none;overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:10.5px;font-weight:600;line-height:1.6}
.pill.paid,.pill.active,.pill.approved,.pill.upcoming{background:var(--income-soft);color:var(--income)}
.pill.due,.pill.suspended,.pill.rejected{background:var(--expense-soft);color:var(--expense)}
.pill.partial,.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.na,.pill.inactive,.pill.past{background:var(--border);color:var(--text-3)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.extra{background:var(--accent-soft);color:var(--accent)}
.pill.urgent{background:var(--danger-soft);color:var(--danger)}
.pill.important{background:var(--warn-soft);color:var(--warn)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;color:#fff;transition:transform .12s;background:linear-gradient(135deg,var(--primary-l),var(--primary));box-shadow:0 8px 20px -8px rgba(14,95,48,.7)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--border);box-shadow:none;backdrop-filter:blur(12px)}
.btn.soft{background:var(--primary-soft);color:var(--primary);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#E11D48,#B91C1C)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#B58414)}
.btn.success{background:linear-gradient(135deg,var(--income),#0E7A38)}
.btn.small{padding:8px 14px;font-size:12.5px;border-radius:11px}
.btn.xs{padding:5px 10px;font-size:11px;border-radius:9px;gap:4px}
.btn.block{width:100%}
.icon-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--card-border);color:var(--text-2);transition:transform .12s;flex:none;backdrop-filter:blur(12px)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px}
.icon-btn.sm{width:34px;height:34px;border-radius:11px}
.icon-btn.sm svg{width:17px;height:17px}
.balance-card{
  position:relative;overflow:hidden;border-radius:22px;
  padding:14px 16px;
  background:linear-gradient(135deg,rgba(14,95,48,.95) 0%,rgba(27,128,68,.92) 45%,rgba(10,74,36,.95) 100%);
  color:#fff;
  box-shadow:0 18px 38px -16px rgba(14,95,48,.7),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,0,.15);
  border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(14px);
}
.balance-card::before{
  content:'';position:absolute;top:-45%;left:-20%;right:-20%;height:95%;
  background:radial-gradient(ellipse at 30% 0%,rgba(255,255,255,.35),transparent 62%);
  pointer-events:none;
}
.balance-card::after{
  content:'';position:absolute;bottom:-35%;right:-20%;width:75%;height:75%;
  background:radial-gradient(circle,rgba(212,160,23,.4),transparent 65%);
  pointer-events:none;
}
.bc-edit{
  position:absolute;top:11px;right:11px;
  width:32px;height:32px;border-radius:11px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;
  color:#fff;z-index:3;cursor:pointer;
  backdrop-filter:blur(8px);
  transition:all .15s;
}
.bc-edit:active{transform:scale(.9);background:rgba(255,255,255,.3)}
.bc-edit svg{width:15px;height:15px}
.bc-header{display:flex;align-items:center;gap:10px;position:relative;z-index:2;padding-bottom:9px;border-bottom:1px solid rgba(255,255,255,.18)}
.bc-logo{width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;padding:3px;flex:none;overflow:hidden;box-shadow:0 6px 16px -6px rgba(0,0,0,.3)}
.bc-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:10px}
.bc-logo .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary-l),var(--primary));border-radius:10px;color:#fff;font-weight:700}
.bc-org{flex:1;min-width:0;padding-right:38px}
.bc-org-name{font-size:13px;font-weight:700;line-height:1.2}
.bc-org-sub{font-size:9.5px;opacity:.82;margin-top:1px}
.bc-label{font-size:10.5px;opacity:.88;font-weight:500;margin-top:10px;position:relative;z-index:2;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bc-amount{font-size:28px;font-weight:700;letter-spacing:-.8px;margin-top:2px;line-height:1.15;position:relative;z-index:2}
.bc-sub{font-size:10px;opacity:.72;margin-top:3px;position:relative;z-index:2}
.bc-stats{display:flex;gap:8px;margin-top:12px;position:relative;z-index:2}
.bc-stat{flex:1;background:rgba(255,255,255,.15);border-radius:11px;padding:8px 10px;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);cursor:pointer;transition:background .15s;position:relative}
.bc-stat:active{background:rgba(255,255,255,.25)}
.bc-stat .k{font-size:9.5px;opacity:.92;display:flex;align-items:center;gap:4px}
.bc-stat .k svg{width:10px;height:10px;opacity:.8}
.bc-stat .v{font-size:13.5px;font-weight:700;margin-top:2px}
.bc-manual-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.3);
  padding:2px 7px;border-radius:99px;
  font-size:9px;font-weight:600;
  backdrop-filter:blur(6px);
}
.bc-reset-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(220,38,38,.4);
  border:1px solid rgba(255,255,255,.4);
  padding:2px 7px;border-radius:99px;
  font-size:9px;font-weight:600;
  backdrop-filter:blur(6px);
}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.stat{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:18px;padding:13px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
}
.stat::before{
  content:'';position:absolute;top:0;left:10px;right:10px;height:1px;
  background:linear-gradient(90deg,transparent,var(--glass-hi),transparent);
  pointer-events:none;
}
.stat.clickable{cursor:pointer}
.stat .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.stat .ic svg{width:16px;height:16px}
.stat .k{font-size:10.5px;color:var(--text-2);font-weight:500;line-height:1.3}
.stat .v{font-size:16px;font-weight:700;margin-top:3px}
.list{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;position:relative;
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
}
.list::before{
  content:'';position:absolute;top:0;left:14px;right:14px;height:1px;
  background:linear-gradient(90deg,transparent,var(--glass-hi),transparent);
  pointer-events:none;z-index:1;
}
.li{display:flex;align-items:center;gap:12px;padding:13px 15px;transition:background .15s;cursor:pointer}
.li:active{background:rgba(255,255,255,.45)}
[data-theme="dark"] .li:active{background:rgba(255,255,255,.05)}
.li+.li{border-top:1px solid var(--border-2)}
.li .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.li .ic svg{width:17px;height:17px}
.li .t{font-size:13.5px;font-weight:600;line-height:1.35}
.li .s{font-size:11px;color:var(--text-3);margin-top:2px}
.li .amt{font-size:14px;font-weight:700;white-space:nowrap}
.li > .chev{width:20px;height:20px;color:var(--text-3);flex:none;display:flex;align-items:center;justify-content:center}
.li > .chev svg{width:18px;height:18px}
.amt.pos{color:var(--income)}.amt.neg{color:var(--expense)}
.prog{height:8px;border-radius:99px;background:var(--border);overflow:hidden;position:relative}
.prog>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary-l),var(--primary));transition:width .8s;box-shadow:0 0 12px rgba(27,128,68,.5)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.pad0{padding:0}
.chip{padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--card);border:1px solid var(--card-border);color:var(--text-2);flex:none;cursor:pointer;backdrop-filter:blur(12px)}
.chip.on{background:linear-gradient(135deg,var(--primary-l),var(--primary));border-color:var(--primary);color:#fff}
.searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:0 13px;height:46px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}
.searchbar svg{width:17px;height:17px;color:var(--text-3);flex:none}
.searchbar input{flex:1;border:none;outline:none;background:none;font-size:13.5px;height:100%}
.bottomnav{
  position:absolute;bottom:0;left:0;right:0;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.62);
  border-top:1px solid rgba(255,255,255,.85);
  display:flex;z-index:40;
  backdrop-filter:blur(36px) saturate(220%);
  -webkit-backdrop-filter:blur(36px) saturate(220%);
  box-shadow:0 -12px 34px -14px rgba(14,95,48,.22),inset 0 1px 0 rgba(255,255,255,.95);
}
.bottomnav::before{
  content:'';position:absolute;top:0;left:10px;right:10px;height:1.2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,1),transparent);
  pointer-events:none;
  filter:blur(.3px);
}
[data-theme="dark"] .bottomnav{
  background:rgba(15,26,21,.62);
  border-top:1px solid rgba(255,255,255,.12);
  box-shadow:0 -12px 34px -14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);
}
[data-theme="dark"] .bottomnav::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)}
.bottomnav .nv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);position:relative;padding-top:2px;cursor:pointer}
.bottomnav .nv svg{width:20px;height:20px;transition:transform .15s}
.bottomnav .nv span{font-size:9px;font-weight:600}
.bottomnav .nv.on{color:var(--primary)}
.bottomnav .nv.on svg{transform:scale(1.08)}
.bottomnav .nv.on::before{
  content:'';position:absolute;top:0;width:30px;height:3px;
  border-radius:0 0 4px 4px;
  background:linear-gradient(90deg,var(--primary-l),var(--primary));
  box-shadow:0 2px 8px rgba(27,128,68,.6);
}
.subpage{position:absolute;inset:0;background:linear-gradient(160deg,#EAF4EE 0%,#D4E7DC 100%);z-index:60;display:flex;flex-direction:column;animation:slideIn .26s ease}
[data-theme="dark"] .subpage{background:linear-gradient(160deg,#0A1810 0%,#030806 100%)}
@keyframes slideIn{from{transform:translateX(28px);opacity:.3}to{transform:translateX(0);opacity:1}}
.subhd{display:flex;align-items:center;gap:10px;padding:14px 16px;background:rgba(255,255,255,.78);border-bottom:1px solid var(--card-border);flex:none;position:sticky;top:0;z-index:5;backdrop-filter:blur(18px)}
[data-theme="dark"] .subhd{background:rgba(15,26,21,.78)}
.subhd h1{font-size:16.5px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subbody{flex:1;overflow-y:auto;padding-bottom:34px}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:120;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(5px)}
.modal{background:var(--bg);width:100%;max-width:540px;border-radius:26px 26px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:slideUp .3s ease;box-shadow:0 -20px 60px rgba(0,0,0,.3)}
@keyframes slideUp{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
.modal-hd{padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border-2);flex:none}
.modal-hd h2{margin:0;font-size:16px;font-weight:700;flex:1}
.modal-body{flex:1;overflow-y:auto;padding:18px}
.modal-foot{padding:14px 18px;border-top:1px solid var(--border-2);flex:none;display:flex;gap:10px;background:var(--card);backdrop-filter:blur(14px)}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;height:46px;border-radius:13px;border:1.5px solid var(--border);background:var(--card);padding:0 13px;outline:none;transition:border-color .18s;font-size:14px;backdrop-filter:blur(10px)}
.field textarea{height:auto;min-height:80px;padding:11px 13px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3.5px var(--primary-soft)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:16px;font-size:12.5px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:all .28s;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.success{background:linear-gradient(135deg,var(--income),#0E7A38);color:#fff}
.toast.error{background:linear-gradient(135deg,#E11D48,var(--danger));color:#fff}
.empty{padding:36px 24px;text-align:center;color:var(--text-3)}
.empty .eic{width:60px;height:60px;border-radius:20px;background:var(--card);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.empty .eic svg{width:26px;height:26px;color:var(--text-3)}
.empty h3{margin:0 0 5px;font-size:13.5px;color:var(--text-2);font-weight:600}
.empty p{margin:0;font-size:12px}
.login{padding:0 24px;display:flex;flex-direction:column;justify-content:center;min-height:100%;position:relative;overflow:hidden}
.login-logo{width:90px;height:90px;border-radius:26px;overflow:hidden;background:#fff;padding:5px;margin:0 auto 18px;box-shadow:0 18px 38px -12px rgba(14,95,48,.6)}
.login-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:21px}

function toISO(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function parseISO(s){if(!s)return new Date();var p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function fmtDate(iso){if(!iso)return '—';try{var d=parseISO(iso);return d.getDate()+' '+MN(d.getMonth()+1)+' '+d.getFullYear()}catch(e){return iso}}
function fmtDateShort(iso){if(!iso)return '—';try{var d=parseISO(iso);return d.getDate()+' '+MN(d.getMonth()+1)}catch(e){return iso}}
function fmtDateTime(ts){if(!ts)return '—';var d=new Date(ts);var hr=d.getHours();var ampm=hr>=12?'PM':'AM';hr=hr%12||12;return d.getDate()+' '+MN(d.getMonth()+1)+' '+hr+':'+pad2(d.getMinutes())+' '+ampm}

function txTimestamp(t){
  if(t.createdAt) return Number(t.createdAt);
  if(t.ts) return Number(t.ts);
  if(t.date){ try{ return parseISO(t.date).getTime(); }catch(e){ return 0; } }
  return 0;
}
function statsResetAt(){
  return (DB.org && DB.org.statsResetAt) ? Number(DB.org.statsResetAt) : 0;
}

var DATA={
  stats:function(){
    var resetAt = statsResetAt();
    var income=0,expense=0,contrib=0,extra=0,donation=0,eventExp=0,otherExp=0,otherInc=0;
    DB.transactions.forEach(function(t){
      var ts = txTimestamp(t);
      if(resetAt > 0 && ts < resetAt) return;
      if(t.type==='contribution'){contrib+=t.amount;income+=t.amount}
      else if(t.type==='extra_payment'){extra+=t.amount;income+=t.amount}
      else if(t.type==='donation'){donation+=t.amount;income+=t.amount}
      else if(t.type==='other_income'){otherInc+=t.amount;income+=t.amount}
      else if(t.type==='event_expense'){eventExp+=t.amount;expense+=t.amount}
      else if(t.type==='other_expense'){otherExp+=t.amount;expense+=t.amount}
    });
    var computedIncome = income;
    var computedExpense = expense;
    var mIncome = DB.org && DB.org.manualIncome;
    var mExpense = DB.org && DB.org.manualExpense;
    var isIncomeManual = (mIncome !== undefined && mIncome !== null && mIncome !== '');
    var isExpenseManual = (mExpense !== undefined && mExpense !== null && mExpense !== '');
    var finalIncome = isIncomeManual ? Number(mIncome) : computedIncome;
    var finalExpense = isExpenseManual ? Number(mExpense) : computedExpense;
    var computedBalance = finalIncome - finalExpense;
    var manual = DB.org && DB.org.manualBalance;
    var isManual = (manual!==undefined && manual!==null && manual!=='');
    return {
      income:finalIncome,
      expense:finalExpense,
      computedIncome:computedIncome,
      computedExpense:computedExpense,
      isIncomeManual:isIncomeManual,
      isExpenseManual:isExpenseManual,
      balance:isManual?Number(manual):computedBalance,
      computed:computedBalance,
      isManual:isManual,
      resetActive: resetAt>0,
      resetAt: resetAt,
      contrib:contrib,extra:extra,donation:donation,
      eventExp:eventExp,otherExp:otherExp,otherInc:otherInc
    };
  },
  monthStats:function(y,m){
    var resetAt = statsResetAt();
    var collected=0,spent=0;
    DB.transactions.forEach(function(t){
      var ts = txTimestamp(t);
      if(resetAt > 0 && ts < resetAt) return;
      var d=parseISO(t.date);
      if(d.getFullYear()===y && d.getMonth()+1===m){
        if(INCOME_TYPES.indexOf(t.type)>=0) collected+=t.amount;
        else spent+=t.amount;
      }
    });
    return {collected:collected,spent:spent};
  },
  memberContribs:function(id){return DB.contributions.filter(function(c){return c.memberId===id})},
  memberExtras:function(id){return DB.extraPayments.filter(function(x){return x.memberId===id})},
  memberSummary:function(id){
    var cs=this.memberContribs(id);
    var expected=cs.reduce(function(a,b){return a+(b.amount||0)},0);
    var paid=cs.reduce(function(a,b){return a+(b.paidAmount||0)},0);
    var extraTotal=this.memberExtras(id).reduce(function(a,b){return a+(b.amount||0)},0);
    return {expected:expected,paid:paid,due:expected-paid,percent:expected?Math.round(paid/expected*100):0,count:cs.length,extraTotal:extraTotal};
  },
  totalDue:function(){var due=0;DB.members.forEach(function(m){var s=DATA.memberSummary(m.id);if(s.due>0)due+=s.due});return due},
  totalExtra:function(){return DB.extraPayments.reduce(function(a,b){return a+(b.amount||0)},0)},
  nextMemberId:function(){
    var max=0;
    DB.members.forEach(function(m){var n=parseInt(String(m.id||'').replace(/\D/g,''),10)||0;if(n>max)max=n});
    return 'DP-'+String(max+1).padStart(3,'0');
  },
  upcomingEvents:function(){return DB.events.filter(function(e){return !e.isCompleted}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'')})},
  pastEvents:function(){return DB.events.filter(function(e){return e.isCompleted}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')})},
  nextEvent:function(){var u=this.upcomingEvents();return u.length?u[0]:null},
  recentPastEvents:function(n){return this.pastEvents().slice(0,n||3)},
  pendingPayments:function(){return DB.paymentRequests.filter(function(r){return r.status==='pending'})},
  eventExpenseAmount:function(event){
    if(!event) return 0;
    if(event.totalCost && Number(event.totalCost)>0) return Number(event.totalCost);
    var fee=Number(event.fee||0);
    var count=DB.members.filter(function(m){return m.status==='active'}).length;
    return fee * count;
  },
  eventAutoExpenses:function(eventId){
    return DB.transactions.filter(function(t){
      return t.eventId===eventId && t.type==='event_expense' && t.autoGenerated===true;
    });
  }
};

function viewContributions(){
  var now=new Date();var cy=now.getFullYear(),cm=now.getMonth()+1;

  DB.contributions.forEach(function(c){if(c.year===y&&c.month===m){expected+=c.amount||0;collected+=c.paidAmount||0}});
  var due=expected-collected;
  var pct=expected?Math.round(collected/expected*100):0;
  var rows=DB.contributions.filter(function(c){return c.year===y&&c.month===m}).map(function(c){return {c:c,mem:DB.members.filter(function(x){return x.id===c.memberId})[0]}}).filter(function(x){return x.mem});

  else{h+='<div class="list">'+rows.map(function(x){var st=x.c.status||'due';var label=st==='paid'?'পরিশোধিত':(st==='due'?'বাকি':'আংশিক');return '<div class="li" data-act="edit-contribution" data-id="'+(x.c.id||'')+'">'+avatarHTML(x.mem,38)+'<div class="grow"><div class="t ell">'+esc(mname(x.mem))+'</div><div class="s">'+(x.mem.id||'')+'</div></div><span class="pill '+st+'">'+label+'</span></div>'}).join('')+'</div>';}

async function saveEvent(eventId){
  var isEdit=!!eventId;
  var container=document.getElementById('eventForm');
  var id=eventId || (container && container.getAttribute('data-id'));
  var oldEvent = isEdit ? DB.events.filter(function(x){return x.id===eventId})[0] : null;
  var wasCompleted = !!(oldEvent && oldEvent.isCompleted);
  var title=(document.getElementById('evTitle')||{}).value.trim();
  var desc=(document.getElementById('evDesc')||{}).value.trim();
  var date=(document.getElementById('evDate')||{}).value;
  var deadline=(document.getElementById('evDeadline')||{}).value;
  var fee=parseInt((document.getElementById('evFee')||{}).value)||0;
  var location=(document.getElementById('evLocation')||{}).value.trim();
  var status=(document.getElementById('evStatus')||{}).value;
  var totalCost=parseInt((document.getElementById('evTotalCost')||{}).value)||0;
  if(!title){toast('শিরোনাম দিন','error');return}
  if(!date){toast('তারিখ দিন','error');return}
  var isNowCompleted = (status==='past');
  var data={title:title,description:desc,date:date,deadline:deadline||null,fee:fee,totalCost:totalCost,location:location,isCompleted:isNowCompleted,updatedAt:Date.now()};
  try{
    var savedId;
    if(isEdit){
      await db.collection('events').doc(id).update(data);
      savedId = id;
      audit('event_edit',id,title,'','');
      toast('ইভেন্ট হালনাগাদ হয়েছে','success');
    } else {
      savedId='EV-'+Date.now();
      data.createdBy=state.admin.name;data.createdAt=Date.now();
      await db.collection('events').doc(savedId).set(data);
      audit('event_add',savedId,title,'','');
      toast('নতুন ইভেন্ট তৈরি হয়েছে','success');
    }
    if(!wasCompleted && isNowCompleted){
      await createEventExpense(savedId, data);
    }
    else if(wasCompleted && !isNowCompleted){
      await reverseEventExpense(savedId);
    }
    popPage();
  }catch(err){console.error(err);toast('Error: '+err.message,'error');}
}

async function createEventExpense(eventId, eventData){
  try{
    var existing = DATA.eventAutoExpenses(eventId);
    if(existing.length){console.log('Event expense already exists for', eventId);return;}
    var amount = DATA.eventExpenseAmount(eventData);
    if(amount <= 0){console.log('Event expense amount is 0 — skipping');return;}
    await db.collection('transactions').add({
      date: eventData.date || toISO(new Date()),
      type: 'event_expense',
      amount: amount,
      category: 'ইভেন্ট ব্যয়',
      desc: (eventData.title || 'ইভেন্ট') + ' — স্বয়ংক্রিয় ব্যয়',
      eventId: eventId,
      eventTitle: eventData.title || '',
      autoGenerated: true,
      addedBy: 'system',
      createdAt: Date.now()
    });
    await db.collection('events').doc(eventId).update({
      autoExpensed: true,
      autoExpenseAmount: amount,
      autoExpensedAt: Date.now()
    });
    await audit('event_auto_expense', eventId, '', amount);
    toast('✅ ইভেন্ট ব্যয় '+money(amount)+' কাটা হয়েছে','success');
  }catch(err){
    console.error('createEventExpense failed:', err);
    toast('⚠️ ব্যয় তৈরি ব্যর্থ: '+err.message,'error');
  }
}

async function reverseEventExpense(eventId){
  try{
    var existing = DATA.eventAutoExpenses(eventId);
    if(!existing.length){
      console.log('No auto expenses to reverse for', eventId);
      return 0;
    }
    var total = 0;
    for(var i=0;i<existing.length;i++){
      total += Number(existing[i].amount||0);
      try{
        await db.collection('transactions').doc(existing[i].id).delete();
      }catch(e){console.warn('Delete failed for', existing[i].id, e);}
    }
    try{
      await db.collection('events').doc(eventId).update({
        autoExpensed: false,
        autoExpenseAmount: 0,
        autoExpensedAt: firebase.firestore.FieldValue.delete(),
        autoExpenseReversedAt: Date.now()
      });
    }catch(e){console.warn(e);}
    if(total>0){
      await audit('event_expense_reversed', eventId, total, 0);
      toast('↩️ '+money(total)+' ব্যালেন্সে ফিরে এসেছে','success');
    }
    return total;
  }catch(err){
    console.error('reverseEventExpense failed:', err);
    return 0;
  }
}

function confirmDeleteEvent(eventId){
  var e=DB.events.filter(function(x){return x.id===eventId})[0];
  if(!e) return;
  var autoExps = DATA.eventAutoExpenses(eventId);
  var autoTotal = autoExps.reduce(function(a,b){return a+Number(b.amount||0)},0);
  var msg = e.title;
  if(autoTotal > 0){
    msg += '\n\n⚠️ এই ইভেন্টের স্বয়ংক্রিয় ব্যয় '+money(autoTotal)+'ও মুছে যাবে → মোট ব্যালেন্সে ফিরে আসবে।';
  }
  confirmDialog('ইভেন্ট মুছুন?', msg, async function(){
    try{
      for(var i=0;i<autoExps.length;i++){
        try{ await db.collection('transactions').doc(autoExps[i].id).delete(); }
        catch(err){ console.warn('Delete tx failed', err); }
      }
      await db.collection('events').doc(eventId).delete();
      await audit('event_delete', eventId, e.title, '', autoTotal>0?('reversed '+money(autoTotal)):'');

async function approvePayment(reqId){
  var r=DB.paymentRequests.filter(function(x){return x.id===reqId})[0];

  if(r.status!=='pending'){toast('প্রসেস হয়েছে','error');return}

    await db.collection('paymentRequests').doc(reqId).update({status:'approved',approvedAt:Date.now(),approvedBy:state.admin.name});
    toast('✓ অনুমোদিত','success');

}

  var r=DB.paymentRequests.filter(function(x){return x.id===reqId})[0];

  try{

}

        var purpose=mr.querySelector('#eepPurpose').value;
        var note=mr.querySelector('#eepNote').value.trim();
        if(amt<=0){toast('সঠিক পরিমাণ দিন','error');return}

          await db.collection('extraPayments').doc(id).update({amount:amt,date:date,purpose:purpose,purposeBn:pBn,note:note,updatedAt:Date.now(),updatedBy:state.admin.name});
          var linkedTx = DB.transactions.filter(function(t){return t.extraPaymentId===id})[0];
          if(linkedTx){
            await db.collection('transactions').doc(linkedTx.id).update({amount:amt,date:date,desc:(x.memberName||'')+' — '+pBn,updatedAt:Date.now()});
          }
          await audit('extra_payment_edit',id,x.amount,amt);
          toast('✅ হালনাগাদ হয়েছে','success');
          closeModal();
        }catch(e){toast('❌ '+e.message,'error')}
      });

        closeModal();

          try{
            var linked = DB.transactions.filter(function(t){return t.extraPaymentId===id});
            for(var i=0;i<linked.length;i++){
              try{await db.collection('transactions').doc(linked[i].id).delete()}catch(e){}
            }
            await db.collection('extraPayments').doc(id).delete();
            await audit('extra_payment_delete',id,x.amount,'','linkedTx:'+linked.length);
            toast('✅ মুছে ফেলা হয়েছে','success');
          }catch(e){toast('❌ '+e.message,'error')}
        },'মুছুন');
      });
    }
  });
}

function formEditExpected(memberId){
  var m=DB.members.filter(function(x){return x.id===memberId})[0];
  if(!m){toast('পাওয়া যায়নি','error');return}
  var now=new Date();
  var cs=DATA.memberContribs(memberId);
  var years=[];cs.forEach(function(c){if(years.indexOf(c.year)<0)years.push(c.year)});years.sort(function(a,b){return b-a});
  if(!years.length) years.push(now.getFullYear());
  var defaultYear=years[0];
  function buildYearInputs(year){
    var yc=cs.filter(function(c){return c.year===year}).sort(function(a,b){return a.month-b.month});
    var html='';
    BN_MONTHS.forEach(function(mn,idx){
      var mo=idx+1;var c=yc.filter(function(x){return x.month===mo})[0];
      if(c){html+='<div class="month-edit-row"><div class="mlbl">'+mn+'</div><input type="number" data-month="'+mo+'" value="'+(c.amount||0)+'" min="0"/></div>';}
      else{html+='<div class="month-edit-row"><div class="mlbl">'+mn+'</div><input type="number" disabled placeholder="রেকর্ড নেই"/></div>';}
    });
    return html;
  }
  openModal({
    title:'প্রত্যাশিত চাঁদা এডিট',
    body:'<div class="field"><label>বছর</label><select id="feYear">'+years.map(function(y){return '<option value="'+y+'" '+(y===defaultYear?'selected':'')+'>'+y+'</option>'}).join('')+'</select></div><div class="month-edit-list" id="feMonthsList">'+buildYearInputs(defaultYear)+'</div>',
    footer:'<button class="btn ghost grow" data-mclose="1">বাতিল</button><button class="btn grow" id="feSave">সংরক্ষণ</button>',
    onMount:function(mr){
      var yearSel=mr.querySelector('#feYear');var list=mr.querySelector('#feMonthsList');
      yearSel.addEventListener('change',function(){list.innerHTML=buildYearInputs(parseInt(yearSel.value))});
      mr.querySelector('#feSave').addEventListener('click',async function(){
        var y=parseInt(yearSel.value);var yc=cs.filter(function(c){return c.year===y});var inputs=list.querySelectorAll('input[data-month]');
        var updated=0;
        for(var i=0;i<inputs.length;i++){
          var inp=inputs[i];
          if(inp.disabled) continue;
          var mo=parseInt(inp.dataset.month);var newAmt=Math.max(0,parseInt(inp.value)||0);var c=yc.filter(function(x){return x.month===mo})[0];
          if(!c||(c.amount||0)===newAmt) continue;
          try{await db.collection('contributions').doc(c.id).update({amount:newAmt,updatedAt:Date.now()});updated++}catch(e){}
        }
        audit('expected_edit',m.id,'','',updated);closeModal();
        if(updated>0) toast(updated+' মাস আপডেট','success');else toast('পরিবর্তন নেই');
      });
    }
  });
}

function pushPage(name,params){state.stack.push(Object.assign({name:name},params||{}));render()}
function popPage(){state.stack.pop();render()}
function switchTab(t){
  if(state.tab===t&&!state.stack.length){var c=$('#content');if(c)c.scrollTop=0;return}
  state.stack=[];state.tab=t;state.txLimit=40;render();
  var c=$('#content');if(c)c.scrollTop=0;
}

    case 'login-email':doLoginEmail();break;

async function loadAllData(){
  try{
    var orgSnap=await db.collection('org').doc('settings').get();
    if(orgSnap.exists) DB.org=orgSnap.data();
    var results=await Promise.all([
      db.collection('members').get(),
      db.collection('contributions').get(),
      db.collection('transactions').get(),
      db.collection('announcements').get(),
      db.collection('notifications').get(),
      db.collection('extraPayments').get(),
      db.collection('paymentRequests').get(),
      db.collection('events').get(),
      db.collection('userPosts').get()
    ]);
    DB.members=results[0].docs.map(function(d){return Object.assign({},d.data(),{_docId:d.id})});
    DB.contributions=results[1].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.transactions=results[2].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.announcements=results[3].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.notifications=results[4].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.extraPayments=results[5].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.paymentRequests=results[6].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.events=results[7].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
