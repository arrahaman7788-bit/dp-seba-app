<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0E5F30"/>
<title>DP সেবা অ্যাডমিন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#0E5F30;--primary-d:#083A1C;--primary-l:#1B8044;--primary-soft:#E5F2EA;--primary-soft2:#CDE6D9;--accent:#C41E3A;--accent-soft:#FCE7EC;--gold:#D4A017;--gold-soft:#FBF3DC;--income:#16A34A;--income-soft:#E6F7EE;--expense:#DC2626;--expense-soft:#FDE8ED;--event:#EA580C;--event-soft:#FEF0E7;--warn:#D97706;--warn-soft:#FEF3C7;--info:#0284C7;--info-soft:#E0F2FE;--danger:#B91C1C;--danger-soft:#FEE2E2;--bg:#EAF4EE;--bg-2:#D4E7DC;--text:#0A1A12;--text-2:#4E5F55;--text-3:#8B9A92;--border:#DCE7E1;--border-2:#E9F2ED;--card:rgba(255,255,255,.72);--card-2:rgba(255,255,255,.5);--card-border:rgba(255,255,255,.85);--glass-hi:rgba(255,255,255,.95);--shadow:0 8px 24px -10px rgba(14,95,48,.16),0 2px 6px -2px rgba(14,95,48,.06);--radius:20px;--nav-h:66px}
[data-theme="dark"]{--primary:#22A155;--primary-d:#0E5F30;--primary-l:#3DC76F;--primary-soft:#0A2A18;--primary-soft2:#123A22;--accent:#FF4D6D;--accent-soft:#3A0F1A;--gold:#FBBF24;--gold-soft:#3A2E10;--income:#2ECC71;--income-soft:#12301F;--expense:#FF5C7A;--expense-soft:#3A1520;--event:#FB923C;--event-soft:#3A2110;--warn:#FBBF24;--warn-soft:#3A2E10;--info:#38BDF8;--info-soft:#0C2A3A;--danger:#F87171;--danger-soft:#3A1010;--bg:#06100B;--bg-2:#030806;--text:#E8F5EE;--text-2:#95B3A5;--text-3:#627A70;--border:#1C2E24;--border-2:#15241C;--card:rgba(15,26,21,.62);--card-2:rgba(21,36,29,.5);--card-border:rgba(255,255,255,.09);--glass-hi:rgba(255,255,255,.09);--shadow:0 8px 24px -10px rgba(0,0,0,.55),0 2px 6px -2px rgba(0,0,0,.35)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:'Hind Siliguri',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-2);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:0;height:0}
#app{position:relative;max-width:540px;margin:0 auto;height:100dvh;height:100vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 90px rgba(0,0,0,.15);background:radial-gradient(circle at 12% 6%,rgba(34,161,85,.24),transparent 42%),radial-gradient(circle at 90% 80%,rgba(196,30,58,.16),transparent 46%),radial-gradient(circle at 45% 102%,rgba(212,160,23,.16),transparent 46%),linear-gradient(160deg,#EAF4EE 0%,#D4E7DC 100%);background-attachment:fixed}
[data-theme="dark"] #app{background:radial-gradient(circle at 12% 6%,rgba(34,161,85,.24),transparent 42%),radial-gradient(circle at 90% 80%,rgba(255,77,109,.14),transparent 46%),radial-gradient(circle at 45% 102%,rgba(251,191,36,.12),transparent 46%),linear-gradient(160deg,#0A1810 0%,#030806 100%);background-attachment:fixed}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + 26px)}
.hd{padding:14px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd h1{font-size:20px;font-weight:700;margin:0}
.hd .sub{font-size:12px;color:var(--text-2);margin-top:2px}
.sec{padding:0 18px;margin-top:14px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-hd h2{font-size:15px;font-weight:700;margin:0}
.sec-hd .link{font-size:12px;color:var(--primary);font-weight:600;cursor:pointer}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--text-2)}.tiny{font-size:11px}.sm{font-size:12px}
.b{font-weight:600}.bb{font-weight:700}.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{text-align:center}.gap6{gap:6px}.gap10{gap:10px}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--card-border);padding:16px;position:relative;overflow:hidden;backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%)}
.card::before{content:'';position:absolute;top:0;left:14px;right:14px;height:1px;background:linear-gradient(90deg,transparent,var(--glass-hi),transparent);pointer-events:none}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,var(--c,#0E5F30),#000);color:#fff;font-weight:700;flex:none;overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:10.5px;font-weight:600;line-height:1.6}
.pill.paid,.pill.active,.pill.approved,.pill.upcoming{background:var(--income-soft);color:var(--income)}
.pill.due,.pill.suspended,.pill.rejected{background:var(--expense-soft);color:var(--expense)}
.pill.partial,.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.na,.pill.inactive,.pill.past{background:var(--border);color:var(--text-3)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.important{background:var(--warn-soft);color:var(--warn)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;color:#fff;transition:transform .12s;background:linear-gradient(135deg,var(--primary-l),var(--primary));box-shadow:0 8px 20px -8px rgba(14,95,48,.65)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--border);box-shadow:none;backdrop-filter:blur(12px)}
.btn.danger{background:linear-gradient(135deg,#E11D48,#B91C1C)}
.btn.small{padding:8px 14px;font-size:12.5px;border-radius:11px}
.btn.xs{padding:5px 10px;font-size:11px;border-radius:9px;gap:4px}
.btn.block{width:100%}
.icon-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--card-border);color:var(--text-2);transition:transform .12s;flex:none;backdrop-filter:blur(12px)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px}
.icon-btn.sm{width:34px;height:34px;border-radius:11px}
.icon-btn.sm svg{width:17px;height:17px}
.balance-card{position:relative;overflow:hidden;border-radius:22px;padding:14px 16px;background:linear-gradient(135deg,rgba(14,95,48,.95) 0%,rgba(27,128,68,.92) 45%,rgba(10,74,36,.95) 100%);color:#fff;box-shadow:0 18px 38px -16px rgba(14,95,48,.7),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,0,.15);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px)}
.balance-card::before{content:'';position:absolute;top:-45%;left:-20%;right:-20%;height:95%;background:radial-gradient(ellipse at 30% 0%,rgba(255,255,255,.35),transparent 62%);pointer-events:none}
.balance-card::after{content:'';position:absolute;bottom:-35%;right:-20%;width:75%;height:75%;background:radial-gradient(circle,rgba(212,160,23,.4),transparent 65%);pointer-events:none}
.bc-edit{position:absolute;top:11px;right:11px;width:32px;height:32px;border-radius:11px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;color:#fff;z-index:3;cursor:pointer;backdrop-filter:blur(8px);transition:all .15s}
.bc-edit:active{transform:scale(.9);background:rgba(255,255,255,.3)}
.bc-edit svg{width:15px;height:15px}
.bc-header{display:flex;align-items:center;gap:10px;position:relative;z-index:2;padding-bottom:9px;border-bottom:1px solid rgba(255,255,255,.18)}
.bc-logo{width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;padding:3px;flex:none;overflow:hidden;box-shadow:0 6px 16px -6px rgba(0,0,0,.3)}
.bc-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:10px}
.bc-org{flex:1;min-width:0;padding-right:38px}
.bc-org-name{font-size:13px;font-weight:700;line-height:1.2}
.bc-org-sub{font-size:9.5px;opacity:.82;margin-top:1px}
.bc-label{font-size:10.5px;opacity:.88;font-weight:500;margin-top:10px;position:relative;z-index:2;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bc-amount{font-size:28px;font-weight:700;letter-spacing:-.8px;margin-top:2px;line-height:1.15;position:relative;z-index:2}
.bc-sub{font-size:10px;opacity:.72;margin-top:3px;position:relative;z-index:2}
.bc-breakdown{font-size:9.5px;opacity:.82;margin-top:5px;position:relative;z-index:2;display:flex;gap:10px;flex-wrap:wrap}
.bc-stats{display:flex;gap:8px;margin-top:10px;position:relative;z-index:2}
.bc-stat{flex:1;background:rgba(255,255,255,.15);border-radius:11px;padding:8px 10px;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);cursor:pointer;transition:background .15s}
.bc-stat:active{background:rgba(255,255,255,.25)}
.bc-stat .k{font-size:9.5px;opacity:.92;display:flex;align-items:center;gap:4px}
.bc-stat .k svg{width:10px;height:10px}
.bc-stat .v{font-size:13.5px;font-weight:700;margin-top:2px}
.bc-manual-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.3);padding:2px 7px;border-radius:99px;font-size:9px;font-weight:600;backdrop-filter:blur(6px)}
.bc-reset-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(220,38,38,.4);border:1px solid rgba(255,255,255,.4);padding:2px 7px;border-radius:99px;font-size:9px;font-weight:600;backdrop-filter:blur(6px)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.stat{background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:13px;box-shadow:var(--shadow);position:relative;overflow:hidden;backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)}
.stat::before{content:'';position:absolute;top:0;left:10px;right:10px;height:1px;background:linear-gradient(90deg,transparent,var(--glass-hi),transparent);pointer-events:none}
.stat.clickable{cursor:pointer}
.stat .k{font-size:10.5px;color:var(--text-2);font-weight:500;line-height:1.3}
.stat .v{font-size:16px;font-weight:700;margin-top:3px}
.list{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative;backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%)}
.list::before{content:'';position:absolute;top:0;left:14px;right:14px;height:1px;background:linear-gradient(90deg,transparent,var(--glass-hi),transparent);pointer-events:none;z-index:1}
.li{display:flex;align-items:center;gap:12px;padding:13px 15px;transition:background .15s;cursor:pointer}
.li:active{background:rgba(255,255,255,.45)}
[data-theme="dark"] .li:active{background:rgba(255,255,255,.05)}
.li+.li{border-top:1px solid var(--border-2)}
.li .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.li .ic svg{width:17px;height:17px}
.li .t{font-size:13.5px;font-weight:600;line-height:1.35}
.li .s{font-size:11px;color:var(--text-3);margin-top:2px}
.li .amt{font-size:14px;font-weight:700;white-space:nowrap}
.li > .chev{width:20px;height:20px;color:var(--text-3);flex:none;display:flex;align-items:center;justify-content:center}
.li > .chev svg{width:18px;height:18px}
.amt.pos{color:var(--income)}.amt.neg{color:var(--expense)}
.prog{height:8px;border-radius:99px;background:var(--border);overflow:hidden;position:relative}
.prog>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary-l),var(--primary));transition:width .8s;box-shadow:0 0 12px rgba(27,128,68,.5)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--card);border:1px solid var(--card-border);color:var(--text-2);flex:none;cursor:pointer;backdrop-filter:blur(12px)}
.chip.on{background:linear-gradient(135deg,var(--primary-l),var(--primary));border-color:var(--primary);color:#fff}
.searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:0 13px;height:46px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}
.searchbar svg{width:17px;height:17px;color:var(--text-3);flex:none}
.searchbar input{flex:1;border:none;outline:none;background:none;font-size:13.5px;height:100%}
.bottomnav{position:absolute;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.62);border-top:1px solid rgba(255,255,255,.85);display:flex;z-index:40;backdrop-filter:blur(36px) saturate(220%);-webkit-backdrop-filter:blur(36px) saturate(220%);box-shadow:0 -12px 34px -14px rgba(14,95,48,.22),inset 0 1px 0 rgba(255,255,255,.95)}
[data-theme="dark"] .bottomnav{background:rgba(15,26,21,.62);border-top:1px solid rgba(255,255,255,.12);box-shadow:0 -12px 34px -14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1)}
.bottomnav .nv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);position:relative;padding-top:2px;cursor:pointer}
.bottomnav .nv svg{width:20px;height:20px;transition:transform .15s}
.bottomnav .nv span{font-size:9px;font-weight:600}
.bottomnav .nv.on{color:var(--primary)}
.bottomnav .nv.on svg{transform:scale(1.08)}
.bottomnav .nv.on::before{content:'';position:absolute;top:0;width:30px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--primary-l),var(--primary));box-shadow:0 2px 8px rgba(27,128,68,.6)}
.subpage{position:absolute;inset:0;background:linear-gradient(160deg,#EAF4EE 0%,#D4E7DC 100%);z-index:60;display:flex;flex-direction:column;animation:slideIn .26s ease}
[data-theme="dark"] .subpage{background:linear-gradient(160deg,#0A1810 0%,#030806 100%)}
@keyframes slideIn{from{transform:translateX(28px);opacity:.3}to{transform:translateX(0);opacity:1}}
.subhd{display:flex;align-items:center;gap:10px;padding:14px 16px;background:rgba(255,255,255,.78);border-bottom:1px solid var(--card-border);flex:none;position:sticky;top:0;z-index:5;backdrop-filter:blur(18px)}
[data-theme="dark"] .subhd{background:rgba(15,26,21,.78)}
.subhd h1{font-size:16.5px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subbody{flex:1;overflow-y:auto;padding-bottom:34px}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:120;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(5px)}
.modal{background:var(--bg);width:100%;max-width:540px;border-radius:26px 26px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:slideUp .3s ease;box-shadow:0 -20px 60px rgba(0,0,0,.3)}
@keyframes slideUp{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
.modal-hd{padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border-2);flex:none}
.modal-hd h2{margin:0;font-size:16px;font-weight:700;flex:1}
.modal-body{flex:1;overflow-y:auto;padding:18px}
.modal-foot{padding:14px 18px;border-top:1px solid var(--border-2);flex:none;display:flex;gap:10px;background:var(--card);backdrop-filter:blur(14px)}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;height:46px;border-radius:13px;border:1.5px solid var(--border);background:var(--card);padding:0 13px;outline:none;transition:border-color .18s;font-size:14px;backdrop-filter:blur(10px)}
.field textarea{height:auto;min-height:80px;padding:11px 13px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3.5px var(--primary-soft)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:16px;font-size:12.5px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:all .28s;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.success{background:linear-gradient(135deg,var(--income),#0E7A38);color:#fff}
.toast.error{background:linear-gradient(135deg,#E11D48,var(--danger));color:#fff}
.empty{padding:36px 24px;text-align:center;color:var(--text-3)}
.empty .eic{width:60px;height:60px;border-radius:20px;background:var(--card);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.empty .eic svg{width:26px;height:26px;color:var(--text-3)}
.empty h3{margin:0 0 5px;font-size:13.5px;color:var(--text-2);font-weight:600}
.empty p{margin:0;font-size:12px}
.login{padding:0 24px;display:flex;flex-direction:column;justify-content:center;min-height:100%;position:relative;overflow:hidden}
.login-logo{width:90px;height:90px;border-radius:26px;overflow:hidden;background:#fff;padding:5px;margin:0 auto 18px;box-shadow:0 18px 38px -12px rgba(14,95,48,.6)}
.login-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:21px}
.login-logo .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary-l),var(--primary));border-radius:21px;color:#fff;font-weight:800;font-size:28px}
.login h1{font-size:22px;margin:0 0 6px;font-weight:700;text-align:center;color:var(--primary)}
.login .tag{font-size:13.5px;color:var(--text-2);margin:0 0 30px;line-height:1.6;text-align:center}
.gbtn{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;height:52px;border-radius:16px;background:var(--card);border:1.5px solid var(--border);font-weight:600;font-size:14px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
.gbtn svg{width:19px;height:19px}
.divider{display:flex;align-items:center;gap:12px;color:var(--text-3);font-size:11px;margin:16px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.splash{position:absolute;inset:0;background:linear-gradient(160deg,#0E5F30,#083A1C 60%,#041A0C);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:300;color:#fff}
.splash .logo-big{width:110px;height:110px;border-radius:30px;background:#fff;padding:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.splash .logo-big img{width:100%;height:100%;object-fit:contain;display:block;border-radius:24px}
.splash h1{font-size:22px;margin:0;font-weight:700}
.splash p{margin:0;font-size:12.5px;opacity:.85}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.offline{background:var(--warn-soft);color:var(--warn);font-size:11.5px;font-weight:600;padding:7px 16px;display:flex;align-items:center;justify-content:center;gap:7px;flex:none}
.anim{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.anim-d1{animation-delay:.05s}.anim-d2{animation-delay:.1s}.anim-d3{animation-delay:.15s}.anim-d4{animation-delay:.2s}.anim-d5{animation-delay:.25s}
.info-box{background:var(--info-soft);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--info);font-weight:500;line-height:1.6}

function isValidPhone(n){if(!n)return false;return n.length>=PHONE_MIN_DIGITS&&n.length<=PHONE_MAX_DIGITS}
function txTimestamp(t){if(!t)return 0;if(t.createdAt)return Number(t.createdAt);if(t.ts)return Number(t.ts);if(t.date){try{return parseISO(t.date).getTime()}catch(e){return 0}}return 0}
function statsResetAt(){return (DB.org&&DB.org.statsResetAt)?Number(DB.org.statsResetAt):0}

function avatarHTML(m,size){
  size=size||46;
  var color=(m&&m.color)||'#0E5F30';
  var nm=(m&&(m.name||m.nameEn))||'?';
  var ini=nm.split(' ').filter(Boolean).map(function(w){return w[0]}).slice(0,2).join('').toUpperCase()||'?';
  var photoUrl=m&&m.photo?String(m.photo).trim():'';
  if(photoUrl){
    return '<div class="avatar" style="width:'+size+'px;height:'+size+'px;background:'+color+';padding:0;border:2px solid '+color+'">'+
      '<img src="'+esc(photoUrl)+'" alt="'+esc(nm)+'" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:50%" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span style=&quot;color:#fff;font-weight:700;font-size:'+Math.round(size*0.36)+'px&quot;>'+ini+'</span>\'"/>'+
    '</div>';
  }
  return '<div class="avatar" style="--c:'+color+';width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*0.36)+'px">'+ini+'</div>';
}
function toast(msg,type){
  var t=$('#toast');t.textContent=msg;t.className='toast show'+(type?' '+type:'');
  clearTimeout(t._tm);t._tm=setTimeout(function(){t.classList.remove('show')},2400);
}
function vibrate(ms){try{navigator.vibrate&&navigator.vibrate(ms||8)}catch(e){}}
function catBn(k,arr){var c=arr.filter(function(x){return x.k===k})[0];return c?c.bn:k}
function purposeBn(k){var p=EXTRA_PAYMENT_PURPOSES.filter(function(x){return x.k===k})[0];return p?p.bn:k}

var DATA={
  stats:function(){
    var resetAt=statsResetAt();
    var income=0,expense=0;
    DB.transactions.forEach(function(t){
      var ts=txTimestamp(t);
      if(resetAt>0&&ts<resetAt) return;
      if(t.type==='contribution'||t.type==='donation'||t.type==='other_income'||t.type==='extra_payment') income+=Number(t.amount||0);
      else expense+=Number(t.amount||0);
    });
    var opening = DB.org && DB.org.manualBalance;
    var hasOpening = (opening!==undefined && opening!==null && opening!=='');
    var openingNum = hasOpening ? Number(opening) : 0;
    var autoBal = income - expense;
    var finalBalance = openingNum + autoBal;
    return {
      income: income,
      expense: expense,
      opening: openingNum,
      hasOpening: hasOpening,
      autoBal: autoBal,
      balance: finalBalance,
      resetActive: resetAt>0,
      resetAt: resetAt
    };
  },
  memberContribs:function(id){return DB.contributions.filter(function(c){return c.memberId===id})},
  memberExtras:function(id){return DB.extraPayments.filter(function(x){return x.memberId===id})},
  memberSummary:function(id){
    var cs=this.memberContribs(id);
    var expected=cs.reduce(function(a,b){return a+(b.amount||0)},0);
    var paid=cs.reduce(function(a,b){return a+(b.paidAmount||0)},0);
    var extraTotal=this.memberExtras(id).reduce(function(a,b){return a+(b.amount||0)},0);
    return {expected:expected,paid:paid,due:expected-paid,percent:expected?Math.round(paid/expected*100):0,extraTotal:extraTotal};
  },
  totalDue:function(){var d=0;DB.members.forEach(function(m){var s=DATA.memberSummary(m.id);if(s.due>0)d+=s.due});return d},
  nextMemberId:function(){var mx=0;DB.members.forEach(function(m){var n=parseInt(String(m.id||'').replace(/\D/g,''),10)||0;if(n>mx)mx=n});return 'DP-'+String(mx+1).padStart(3,'0')},
  upcomingEvents:function(){return DB.events.filter(function(e){return !e.isCompleted}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'')})},
  pastEvents:function(){return DB.events.filter(function(e){return e.isCompleted}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')})},
  nextEvent:function(){var u=this.upcomingEvents();return u.length?u[0]:null},
  recentPastEvents:function(n){return this.pastEvents().slice(0,n||3)},
  pendingPayments:function(){return DB.paymentRequests.filter(function(r){return r.status==='pending'})},
  eventAutoExpenses:function(eid){return DB.transactions.filter(function(t){return t.eventId===eid&&t.type==='event_expense'&&t.autoGenerated===true})},
  sentNotifications:function(){return DB.notifications.slice().sort(function(a,b){return (b.timestamp||b.createdAt||0)-(a.timestamp||a.createdAt||0)})}
};

async function syncContributionTransaction(cid, memId, memName, yy, mm, paidAmount, paidDate){
  try{
    var existing = DB.transactions.filter(function(t){return t.contributionId === cid;});
    if(paidAmount > 0){
      var txData = {
        date: paidDate || toISO(new Date()),
        type: 'contribution',
        amount: paidAmount,
        category: 'মাসিক চাঁদা',
        desc: (memName||'সদস্য') + ' — ' + MN(mm) + ' ' + yy,
        memberId: memId,
        contributionId: cid,
        year: yy,
        month: mm,
        updatedAt: Date.now()
      };
      if(existing.length > 0){
        await db.collection('transactions').doc(existing[0].id).update(txData);
        for(var i=1;i<existing.length;i++){try{await db.collection('transactions').doc(existing[i].id).delete();}catch(e){}}
      }else{
        txData.addedBy = state.admin ? state.admin.name : 'system';
        txData.createdAt = Date.now();
        await db.collection('transactions').add(txData);
      }
    }else{
      for(var i=0;i<existing.length;i++){try{await db.collection('transactions').doc(existing[i].id).delete();}catch(e){}}
    }
  }catch(e){console.warn('syncContributionTransaction failed:',e);}
}

async function autoSyncAllOldData(){
  try{
    var added = 0;
    for(var i=0;i<DB.contributions.length;i++){
      var c = DB.contributions[i];
      var paid = Number(c.paidAmount||0);
      if(paid <= 0) continue;
      var existingTx = DB.transactions.filter(function(t){return t.contributionId === c.id;});
      if(existingTx.length > 0) continue;
      var mem = DB.members.filter(function(m){return m.id===c.memberId})[0];
      var memName = mem ? (mem.name || mem.nameEn || 'সদস্য') : 'সদস্য';
      await db.collection('transactions').add({
        date: c.paidDate || toISO(new Date()),
        type: 'contribution',
        amount: paid,
        category: 'মাসিক চাঁদা',
        desc: memName + ' — ' + MN(c.month) + ' ' + c.year,
        memberId: c.memberId,
        contributionId: c.id,
        year: c.year,
        month: c.month,
        addedBy: 'auto-sync',
        createdAt: c.paidDate ? new Date(c.paidDate).getTime() : Date.now(),
        autoSynced: true
      });
      added++;
    }
    for(var i=0;i<DB.extraPayments.length;i++){
      var x = DB.extraPayments[i];
      var amt = Number(x.amount||0);
      if(amt <= 0) continue;
      var existingTx2 = DB.transactions.filter(function(t){return t.extraPaymentId === x.id;});
      if(existingTx2.length > 0) continue;
      await db.collection('transactions').add({
        date: x.date || toISO(new Date()),
        type: 'extra_payment',
        amount: amt,
        category: 'অতিরিক্ত জমা',
        desc: (x.memberName||'সদস্য') + ' — ' + (x.purposeBn || purposeBn(x.purpose)),
        memberId: x.memberId,
        extraPaymentId: x.id,
        addedBy: 'auto-sync',
        createdAt: Date.now(),
        autoSynced: true
      });
      added++;
    }
    for(var i=0;i<DB.paymentRequests.length;i++){
      var r = DB.paymentRequests[i];
      if(r.status !== 'approved') continue;
      var existingTx3 = DB.transactions.filter(function(t){return t.paymentRequestId === r.id;});
      if(existingTx3.length > 0) continue;
      var txType='other_income', txCategory='অন্যান্য আয়';
      if(r.type==='monthly'){txType='contribution';txCategory='মাসিক চাঁদা';}
      else if(r.type==='event'){txType='contribution';txCategory='ইভেন্ট চাঁদা';}
      else if(r.type==='donation'){txType='donation';txCategory='অনুদান';}
      else if(r.type==='extra'){txType='extra_payment';txCategory='অতিরিক্ত জমা';}
      await db.collection('transactions').add({
        date: r.date || toISO(new Date()),
        type: txType,
        amount: Number(r.amount||0),
        category: txCategory,
        desc: (r.memberName||'সদস্য') + ' — পেমেন্ট রিকোয়েস্ট',
        memberId: r.memberId || '',
        paymentRequestId: r.id,
        note: r.note || '',
        addedBy: 'auto-sync',
        createdAt: r.ts || Date.now(),
        autoSynced: true
      });
      added++;
    }
    if(added > 0){
      console.log('Auto-synced '+added+' entries');
      toast('✅ '+added+' টি পুরনো এন্ট্রি ব্যালেন্সে যোগ হয়েছে','success');
    }
  }catch(e){console.error('autoSyncAllOldData failed:',e);}
}

function openModal(opts){
  var root=$('#modalRoot');
  var back=document.createElement('div');
  back.className='modal-back';
  back.innerHTML='<div class="modal"><div class="modal-hd"><button class="icon-btn" data-mclose="1" style="width:34px;height:34px">'+icon('x')+'</button><h2>'+opts.title+'</h2></div><div class="modal-body">'+opts.body+'</div>'+(opts.footer?'<div class="modal-foot">'+opts.footer+'</div>':'')+'</div>';
  root.appendChild(back);
  back.addEventListener('click',function(e){if(e.target===back||e.target.closest('[data-mclose]')) closeModal()});
  if(opts.onMount) opts.onMount(back);
  return back;
}

/* ===== CONTRIBUTIONS ===== */
function viewContributions(){
  var now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1;
  var y=state.contribYear||cy,m=state.contribMonth||cm;
  var exp=0,col=0;
  DB.contributions.forEach(function(c){if(c.year===y&&c.month===m){exp+=c.amount||0;col+=c.paidAmount||0}});
  var pct=exp?Math.round(col/exp*100):0;
  var rows=DB.contributions.filter(function(c){return c.year===y&&c.month===m}).map(function(c){return {c:c,mem:DB.members.filter(function(x){return x.id===c.memberId})[0]}}).filter(function(x){return x.mem});
  var h='';
  h+='<div class="hd anim"><div><h1>চাঁদা ব্যবস্থাপনা</h1><div class="sub">'+y+'</div></div></div>';
  var ys=[];for(var yy=cy-2;yy<=cy+1;yy++)ys.push(yy);
  h+='<div class="chips anim anim-d1" style="margin-top:6px">'+ys.map(function(yy){return '<button class="chip'+(yy===y?' on':'')+'" data-act="cyear" data-v="'+yy+'">'+yy+'</button>'}).join('')+'</div>';
  h+='<div class="chips anim anim-d2" style="margin-top:8px">'+BN_MONTHS.map(function(nm,i){var mm=i+1;return '<button class="chip'+(mm===m?' on':'')+'" data-act="cmonth" data-v="'+mm+'">'+MNS(mm)+'</button>'}).join('')+'</div>';
  h+='<div class="sec anim anim-d3" style="margin-top:14px"><div class="stat-grid"><div class="stat"><div class="k">প্রত্যাশিত</div><div class="v">'+money(exp)+'</div></div><div class="stat"><div class="k">সংগৃহীত</div><div class="v" style="color:var(--income)">'+money(col)+'</div></div><div class="stat"><div class="k">বাকি</div><div class="v" style="color:var(--expense)">'+money(exp-col)+'</div></div><div class="stat"><div class="k">সংগ্রহ</div><div class="v">'+pct+'%</div></div></div><div class="prog mt14"><i style="width:'+pct+'%"></i></div></div>';
  h+='<div class="sec anim anim-d4"><div class="sec-hd"><h2>'+MN(m)+' '+y+'</h2><span class="tiny muted">'+rows.length+' জন</span></div>';
  if(!rows.length){h+='<div class="empty"><div class="eic">'+icon('wallet')+'</div><h3>নেই</h3></div>';}
  else{h+='<div class="list">'+rows.map(function(x){var st=x.c.status||'due';var lb=st==='paid'?'পরিশোধিত':(st==='due'?'বাকি':'আংশিক');return '<div class="li" data-act="edit-contribution" data-id="'+esc(x.c.id||'')+'">'+avatarHTML(x.mem,38)+'<div class="grow"><div class="t ell">'+esc(mname(x.mem))+'</div><div class="s">'+(x.mem.id||'')+'</div></div><span class="pill '+st+'">'+lb+'</span></div>'}).join('')+'</div>';}
  h+='</div>';return h;
}

async function saveEvent(eventId){
  var isEdit=!!eventId;var container=document.getElementById('eventForm');
  var id=eventId||(container&&container.getAttribute('data-id'));
  var oldE=isEdit?DB.events.filter(function(x){return x.id===eventId})[0]:null;
  var wasC=!!(oldE&&oldE.isCompleted);
  var title=(document.getElementById('evTitle')||{}).value.trim();
  var desc=(document.getElementById('evDesc')||{}).value.trim();
  var date=(document.getElementById('evDate')||{}).value;
  var dl=(document.getElementById('evDeadline')||{}).value;
  var fee=parseInt((document.getElementById('evFee')||{}).value)||0;
  var loc=(document.getElementById('evLocation')||{}).value.trim();
  var stat=(document.getElementById('evStatus')||{}).value;
  var tc=parseInt((document.getElementById('evTotalCost')||{}).value)||0;
  if(!title){toast('শিরোনাম দিন','error');return}
  if(!date){toast('তারিখ দিন','error');return}
  var isNowC=(stat==='past');
  var data={title:title,description:desc,date:date,deadline:dl||null,fee:fee,totalCost:tc,location:loc,isCompleted:isNowC,updatedAt:Date.now()};
  try{
    var sid;
    if(isEdit){await db.collection('events').doc(id).update(data);sid=id;audit('event_edit',id,title,'','');toast('হালনাগাদ','success');}
    else{sid='EV-'+Date.now();data.createdBy=state.admin.name;data.createdAt=Date.now();await db.collection('events').doc(sid).set(data);audit('event_add',sid,title,'','');toast('তৈরি','success');}
    if(!wasC&&isNowC){await createEventExpense(sid,data);}
    else if(wasC&&!isNowC){await reverseEventExpense(sid);}
    popPage();
  }catch(err){toast('Error: '+err.message,'error')}
}
async function createEventExpense(eid,ed){
  try{
    var ex=DATA.eventAutoExpenses(eid);
    if(ex.length)return;
    var amt=ed.totalCost&&Number(ed.totalCost)>0?Number(ed.totalCost):(Number(ed.fee||0)*DB.members.filter(function(m){return m.status==='active'}).length);
    if(amt<=0)return;
    await db.collection('transactions').add({date:ed.date||toISO(new Date()),type:'event_expense',amount:amt,category:'ইভেন্ট ব্যয়',desc:(ed.title||'ইভেন্ট')+' — স্বয়ংক্রিয়',eventId:eid,eventTitle:ed.title||'',autoGenerated:true,addedBy:'system',createdAt:Date.now()});
    await db.collection('events').doc(eid).update({autoExpensed:true,autoExpenseAmount:amt,autoExpensedAt:Date.now()});
    await audit('event_auto_expense',eid,'',amt);toast('✅ '+money(amt)+' কাটা হয়েছে','success');
  }catch(err){console.error(err);toast('⚠️ '+err.message,'error')}
}
async function reverseEventExpense(eid){
  try{
    var ex=DATA.eventAutoExpenses(eid);
    if(!ex.length)return 0;
    var t=0;
    for(var i=0;i<ex.length;i++){t+=Number(ex[i].amount||0);try{await db.collection('transactions').doc(ex[i].id).delete()}catch(e){}}
    try{await db.collection('events').doc(eid).update({autoExpensed:false,autoExpenseAmount:0,autoExpensedAt:firebase.firestore.FieldValue.delete(),autoExpenseReversedAt:Date.now()})}catch(e){}
    if(t>0){await audit('event_expense_reversed',eid,t,0);toast('↩️ '+money(t)+' ফিরেছে','success')}
    return t;
  }catch(err){return 0}
}
function confirmDeleteEvent(eid){
  var e=DB.events.filter(function(x){return x.id===eid})[0];if(!e)return;
  var ax=DATA.eventAutoExpenses(eid);
  var at=ax.reduce(function(a,b){return a+Number(b.amount||0)},0);
  var msg=e.title;if(at>0)msg+='\n\n⚠️ স্বয়ংক্রিয় ব্যয় '+money(at)+'ও মুছে যাবে → ফিরে আসবে।';
  confirmDialog('মুছুন?',msg,async function(){
    try{
      for(var i=0;i<ax.length;i++){try{await db.collection('transactions').doc(ax[i].id).delete()}catch(e){}}
      await db.collection('events').doc(eid).delete();
      await audit('event_delete',eid,e.title,'',at>0?'reversed '+money(at):'');
      popPage();toast('✅ মুছে','success');
    }catch(err){toast('Error: '+err.message,'error')}
  },'মুছুন');
}

async function approvePayment(rid){
  var r=DB.paymentRequests.filter(function(x){return x.id===rid})[0];
  if(!r){toast('নেই','error');return}
  if(r.status!=='pending'){toast('প্রসেস হয়েছে','error');return}
  try{
    await db.collection('paymentRequests').doc(rid).update({status:'approved',approvedAt:Date.now(),approvedBy:state.admin.name});
    var txType='other_income', txCategory='অন্যান্য আয়';
    if(r.type==='monthly'){txType='contribution';txCategory='মাসিক চাঁদা';}
    else if(r.type==='event'){txType='contribution';txCategory='ইভেন্ট চাঁদা';}
    else if(r.type==='donation'){txType='donation';txCategory='অনুদান';}
    else if(r.type==='extra'){txType='extra_payment';txCategory='অতিরিক্ত জমা';}
    var contributionId=null;
    if(r.type==='monthly' && r.memberId && r.forMonth && r.forYear){
      contributionId='CN-'+r.memberId+'-'+r.forYear+pad2(r.forMonth);
      var existingC=DB.contributions.filter(function(c){return c.id===contributionId})[0];
      if(existingC){
        var newPaid=(existingC.paidAmount||0)+Number(r.amount||0);
        var newSt=newPaid>=existingC.amount?'paid':(newPaid>0?'partial':'due');
        await db.collection('contributions').doc(contributionId).update({paidAmount:newPaid,status:newSt,paidDate:r.date||toISO(new Date()),updatedAt:Date.now()});
      }
    }
    await db.collection('transactions').add({date:r.date||toISO(new Date()),type:txType,amount:Number(r.amount||0),category:txCategory,desc:(r.memberName||'সদস্য')+' — পেমেন্ট রিকোয়েস্ট',memberId:r.memberId||'',contributionId:contributionId,paymentRequestId:rid,note:r.note||'',addedBy:state.admin.name,createdAt:Date.now()});
    await audit('payment_approved',rid,'',r.amount);
    toast('✓ অনুমোদিত — '+money(r.amount)+' যোগ হয়েছে','success');
  }catch(err){console.error(err);toast('Error: '+err.message,'error')}
}
async function rejectPayment(rid){
  var r=DB.paymentRequests.filter(function(x){return x.id===rid})[0];
  if(!r){toast('নেই','error');return}
  try{
    if(r.status==='approved'){
      var linked=DB.transactions.filter(function(t){return t.paymentRequestId===rid;});
      for(var i=0;i<linked.length;i++){try{await db.collection('transactions').doc(linked[i].id).delete();}catch(e){}}
    }
    await db.collection('paymentRequests').doc(rid).update({status:'rejected',rejectedAt:Date.now(),rejectedBy:state.admin.name});
    toast('বাতিল','success');
  }catch(err){toast('Error: '+err.message,'error')}
}

function formEditExpected(memberId){
  var m=DB.members.filter(function(x){return x.id===memberId})[0];
  if(!m){toast('পাওয়া যায়নি','error');return}
  var now=new Date();
  var cs=DATA.memberContribs(memberId);
  var years=[];cs.forEach(function(c){if(years.indexOf(c.year)<0)years.push(c.year)});
  if(years.indexOf(now.getFullYear())<0) years.push(now.getFullYear());
  years.sort(function(a,b){return b-a});
  var defaultYear=years[0];
  function build(year){
    var yc=cs.filter(function(c){return c.year===year});
    var html='';
    BN_MONTHS.forEach(function(mn,idx){
      var mo=idx+1;
      var c=yc.filter(function(x){return x.month===mo})[0];
      var val = c ? (c.amount||0) : 0;
      var exists = c ? '1' : '0';
      var cidAttr = c ? (c.id||'') : '';
      var badge = c ? '' : '<span class="pill important" style="margin-left:6px;font-size:9px">নতুন</span>';
      html+='<div class="month-edit-row"><div class="mlbl">'+mn+badge+'</div><input type="number" data-month="'+mo+'" data-exists="'+exists+'" data-cid="'+cidAttr+'" value="'+val+'" min="0" placeholder="0"/></div>';
    });
    return html;
  }
  openModal({
    title:'প্রত্যাশিত চাঁদা এডিট',
    body:
      '<div class="info-box" style="line-height:1.8">'+

        '🔹 যেসব মাসে চাঁদা নেই সেগুলোতে পরিমাণ দিলে <b>নতুন রেকর্ড তৈরি হবে</b><br>'+
        '🔹 বিদ্যমান মাসের মান পরিবর্তন করলে <b>আপডেট হবে</b><br>'+
        '🔹 <b>০</b> দিলে চাঁদা হবে না'+
      '</div>'+
      '<div class="field mt14"><label>বছর</label><select id="feYear">'+years.map(function(y){return '<option value="'+y+'" '+(y===defaultYear?'selected':'')+'>'+y+'</option>'}).join('')+'</select></div>'+
      '<div class="month-edit-list" id="feMonthsList">'+build(defaultYear)+'</div>',
    footer:'<button class="btn ghost grow" data-mclose="1">বাতিল</button><button class="btn grow" id="feSave">'+icon('check')+' সংরক্ষণ</button>',
    onMount:function(mr){
      var yearSel=mr.querySelector('#feYear');
      var list=mr.querySelector('#feMonthsList');
      yearSel.addEventListener('change',function(){list.innerHTML=build(parseInt(yearSel.value))});
      mr.querySelector('#feSave').addEventListener('click',async function(){
        var y=parseInt(yearSel.value);
        var inputs=list.querySelectorAll('input[data-month]');
        var updated=0, created=0;
        for(var i=0;i<inputs.length;i++){
          var inp=inputs[i];
          var mo=parseInt(inp.dataset.month);
          var newAmt=Math.max(0,parseInt(inp.value)||0);
          var exists=inp.dataset.exists==='1';
          var oldCid=inp.dataset.cid;
          if(exists){
            var oldC=cs.filter(function(x){return x.year===y&&x.month===mo})[0];
            if(!oldC) continue;
            if((oldC.amount||0)===newAmt) continue;
            try{
              await db.collection('contributions').doc(oldCid).update({amount:newAmt,updatedAt:Date.now()});
              updated++;
            }catch(e){console.warn(e)}
          }else{
            if(newAmt<=0) continue;
            var cid='CN-'+memberId+'-'+y+pad2(mo);
            try{
              await db.collection('contributions').doc(cid).set({
                memberId:memberId,year:y,month:mo,amount:newAmt,
                paidAmount:0,status:'due',paidDate:null,createdAt:Date.now()
              });
              created++;
            }catch(e){console.warn(e)}
          }
        }
        audit('expected_edit',m.id,'','','updated:'+updated+' created:'+created);
        closeModal();
        if(updated+created>0){
          var msg=[];
          if(updated>0) msg.push(updated+' আপডেট');
          if(created>0) msg.push(created+' নতুন');
          toast('✅ '+msg.join(' · '),'success');
        } else {
          toast('কোনো পরিবর্তন নেই');
        }
      });
    }
  });
}
function formEditAnnouncement(id){

          if(isEdit){await db.collection('announcements').doc(id).update({title:t,body:b,date:dt,updatedAt:Date.now()});await audit('ann_edit',id,a.title,t);}
          else{await db.collection('announcements').add({title:t,body:b,date:dt,createdAt:Date.now(),createdBy:state.admin.name});await audit('ann_add','',t,'','');}
          toast('✅','success');closeModal();
        }catch(e){toast('❌ '+e.message,'error')}

function pushPage(name,params){state.stack.push(Object.assign({name:name},params||{}));render()}
function popPage(){state.stack.pop();render()}
function switchTab(t){if(state.tab===t&&!state.stack.length){var c=$('#content');if(c)c.scrollTop=0;return}state.stack=[];state.tab=t;render();var c=$('#content');if(c)c.scrollTop=0}

state.loading=true;render();
auth.onAuthStateChanged(async function(user){
  if(!user){state.admin=null;state.role=null;state.loading=false;render();return}
  try{
    var aSnap=await db.collection('admins').doc(user.uid).get();
    if(!aSnap.exists){toast('আপনি অ্যাডমিন নন','error');await auth.signOut();return}
    var ad=aSnap.data();
    state.admin=Object.assign({uid:user.uid,email:user.email,name:ad.name||user.email},ad);
    state.role=ad.role||'admin';
    await loadAllData();
    setupRealtimeListeners();
    state.loading=false;render();
    setTimeout(function(){autoSyncAllOldData().catch(function(){})},1500);
    toast('স্বাগতম, '+state.admin.name,'success');
  }catch(err){console.error(err);toast('ত্রুটি: '+err.message,'error');state.loading=false;render()}
});
async function loadAllData(){
  try{
    var orgSnap=await db.collection('org').doc('settings').get();
    if(orgSnap.exists)DB.org=orgSnap.data();
    var results=await Promise.all([
      db.collection('members').get(),
      db.collection('contributions').get(),
      db.collection('transactions').get(),
      db.collection('announcements').get(),
      db.collection('notifications').get(),
      db.collection('extraPayments').get(),
      db.collection('paymentRequests').get(),
      db.collection('events').get(),
      db.collection('userPosts').get()
    ]);
    DB.members=results[0].docs.map(function(d){return Object.assign({},d.data(),{_docId:d.id})});
    DB.contributions=results[1].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.transactions=results[2].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.announcements=results[3].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.notifications=results[4].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.extraPayments=results[5].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.paymentRequests=results[6].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.events=results[7].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.userPosts=results[8].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
  }catch(err){console.error('Load failed:',err);toast('লোড ব্যর্থ: '+err.message,'error')}
}
function setupRealtimeListeners(){
  db.collection('members').onSnapshot(function(s){DB.members=s.docs.map(function(d){return Object.assign({},d.data(),{_docId:d.id})});if(!state.loading)render()});
  db.collection('contributions').onSnapshot(function(s){DB.contributions=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()});
  db.collection('transactions').onSnapshot(function(s){DB.transactions=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()});
  db.collection('announcements').onSnapshot(function(s){DB.announcements=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()});
  db.collection('notifications').onSnapshot(function(s){DB.notifications=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()});
  db.collection('extraPayments').onSnapshot(function(s){DB.extraPayments=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()});
  db.collection('paymentRequests').onSnapshot(function(s){DB.paymentRequests=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()});
  db.collection('events').onSnapshot(function(s){DB.events=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()});
  db.collection('userPosts').onSnapshot(function(s){DB.userPosts=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()});
  db.collection('org').doc('settings').onSnapshot(function(s){if(s.exists)DB.org=s.data();else DB.org={};if(!state.loading)render()});
  db.collection('auditLogs').orderBy('ts','desc').limit(200).onSnapshot(function(s){DB.auditLogs=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()});
}
