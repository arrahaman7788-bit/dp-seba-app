<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0E5F30"/>
<title>DP সেবা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#0E5F30;--primary-d:#083A1C;--primary-l:#1B8044;--primary-soft:#E5F2EA;--accent:#C41E3A;--accent-soft:#FCE7EC;--gold:#D4A017;--gold-soft:#FBF3DC;--income:#16A34A;--income-soft:#E6F7EE;--expense:#DC2626;--expense-soft:#FDE8ED;--event:#EA580C;--event-soft:#FEF0E7;--warn:#D97706;--warn-soft:#FEF3C7;--info:#0284C7;--info-soft:#E0F2FE;--danger:#B91C1C;--danger-soft:#FEE2E2;--bg:#EAF4EE;--bg-2:#D4E7DC;--text:#0A1A12;--text-2:#4E5F55;--text-3:#8B9A92;--border:#DCE7E1;--border-2:#E9F2ED;--card:rgba(255,255,255,.72);--card-2:rgba(255,255,255,.5);--card-border:rgba(255,255,255,.85);--glass-hi:rgba(255,255,255,.95);--shadow:0 8px 24px -10px rgba(14,95,48,.16),0 2px 6px -2px rgba(14,95,48,.06);--radius:20px;--nav-h:66px}
[data-theme="dark"]{--primary:#22A155;--primary-d:#0E5F30;--primary-l:#3DC76F;--primary-soft:#0A2A18;--accent:#FF4D6D;--accent-soft:#3A0F1A;--gold:#FBBF24;--gold-soft:#3A2E10;--income:#2ECC71;--income-soft:#12301F;--expense:#FF5C7A;--expense-soft:#3A1520;--event:#FB923C;--event-soft:#3A2110;--warn:#FBBF24;--warn-soft:#3A2E10;--info:#38BDF8;--info-soft:#0C2A3A;--danger:#F87171;--danger-soft:#3A1010;--bg:#06100B;--bg-2:#030806;--text:#E8F5EE;--text-2:#95B3A5;--text-3:#627A70;--border:#1C2E24;--border-2:#15241C;--card:rgba(15,26,21,.62);--card-2:rgba(21,36,29,.5);--card-border:rgba(255,255,255,.09);--glass-hi:rgba(255,255,255,.09);--shadow:0 8px 24px -10px rgba(0,0,0,.55)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:'Hind Siliguri',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-2);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:0;height:0}
#app{position:relative;max-width:540px;margin:0 auto;height:100dvh;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 12% 6%,rgba(34,161,85,.24),transparent 42%),radial-gradient(circle at 90% 80%,rgba(196,30,58,.16),transparent 46%),radial-gradient(circle at 45% 102%,rgba(212,160,23,.16),transparent 46%),linear-gradient(160deg,#EAF4EE 0%,#D4E7DC 100%);background-attachment:fixed}
[data-theme="dark"] #app{background:radial-gradient(circle at 12% 6%,rgba(34,161,85,.24),transparent 42%),radial-gradient(circle at 90% 80%,rgba(255,77,109,.14),transparent 46%),radial-gradient(circle at 45% 102%,rgba(251,191,36,.12),transparent 46%),linear-gradient(160deg,#0A1810 0%,#030806 100%);background-attachment:fixed}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + 26px)}
.hd{padding:14px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd h1{font-size:20px;font-weight:700;margin:0}
.sec{padding:0 18px;margin-top:14px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-hd h2{font-size:15px;font-weight:700;margin:0}
.sec-hd .link{font-size:12px;color:var(--primary);font-weight:600;cursor:pointer}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--text-2)}.tiny{font-size:11px}.sm{font-size:12px}
.b{font-weight:600}.bb{font-weight:700}.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{text-align:center}.gap6{gap:6px}.gap10{gap:10px}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--card-border);padding:16px;position:relative;overflow:hidden;backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%)}
.card::before{content:'';position:absolute;top:0;left:14px;right:14px;height:1px;background:linear-gradient(90deg,transparent,var(--glass-hi),transparent);pointer-events:none}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,var(--c,#0E5F30),#000);color:#fff;font-weight:700;flex:none;overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:10.5px;font-weight:600;line-height:1.6}
.pill.paid,.pill.active,.pill.approved,.pill.upcoming{background:var(--income-soft);color:var(--income)}
.pill.due,.pill.suspended,.pill.rejected{background:var(--expense-soft);color:var(--expense)}
.pill.partial,.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.important{background:var(--warn-soft);color:var(--warn)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.expense{background:var(--expense-soft);color:var(--expense)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;color:#fff;transition:transform .12s;background:linear-gradient(135deg,var(--primary-l),var(--primary));box-shadow:0 8px 20px -8px rgba(14,95,48,.65)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--border);box-shadow:none}
.btn.small{padding:8px 14px;font-size:12.5px;border-radius:11px}
.btn.xs{padding:5px 10px;font-size:11px;border-radius:9px;gap:4px}
.btn.block{width:100%}
.icon-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--card-border);color:var(--text-2);transition:transform .12s;flex:none}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px}
.balance-card{position:relative;overflow:hidden;border-radius:20px;padding:11px 14px 12px;background:linear-gradient(135deg,rgba(14,95,48,.95) 0%,rgba(27,128,68,.92) 45%,rgba(10,74,36,.95) 100%);color:#fff;box-shadow:0 14px 30px -14px rgba(14,95,48,.7);border:1px solid rgba(255,255,255,.22)}
.balance-card::before{content:'';position:absolute;top:-45%;left:-20%;right:-20%;height:95%;background:radial-gradient(ellipse at 30% 0%,rgba(255,255,255,.35),transparent 62%);pointer-events:none}
.balance-card::after{content:'';position:absolute;bottom:-35%;right:-20%;width:75%;height:75%;background:radial-gradient(circle,rgba(212,160,23,.4),transparent 65%);pointer-events:none}
.bc-header{display:flex;align-items:center;gap:9px;position:relative;z-index:2;padding-bottom:7px;border-bottom:1px solid rgba(255,255,255,.18)}
.bc-logo{width:34px;height:34px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;padding:3px;flex:none;overflow:hidden}
.bc-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:8px}
.bc-org{flex:1;min-width:0}
.bc-org-name{font-size:11.5px;font-weight:700;line-height:1.2}
.bc-org-sub{font-size:8.5px;opacity:.82;margin-top:1px}
.bc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;position:relative;z-index:2}
.bc-label{font-size:9.5px;opacity:.88;font-weight:500}
.bc-amount{font-size:20px;font-weight:700;letter-spacing:-.5px;line-height:1.1;margin-top:1px}
.bc-stats{display:flex;gap:6px;position:relative;z-index:2}
.bc-stat{background:rgba(255,255,255,.15);border-radius:9px;padding:5px 9px;border:1px solid rgba(255,255,255,.2);text-align:center}
.bc-stat .k{font-size:8px;opacity:.92;white-space:nowrap}
.bc-stat .v{font-size:11px;font-weight:700;margin-top:1px}
.bkash-pill{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(226,19,110,.95),rgba(183,15,85,.97));border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:10px 12px;color:#fff;cursor:pointer;transition:transform .12s}
.bkash-pill:active{transform:scale(.98)}
.bkash-pill .bk-logo{background:rgba(255,255,255,.24);padding:3px 8px;border-radius:7px;font-weight:800;font-size:10.5px;flex:none}
.bkash-pill .bk-num{flex:1;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkash-pill .bk-copy{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex:none}
.bkash-pill .bk-copy svg{width:13px;height:13px}
.pay-sent-bar{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(212,160,23,.14),rgba(212,160,23,.08));border:1px solid rgba(212,160,23,.4);border-radius:12px;padding:7px 12px;margin-top:8px;cursor:pointer;transition:transform .12s}
.pay-sent-bar:active{transform:scale(.98)}
.pay-sent-bar .psb-ic{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--gold),#B58414);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.pay-sent-bar .psb-ic svg{width:12px;height:12px}
.pay-sent-bar .psb-txt{flex:1;font-size:12px;font-weight:600;color:var(--gold)}
.pay-sent-bar .psb-arrow{width:22px;height:22px;border-radius:7px;background:rgba(212,160,23,.18);display:flex;align-items:center;justify-content:center;color:var(--gold);flex:none}
.pay-sent-bar .psb-arrow svg{width:12px;height:12px}
.feed-compact{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:6px 8px 6px 6px;box-shadow:var(--shadow)}
.feed-compact .fc-avatar{flex:none}
.feed-compact .fc-input{flex:1;border:none;outline:none;background:transparent;height:36px;padding:0 6px;font-size:12.5px;color:var(--text);min-width:0}
.feed-compact .fc-input::placeholder{color:var(--text-3)}
.feed-compact .fc-btn{flex:none;padding:7px 12px;border-radius:10px;background:linear-gradient(135deg,var(--primary-l),var(--primary));color:#fff;font-weight:600;font-size:11px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.feed-compact .fc-btn svg{width:12px;height:12px}
.notif-bar{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(254,243,199,.6));border:1px solid rgba(212,160,23,.35);border-radius:14px;padding:6px 10px;height:38px;cursor:pointer;overflow:hidden;position:relative}
[data-theme="dark"] .notif-bar{background:linear-gradient(135deg,rgba(58,46,16,.7),rgba(58,46,16,.5));border-color:rgba(251,191,36,.3)}
.notif-bar .nb-ic{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#B58414);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.notif-bar .nb-ic svg{width:14px;height:14px}
.notif-bar .nb-ic::after{content:'';position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:#C41E3A;border:1.5px solid var(--card);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.15)}}
.notif-bar .nb-scroll{flex:1;min-width:0;overflow:hidden;height:100%;display:flex;align-items:center}
.notif-bar .nb-track{display:inline-flex;align-items:center;gap:36px;white-space:nowrap;animation:marquee-scroll 22s linear infinite;font-size:12px;font-weight:600;color:var(--text);padding-left:100%}
.notif-bar .nb-track > span{display:inline-flex;align-items:center;gap:6px}
.notif-bar .nb-track > span::before{content:'💚';font-size:13px}
.notif-bar .nb-arrow{flex:none;font-size:10.5px;font-weight:700;color:var(--gold);padding:3px 8px;border-radius:99px;background:rgba(212,160,23,.15);border:1px solid rgba(212,160,23,.3)}
@keyframes marquee-scroll{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(-100%,0,0)}}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.quick-btn{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:11px 4px 9px;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:72px;justify-content:center}
.quick-btn:active{transform:scale(.96)}
.quick-btn .qb-ic{font-size:20px;line-height:1}
.quick-btn .qb-lbl{font-size:10px;font-weight:600;color:var(--text-2);line-height:1.15;margin-top:2px}
.quick-btn .qb-val{font-size:11px;font-weight:700;color:var(--primary);margin-top:1px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.stat{background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:13px;box-shadow:var(--shadow)}
.stat .k{font-size:10.5px;color:var(--text-2);font-weight:500}
.stat .v{font-size:16px;font-weight:700;margin-top:3px}
.list{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer}
.li:active{background:rgba(255,255,255,.45)}
.li+.li{border-top:1px solid var(--border-2)}
.li .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.li .ic svg{width:17px;height:17px}
.li .t{font-size:13.5px;font-weight:600;line-height:1.35}
.li .s{font-size:11px;color:var(--text-3);margin-top:2px}
.li .amt{font-size:14px;font-weight:700;white-space:nowrap}
.li > .chev{width:20px;height:20px;color:var(--text-3);flex:none}
.li > .chev svg{width:18px;height:18px}
.amt.pos{color:var(--income)}.amt.neg{color:var(--expense)}
.prog{height:8px;border-radius:99px;background:var(--border);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary-l),var(--primary));transition:width .8s}
.bottomnav{position:absolute;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.62);border-top:1px solid rgba(255,255,255,.85);display:flex;z-index:40;backdrop-filter:blur(36px) saturate(220%)}
[data-theme="dark"] .bottomnav{background:rgba(15,26,21,.62);border-top:1px solid rgba(255,255,255,.12)}
.bottomnav .nv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);position:relative;padding-top:2px;cursor:pointer}
.bottomnav .nv svg{width:20px;height:20px}
.bottomnav .nv span{font-size:9px;font-weight:600}
.bottomnav .nv.on{color:var(--primary)}
.bottomnav .nv.on::before{content:'';position:absolute;top:0;width:30px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--primary-l),var(--primary))}
.subpage{position:absolute;inset:0;background:linear-gradient(160deg,#EAF4EE 0%,#D4E7DC 100%);z-index:60;display:flex;flex-direction:column;animation:slideIn .26s ease}
[data-theme="dark"] .subpage{background:linear-gradient(160deg,#0A1810 0%,#030806 100%)}
@keyframes slideIn{from{transform:translateX(28px);opacity:.3}to{transform:translateX(0);opacity:1}}
.subhd{display:flex;align-items:center;gap:10px;padding:14px 16px;background:rgba(255,255,255,.78);border-bottom:1px solid var(--card-border);flex:none;position:sticky;top:0;z-index:5;backdrop-filter:blur(18px)}
[data-theme="dark"] .subhd{background:rgba(15,26,21,.78)}
.subhd h1{font-size:16.5px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subbody{flex:1;overflow-y:auto;padding-bottom:34px}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:120;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)}
.modal{background:var(--bg);width:100%;max-width:540px;border-radius:26px 26px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
.modal-hd{padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border-2);flex:none}
.modal-hd h2{margin:0;font-size:16px;font-weight:700;flex:1}
.modal-body{flex:1;overflow-y:auto;padding:18px}
.modal-foot{padding:14px 18px;border-top:1px solid var(--border-2);flex:none;display:flex;gap:10px;background:var(--card)}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;height:46px;border-radius:13px;border:1.5px solid var(--border);background:var(--card);padding:0 13px;outline:none;font-size:14px;color:var(--text)}
.field textarea{height:auto;min-height:80px;padding:11px 13px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:16px;font-size:12.5px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:all .28s;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.success{background:#16A34A;color:#fff}
.toast.error{background:#DC2626;color:#fff}
.empty{padding:36px 24px;text-align:center;color:var(--text-3)}
.empty .eic{width:60px;height:60px;border-radius:20px;background:var(--card);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:28px}
.empty h3{margin:0 0 5px;font-size:13.5px;color:var(--text-2);font-weight:600}
.all-paid{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(230,247,238,.9),rgba(205,235,215,.85));border:1px solid rgba(22,163,74,.25);border-radius:16px;padding:12px 14px;color:var(--income);font-weight:600;font-size:13px}
[data-theme="dark"] .all-paid{background:linear-gradient(135deg,rgba(18,48,31,.85),rgba(10,42,24,.85));border-color:rgba(46,204,113,.3)}
.all-paid .ap-ic{width:36px;height:36px;border-radius:12px;background:var(--income);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.all-paid .ap-ic svg{width:18px;height:18px}
.total-paid-card{background:linear-gradient(135deg,rgba(230,247,238,.95) 0%,rgba(205,235,215,.9) 50%,rgba(180,225,200,.85) 100%);border:1.5px solid rgba(22,163,74,.35);border-radius:16px;padding:11px 12px;position:relative;overflow:hidden;box-shadow:0 8px 20px -12px rgba(22,163,74,.5)}
.total-paid-card::before{content:'';position:absolute;top:-40%;right:-15%;width:150px;height:150px;background:radial-gradient(circle,rgba(22,163,74,.18),transparent 70%);pointer-events:none}
[data-theme="dark"] .total-paid-card{background:linear-gradient(135deg,rgba(18,48,31,.92) 0%,rgba(10,42,24,.9) 60%,rgba(15,58,34,.88) 100%);border-color:rgba(46,204,113,.4)}
.total-paid-card .tp-header{display:flex;align-items:center;gap:8px;position:relative;z-index:2}
.total-paid-card .tp-icon{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--income),#0E7A38);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 14px -6px rgba(22,163,74,.7)}
.total-paid-card .tp-icon svg{width:16px;height:16px}
.total-paid-card .tp-title{font-size:10.5px;font-weight:600;color:var(--income);letter-spacing:.15px}
.total-paid-card .tp-sub{font-size:9px;color:var(--text-2);margin-top:1px}
.total-paid-card .tp-amount{font-size:20px;font-weight:800;color:var(--income);letter-spacing:-.5px;margin-top:7px;line-height:1.15;position:relative;z-index:2}
.total-paid-card .tp-detail{display:flex;gap:8px;margin-top:8px;position:relative;z-index:2;padding-top:7px;border-top:1px dashed rgba(22,163,74,.28)}

  var result = '';
  if (num >= 10000000) {
      result += numberToWordsBn(Math.floor(num / 10000000)).replace(' টাকা','') + ' কোটি ';
      num %= 10000000;
  }
  if (num >= 100000) {
      result += numberToWordsBn(Math.floor(num / 100000)).replace(' টাকা','') + ' লক্ষ ';
      num %= 100000;
  }
  if (num >= 1000) {
      result += numberToWordsBn(Math.floor(num / 1000)).replace(' টাকা','') + ' হাজার ';
      num %= 1000;
  }
  if (num >= 100) {
      result += ones[Math.floor(num / 100)] + 'শত ';
      num %= 100;
  }
  if (num > 0) {
      result += ones[num];
  }
  return result.trim() + ' টাকা';
}

function toISO(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function parseISO(s){if(!s)return new Date();var p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function fmtDate(iso){if(!iso)return '—';try{var d=parseISO(iso);return d.getDate()+' '+MN(d.getMonth()+1)+' '+d.getFullYear()}catch(e){return iso}}
function fmtDateTime(ts){if(!ts)return '—';var d=new Date(ts);var hr=d.getHours();var ampm=hr>=12?'PM':'AM';hr=hr%12||12;return d.getDate()+' '+MN(d.getMonth()+1)+' '+hr+':'+pad2(d.getMinutes())+' '+ampm}
function fmtTimer(ms){var s=Math.floor(ms/1000);var m=Math.floor(s/60);s=s%60;var h=Math.floor(m/60);m=m%60;if(h>0)return pad2(h)+':'+pad2(m)+':'+pad2(s);return pad2(m)+':'+pad2(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}

var DATA={
  myContribs:function(){if(!state.member) return [];return DB.contributions.filter(function(c){return c.memberId===state.member.id})},
  mySummary:function(){
    var cs=this.myContribs();
    var expected=cs.reduce(function(a,b){return a+(b.amount||0)},0);
    var paid=cs.reduce(function(a,b){return a+(b.paidAmount||0)},0);
    return {expected:expected,paid:paid,due:expected-paid,percent:expected?Math.round(paid/expected*100):0};
  },
  eventCost:function(event){
    if(!event) return 0;
    if(event.autoExpenseAmount && Number(event.autoExpenseAmount) > 0) return Number(event.autoExpenseAmount);
    if(event.totalCost && Number(event.totalCost) > 0) return Number(event.totalCost);
    var fee = Number(event.fee||0);
    if(fee <= 0) return 0;
    var count = DB.members.filter(function(m){return m.status==='active'}).length;
    return fee * count;
  },
  totalFund:function(){
    var resetAt = (DB.org && DB.org.statsResetAt) ? Number(DB.org.statsResetAt) : 0;
    var income = 0, expense = 0;
    DB.transactions.forEach(function(t){
      var ts = 0;
      if(t.createdAt) ts = Number(t.createdAt);
      else if(t.ts) ts = Number(t.ts);
      else if(t.date){ try{ ts = parseISO(t.date).getTime(); }catch(e){ ts = 0; } }
      if(resetAt > 0 && ts > 0 && ts < resetAt) return;
      var amt = Number(t.amount||0);
      if(t.type==='contribution'||t.type==='donation'||t.type==='other_income'||t.type==='extra_payment'){income += amt;} else {expense += amt;}
    });
    income  += Number((DB.org && DB.org.manualIncome)  || 0);
    expense += Number((DB.org && DB.org.manualExpense) || 0);
    var opening = DB.org && DB.org.manualBalance;
    var hasOpening = (opening!==undefined && opening!==null && opening!=='');
    var openingNum = hasOpening ? Number(opening) : 0;
    return {income, expense, opening:openingNum, hasOpening, autoBal:income-expense, balance:openingNum+income-expense, fromCache:false, resetActive:resetAt > 0, resetAt:resetAt};
  },
  upcomingEvents:function(){return DB.events.filter(function(e){return !e.isCompleted}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'')})},
  pastEvents:function(){return DB.events.filter(function(e){return e.isCompleted}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')})},
  nextEvent:function(){var u=this.upcomingEvents();return u.length?u[0]:null},
  myNotifications:function(){
    if(!state.member) return [];
    return DB.notifications.filter(function(n){return n.userId===state.member.id||n.target==='all'||!n.userId}).sort(function(a,b){return (b.timestamp||b.createdAt||0)-(a.timestamp||a.createdAt||0)});
  },
  unreadCount:function(){return this.myNotifications().filter(function(n){return !n.read}).length},
  myPendingRequests:function(){if(!state.member) return [];return DB.paymentRequests.filter(function(r){return r.memberId===state.member.id})},
  myDueContribs:function(){
    var cs=this.myContribs();
    return cs.filter(function(c){ return (c.amount||0) - (c.paidAmount||0) > 0; }).sort(function(a,b){return (b.year||0)-(a.year||0)||(b.month||0)-(a.month||0)});
  },

    }).sort(function(a,b){return (a.timestamp||0) - (b.timestamp||0)});
  }

function playRingtone(){
  try{
    stopRingtone();
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    CALL._audioCtx = ctx;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 440;
    gain.gain.value = 0.0001;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    var now = ctx.currentTime;
    function beep(t){
      gain.gain.cancelScheduledValues(t);
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(0.15, t+0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, t+0.35);
    }
    var t0 = now;
    for(var i=0;i<60;i++){ beep(t0 + i*2.5); }
    CALL._osc = osc;
  }catch(e){}
}
function stopRingtone(){
  try{
    if(CALL._osc){ CALL._osc.stop(); CALL._osc.disconnect(); CALL._osc = null; }
    if(CALL._audioCtx){ CALL._audioCtx.close(); CALL._audioCtx = null; }
  }catch(e){}
}

async function startCall(participants, callType, isGroup){
  if(CALL.active){ toast('আরেকটি কল চলছে','error'); return; }
  if(!participants || !participants.length){ toast('কোনো প্রাপক নেই','error'); return; }
  participants = participants.filter(function(id){ return id !== state.member.id; });
  if(!participants.length){ toast('নিজেকে কল করা যাবে না','error'); return; }
  if(!isGroup) isGroup = false;
  CALL.isGroup = isGroup;
  CALL.callType = callType;
  CALL.isCaller = true;
  CALL.participants = [state.member.id].concat(participants);
  CALL.peerNames = {};
  CALL.peers = {};
  CALL.peerStreams = {};
  try{
    CALL.localStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: callType === 'video' ? { facingMode: 'user' } : false
    });
  }catch(err){
    toast('ক্যামেরা/মাইক পারমিশন প্রয়োজন','error'); return;
  }
  var callId = 'call_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  CALL.callId = callId;
  CALL.active = true;
  CALL.startTime = 0;
  CALL.isMuted = false;
  CALL.isVideoOff = false;
  participants.forEach(function(pid){
    var m = DB.members.filter(function(x){ return x.id === pid; })[0];
    if(m) CALL.peerNames[pid] = m.name || pid;
  });
  CALL.peerNames[state.member.id] = state.member.name || 'আপনি';
  try{
    await db.collection('calls').doc(callId).set({
      callId: callId, callerId: state.member.id, callerName: state.member.name || 'সদস্য',
      callType: callType, isGroup: isGroup, participants: CALL.participants,
      participantNames: CALL.participants.map(function(id){ return CALL.peerNames[id]; }),
      status: 'ringing', acceptedBy: [], declinedBy: [],
      createdAt: Date.now(), endedAt: null, duration: 0
    });
  }catch(err){ toast('কল শুরু ব্যর্থ: '+err.message,'error'); return; }
  if(CALL.callDocListener) CALL.callDocListener();
  CALL.callDocListener = db.collection('calls').doc(callId).onSnapshot(function(snap){
    if(!snap.exists) return;
    var d = snap.data();
    (d.acceptedBy||[]).forEach(function(pid){
      if(!CALL.peers[pid] && pid !== state.member.id){ createPeerConnection(pid, true); }
    });
    (d.declinedBy||[]).forEach(function(pid){
      if(CALL.peerNames[pid]) toast(CALL.peerNames[pid]+' কল প্রত্যাখ্যান করেছে');
    });
    if(d.status === 'ended' && CALL.active){ toast('কল সমাপ্ত হয়েছে','error'); endCallLocal(true); }
    if(d.status === 'active' && CALL.startTime === 0){ startCallTimer(); }
  });
  setupSignalListener(callId);
  await db.collection('calls').doc(callId).collection('participants').doc(state.member.id).set({
    userId: state.member.id, name: state.member.name || 'সদস্য', joinedAt: Date.now(), status: 'accepted'
  });
  participants.forEach(function(pid){ createPeerConnection(pid, true); });
  showCallUI();
  playRingtone();
  toast('কল করা হচ্ছে...');
}

function setupSignalListener(callId){
  if(CALL.signalListener) CALL.signalListener();
  var seen = {};
  CALL.signalListener = db.collection('calls').doc(callId).collection('signals')
    .where('to','==',state.member.id).onSnapshot(function(snap){
      snap.docChanges().forEach(function(change){
        if(change.type !== 'added') return;
        if(seen[change.doc.id]) return;
        seen[change.doc.id] = true;
        handleSignal(change.doc.data());
      });
    });
}

async function handleSignal(sig){
  try{
    var pid = sig.from;
    if(sig.type === 'offer'){
      if(!CALL.peers[pid]){ await createPeerConnection(pid, false); }
      await CALL.peers[pid].setRemoteDescription(new RTCSessionDescription(sig.data));
      var queued = CALL.pendingCandidates[pid] || [];
      for(var i=0;i<queued.length;i++){ try{ await CALL.peers[pid].addIceCandidate(new RTCIceCandidate(queued[i])); }catch(e){} }
      CALL.pendingCandidates[pid] = [];
      var answer = await CALL.peers[pid].createAnswer();
      await CALL.peers[pid].setLocalDescription(answer);
      await db.collection('calls').doc(CALL.callId).collection('signals').add({
        from: state.member.id, to: pid, type: 'answer', data: { type: answer.type, sdp: answer.sdp }, timestamp: Date.now()
      });
    } else if(sig.type === 'answer'){
      if(CALL.peers[pid]){
        await CALL.peers[pid].setRemoteDescription(new RTCSessionDescription(sig.data));
        var queued2 = CALL.pendingCandidates[pid] || [];
        for(var j=0;j<queued2.length;j++){ try{ await CALL.peers[pid].addIceCandidate(new RTCIceCandidate(queued2[j])); }catch(e){} }
        CALL.pendingCandidates[pid] = [];
      }
    } else if(sig.type === 'ice'){
      if(CALL.peers[pid] && CALL.peers[pid].remoteDescription && CALL.peers[pid].remoteDescription.type){
        try{ await CALL.peers[pid].addIceCandidate(new RTCIceCandidate(sig.data)); }catch(e){}
      } else {
        if(!CALL.pendingCandidates[pid]) CALL.pendingCandidates[pid] = [];
        CALL.pendingCandidates[pid].push(sig.data);
      }
    } else if(sig.type === 'end'){
      if(CALL.peers[pid]){
        try{ CALL.peers[pid].close(); }catch(e){}
        delete CALL.peers[pid];
        delete CALL.peerStreams[pid];
      }
      renderCallUI();
    }
  }catch(err){}
}

async function createPeerConnection(peerId, isInitiator){
  if(CALL.peers[peerId]) return CALL.peers[peerId];
  var pc = new RTCPeerConnection(RTC_CONFIG);
  CALL.peers[peerId] = pc;
  if(CALL.localStream){
    CALL.localStream.getTracks().forEach(function(track){ pc.addTrack(track, CALL.localStream); });
  }
  pc.onicecandidate = function(ev){
    if(ev.candidate){
      db.collection('calls').doc(CALL.callId).collection('signals').add({
        from: state.member.id, to: peerId, type: 'ice', data: ev.candidate.toJSON ? ev.candidate.toJSON() : ev.candidate, timestamp: Date.now()
      }).catch(function(){});
    }
  };
  pc.ontrack = function(ev){
    CALL.peerStreams[peerId] = ev.streams[0];
    renderCallUI();
  };
  if(isInitiator){
    var offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await db.collection('calls').doc(CALL.callId).collection('signals').add({
      from: state.member.id, to: peerId, type: 'offer', data: { type: offer.type, sdp: offer.sdp }, timestamp: Date.now()
    });
  }
  return pc;
}

function setupIncomingCallListener(){
  if(CALL.incomingCallListener) CALL.incomingCallListener();
  CALL.incomingCallListener = db.collection('calls')
    .where('participants','array-contains',state.member.id)
    .where('status','==','ringing')
    .onSnapshot(function(snap){
      snap.docChanges().forEach(function(change){
        if(change.type !== 'added') return;
        var d = change.doc.data();
        if(d.callerId === state.member.id) return;
        if(CALL.active) return;
        CALL.remoteCallerData = d;
        showIncomingCallUI(d);
      });
    });
}

async function acceptIncomingCall(){
  var d = CALL.remoteCallerData;
  if(!d) return;
  stopRingtone();
  CALL.callId = d.callId;
  CALL.isCaller = false;
  CALL.callType = d.callType;
  CALL.isGroup = !!d.isGroup;
  CALL.active = true;
  CALL.startTime = 0;
  CALL.isMuted = false;
  CALL.isVideoOff = false;
  try{
    CALL.localStream = await navigator.mediaDevices.getUserMedia({
      audio: true, video: d.callType === 'video' ? { facingMode: 'user' } : false
    });
  }catch(err){ toast('ক্যামেরা/মাইক পারমিশন প্রয়োজন','error'); declineIncomingCall(); return; }
  CALL.peerNames = {};
  (d.participants||[]).forEach(function(pid){
    var m = DB.members.filter(function(x){ return x.id === pid; })[0];
    CALL.peerNames[pid] = m ? (m.name || pid) : pid;
  });
  try{
    await db.collection('calls').doc(d.callId).update({
      acceptedBy: firebase.firestore.FieldValue.arrayUnion(state.member.id), status: 'active'
    });
    await db.collection('calls').doc(d.callId).collection('participants').doc(state.member.id).set({
      userId: state.member.id, name: state.member.name || 'সদস্য', joinedAt: Date.now(), status: 'accepted'
    });
  }catch(e){}
  CALL.participants = d.participants || [];
  CALL.callDocListener = db.collection('calls').doc(d.callId).onSnapshot(function(snap){
    if(!snap.exists) return;
    var dd = snap.data();
    (dd.acceptedBy||[]).forEach(function(pid){
      if(pid !== state.member.id && !CALL.peers[pid]){ createPeerConnection(pid, true); }
    });
    if(dd.status === 'ended' && CALL.active){ toast('কল সমাপ্ত','error'); endCallLocal(true); }
    if(dd.status === 'active' && CALL.startTime === 0){ startCallTimer(); }
  });
  setupSignalListener(d.callId);
  (d.participants||[]).forEach(function(pid){
    if(pid !== state.member.id){ createPeerConnection(pid, false); }
  });
  closeCallRoot();
  showCallUI();
}

function declineIncomingCall(){
  var d = CALL.remoteCallerData;
  if(!d){ closeCallRoot(); CALL.remoteCallerData = null; return; }
  db.collection('calls').doc(d.callId).update({
    declinedBy: firebase.firestore.FieldValue.arrayUnion(state.member.id)
  }).catch(function(){});
  stopRingtone();
  closeCallRoot();
  CALL.remoteCallerData = null;
}

function startCallTimer(){
  CALL.startTime = Date.now();
  if(CALL.timerInterval) clearInterval(CALL.timerInterval);
  CALL.timerInterval = setInterval(function(){
    var el = document.getElementById('callTimer');
    if(el) el.textContent = fmtTimer(Date.now() - CALL.startTime);
  }, 1000);
}

async function endCallLocal(skipNotify){
  try{ if(CALL.peers){ Object.values(CALL.peers).forEach(function(pc){ try{pc.close();}catch(e){} }); } }catch(e){}
  if(CALL.localStream){ CALL.localStream.getTracks().forEach(function(t){ try{t.stop();}catch(e){} }); }
  if(CALL.timerInterval){ clearInterval(CALL.timerInterval); CALL.timerInterval = null; }
  stopRingtone();
  if(CALL.signalListener){ CALL.signalListener(); CALL.signalListener = null; }
  if(CALL.callDocListener){ CALL.callDocListener(); CALL.callDocListener = null; }
  if(!skipNotify && CALL.callId){
    try{
      var dur = CALL.startTime > 0 ? Math.floor((Date.now() - CALL.startTime)/1000) : 0;
      await db.collection('calls').doc(CALL.callId).update({ status: 'ended', endedAt: Date.now(), duration: dur });
    }catch(e){}
  }
  CALL.active = false; CALL.callId = null; CALL.peers = {}; CALL.peerStreams = {};
  CALL.peerNames = {}; CALL.participants = []; CALL.localStream = null;
  CALL.startTime = 0; CALL.isMuted = false; CALL.isVideoOff = false;
  CALL.pendingCandidates = {}; CALL.remoteCallerData = null;
  closeCallRoot();
}
function endCall(){ endCallLocal(false); }

function toggleMute(){
  if(!CALL.localStream) return;
  CALL.isMuted = !CALL.isMuted;
  CALL.localStream.getAudioTracks().forEach(function(t){ t.enabled = !CALL.isMuted; });
  renderCallUI();
}
function toggleVideo(){
  if(!CALL.localStream) return;
  CALL.isVideoOff = !CALL.isVideoOff;
  CALL.localStream.getVideoTracks().forEach(function(t){ t.enabled = !CALL.isVideoOff; });
  renderCallUI();
}
async function switchCamera(){
  if(!CALL.localStream || CALL.callType !== 'video') return;
  var videoTrack = CALL.localStream.getVideoTracks()[0];
  if(!videoTrack) return;
  var current = videoTrack.getSettings().facingMode || 'user';
  var newFacing = current === 'user' ? 'environment' : 'user';
  try{
    var newStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: newFacing } });
    var newTrack = newStream.getVideoTracks()[0];
    Object.values(CALL.peers).forEach(function(pc){
      var sender = pc.getSenders().find(function(s){ return s.track && s.track.kind === 'video'; });
      if(sender) sender.replaceTrack(newTrack);
    });
    videoTrack.stop();
    CALL.localStream.removeTrack(videoTrack);
    CALL.localStream.addTrack(newTrack);
    renderCallUI();
  }catch(e){ toast('ক্যামেরা সুইচ ব্যর্থ','error'); }
}

function closeCallRoot(){ var r = document.getElementById('callRoot'); if(r) r.innerHTML = ''; }

function showIncomingCallUI(d){
  var caller = DB.members.filter(function(m){return m.id===d.callerId})[0] || {name:d.callerName};

    '<div class="btns">'+
      '<button class="call-btn end" onclick="declineIncomingCall()">'+icon('phoneOff')+'</button>'+

function showCallUI(){ renderCallUI(); }

  html += '<div class="call-header"><div class="name">'+esc(headerTitle)+'</div>';
  if(CALL.startTime > 0){ html += '<div class="timer" id="callTimer">'+fmtTimer(Date.now()-CALL.startTime)+'</div>'; }

  html += '</div>';
  html += '<div class="call-body'+(isVideo?'':' audio-mode')+'">';

    var gridCls = 'g' + Math.min(Math.max(peerIds.length,1), 4);
    html += '<div class="video-grid '+gridCls+'">';
    if(peerIds.length === 0){ html += '<div class="video-cell" style="display:flex;align-items:center;justify-content:center;color:#666;font-size:13px">অপেক্ষা করা হচ্ছে...</div>'; }
    else { peerIds.forEach(function(pid){ html += '<div class="video-cell" id="vcell_'+pid+'"><video id="rvideo_'+pid+'" autoplay playsinline></video><div class="cell-name">'+esc(CALL.peerNames[pid]||'সদস্য')+'</div></div>'; }); }
    html += '</div>';
    html += '<div class="local-video-pip" id="localPip"><video id="localVideo" autoplay playsinline muted></video></div>';
  } else {
    var showId = peerIds[0];
    var m = showId ? (DB.members.filter(function(x){return x.id===showId})[0]||{name:CALL.peerNames[showId]}) : {name:state.member.name};
    html += '<div style="display:flex;flex-direction:column;align-items:center;gap:20px">';
    if(CALL.isGroup && peerIds.length > 0){
      html += '<div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center">';
      peerIds.forEach(function(pid){
        var mm = DB.members.filter(function(x){return x.id===pid})[0]||{name:CALL.peerNames[pid]};
        html += '<div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:80px;height:80px;border-radius:50%;overflow:hidden;box-shadow:0 0 30px rgba(34,161,85,0.5)">'+avatarHTML(mm,80)+'</div><div style="font-size:12px">'+esc(mm.name||'সদস্য')+'</div></div>';
      });
      html += '</div>';
    } else {
      html += '<div class="call-avatar-big">'+avatarHTML(m, 140)+'</div>';
      html += '<div style="font-size:15px;opacity:0.8">'+(CALL.startTime>0?'সংযুক্ত':'রিং হচ্ছে...')+'</div>';
    }
    html += '</div>';
    peerIds.forEach(function(pid){ html += '<audio id="raudio_'+pid+'" autoplay></audio>'; });
  }
  html += '</div>';
  html += '<div class="call-controls">';
  html += '<button class="call-btn mute'+(CALL.isMuted?' active':'')+'" onclick="toggleMute()">'+(CALL.isMuted?icon('micOff'):icon('mic'))+'</button>';
  if(isVideo){
    html += '<button class="call-btn mute'+(CALL.isVideoOff?' active':'')+'" onclick="toggleVideo()">'+(CALL.isVideoOff?icon('videoOff'):icon('video'))+'</button>';
    html += '<button class="call-btn mute" onclick="switchCamera()">🔄</button>';
  }
  if(CALL.isGroup && CALL.isCaller){ html += '<button class="call-btn add-participant" onclick="addParticipantToCall()">'+icon('usersPlus')+'</button>'; }
  html += '<button class="call-btn end" onclick="endCall()">'+icon('phoneOff')+'</button>';
  html += '</div></div>';
  r.innerHTML = html;
  if(isVideo){
    var lv = document.getElementById('localVideo');
    if(lv && CALL.localStream) lv.srcObject = CALL.localStream;
    peerIds.forEach(function(pid){ var v = document.getElementById('rvideo_'+pid); if(v && CALL.peerStreams[pid]) v.srcObject = CALL.peerStreams[pid]; });
  } else {
    peerIds.forEach(function(pid){ var a = document.getElementById('raudio_'+pid); if(a && CALL.peerStreams[pid]) a.srcObject = CALL.peerStreams[pid]; });
  }
}

function addParticipantToCall(){
  if(!CALL.active || !CALL.isGroup) return;
  var available = DB.members.filter(function(m){ return m.status==='active' && CALL.participants.indexOf(m.id) === -1; });
  if(!available.length){ toast('আর কোনো সদস্য নেই','error'); return; }
  var body = available.map(function(m){ return '<div class="member-select-item" data-act="add-to-call" data-id="'+esc(m.id)+'"><div class="chk">'+icon('check')+'</div>'+avatarHTML(m,40)+'<div class="grow"><div class="b sm">'+esc(m.name||'')+'</div><div class="tiny muted">'+(m.id||'')+'</div></div></div>'; }).join('');
  openModal({title:'কল-এ সদস্য যোগ করুন',

    onMount:function(mr){

        el.addEventListener('click', function(){
          var id = el.dataset.id;
          var idx = selected.indexOf(id);

          else { selected.push(id); el.classList.add('selected'); }
        });

        closeModal();

async function addParticipantsToGroupCall(ids){
  if(!CALL.active || !CALL.callId) return;
  try{
    var all = CALL.participants.concat(ids);
    CALL.participants = all;
    ids.forEach(function(pid){ var m = DB.members.filter(function(x){return x.id===pid})[0]; if(m) CALL.peerNames[pid] = m.name || pid; });
    await db.collection('calls').doc(CALL.callId).update({ participants: all, participantNames: all.map(function(id){ return CALL.peerNames[id]||id; }) });
    for(var i=0;i<ids.length;i++){ await createPeerConnection(ids[i], true); }
    for(var k=0;k<ids.length;k++){
      await db.collection('notifications').add({
        userId: ids[k], memberId: ids[k], title: 'গ্রুপ কলে যোগ দিন',
        body: (state.member.name||'')+' আপনাকে গ্রুপ কলে যোগ করছেন',
        amount: 0, type: 'call', date: toISO(new Date()), timestamp: Date.now(),
        read: false, target: 'individual', senderId: state.member.id, source: 'group-call-add'
      });
    }
    renderCallUI();
    toast('সদস্য যোগ করা হয়েছে','success');
  }catch(e){ toast('যোগ ব্যর্থ: '+e.message,'error'); }
}

async function markMessagesAsRead(otherMemberId){
  if(!state.member) return;
  try{
    var snap = await db.collection('messages')
      .where('senderId','==',otherMemberId)
      .where('receiverId','==',state.member.id)
      .where('read','==',false).get();
    if(!snap.empty){
      var batch = db.batch();
      snap.docs.forEach(function(doc){ batch.update(doc.ref, { read: true, readAt: Date.now() }); });
      await batch.commit();
    }
  }catch(err){}
}

async function doLogin(){
  var phone=($('#loginPhone')||{}).value||'';
  var pin=($('#loginPin')||{}).value||'';
  if(!phone||!pin){toast('ফোন ও PIN দিন','error');return}
  if(pin.length<6){toast('PIN কমপক্ষে ৬ ডিজিট','error');return}
  var phoneNorm=normalizePhone(phone);
  if(!isValidPhone(phoneNorm)){toast('সঠিক ফোন নাম্বার দিন','error');return}
  var email=phoneNorm+AUTH_DOMAIN;
  try{toast('লগইন হচ্ছে...');await auth.signInWithEmailAndPassword(email,pin)}
  catch(err){
    var msg='লগইন ব্যর্থ';
    if(err.code==='auth/wrong-password'||err.code==='auth/invalid-credential')msg='PIN ভুল';
    else if(err.code==='auth/user-not-found')msg='এই নাম্বারে অ্যাকাউন্ট নেই — রেজিস্ট্রেশন করুন';
    else if(err.code==='auth/too-many-requests')msg='একটু পরে চেষ্টা';
    else msg='সমস্যা: '+err.message;
    toast(msg,'error');
  }
}
async function doRegister(){
  var phone=($('#regPhone')||{}).value||'';
  var pin=($('#regPin')||{}).value||'';
  var pin2=($('#regPin2')||{}).value||'';
  if(!phone||!pin){toast('সব তথ্য দিন','error');return}
  if(pin.length<6){toast('PIN কমপক্ষে ৬ ডিজিট','error');return}
  if(pin!==pin2){toast('দুইবার PIN একই দিন','error');return}
  var phoneNorm=normalizePhone(phone);
  if(!isValidPhone(phoneNorm)){toast('সঠিক ফোন নাম্বার দিন','error');return}
  try{
    toast('অ্যাকাউন্ট তৈরি হচ্ছে...');
    var dupSnap=await db.collection('members').where('phoneNorm','==',phoneNorm).limit(1).get();
    if(dupSnap.empty){toast('❌ এই নাম্বারে সদস্য নেই','error');return}
    if(dupSnap.docs[0].data().accountSetup===true){toast('❌ অ্যাকাউন্ট আছে — লগইন করুন','error');return}
    var email=phoneNorm+AUTH_DOMAIN;
    var userCred=await auth.createUserWithEmailAndPassword(email,pin);
    try{await db.collection('members').doc(dupSnap.docs[0].id).update({accountSetup:true,authUid:userCred.user.uid,accountCreatedAt:Date.now(),phoneRaw:phone})}catch(e){}
    toast('✅ অ্যাকাউন্ট তৈরি হয়েছে','success');
  }catch(err){
    var msg='অ্যাকাউন্ট তৈরি ব্যর্থ';
    if(err.code==='auth/email-already-in-use')msg='এই নাম্বারে অ্যাকাউন্ট আছে';
    else if(err.code==='auth/weak-password')msg='PIN দুর্বল';
    else msg='❌ '+err.message;
    toast(msg,'error');
  }
}

function renderChatMessages(otherMemberId){
  var msgs = DATA.getChatMessages(otherMemberId);
  if(!msgs.length) return '<div style="text-align:center;padding:24px;color:var(--text-3);font-size:12px;">এখনো কোনো মেসেজ নেই। প্রথম মেসেজটি আপনি পাঠান!</div>';
  var me = state.member.id;
  return msgs.map(function(msg){
    var isMe = msg.senderId === me;
    var timeStr = msg.timestamp ? fmtDateTime(msg.timestamp) : '';
    var statusIcon = '';
    if (isMe) {
      if (msg.read) {
        statusIcon = '<span class="msg-status">'+icon('tickDoubleSeen')+'</span>';
      } else {
        statusIcon = '<span class="msg-status">'+icon('tickSingle')+'</span>';
      }
    }
    return '<div class="chat-bubble '+(isMe?'sent':'received')+'">'+esc(msg.text)+'<div class="chat-time">'+timeStr+statusIcon+'</div></div>';
  }).join('');
}

async function sendChatMessage(receiverId){
  var input = document.getElementById('chatInput');
  if(!input) return;
  var text = input.value.trim();
  if(!text) { toast('মেসেজ লিখুন','error'); return; }
  if(text.length > 1000) { toast('১০০০ অক্ষরের মধ্যে লিখুন','error'); return; }
  try {
    await db.collection('messages').add({
      senderId: state.member.id,
      senderName: state.member.name || 'সদস্য',
      receiverId: receiverId,
      text: text,
      timestamp: Date.now(),
      createdAt: Date.now(),
      read: false
    });
    input.value = '';
    var receiver = DB.members.filter(function(x){return x.id===receiverId})[0];
    if(receiver){
      await db.collection('notifications').add({
        userId: receiverId, memberId: receiverId,
        title: 'নতুন মেসেজ',
        body: (state.member.name||'কেউ') + ': ' + text.substring(0,50),
        amount: 0, type: 'message', date: toISO(new Date()), timestamp: Date.now(),
        read: false, target: 'individual',
        senderId: state.member.id, senderName: state.member.name||'সদস্য',
        source: 'chat', createdAt: Date.now()
      });
    }
    var chatBox = document.getElementById('chatMessages');
    if(chatBox) chatBox.scrollTop = chatBox.scrollHeight;
  } catch(err) {
    toast('❌ '+err.message,'error');
  }
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var act=el.dataset.act;vibrate(6);
  switch(act){
    case 'auth-mode':state.authMode=el.dataset.mode;render();break;
    case 'login':doLogin();break;
    case 'register':doRegister();break;
    case 'logout':if(confirm('লগআউট করবেন?')){try{auth.signOut()}catch(e){}}break;
    case 'tab':switchTab(el.dataset.tab);break;
    case 'page':pushPage(el.dataset.page, {id: el.dataset.id});break;
    case 'back':popPage();break;
    case 'member':pushPage('member',{id:el.dataset.id});break;
    case 'page-event':pushPage('eventDetail',{id:el.dataset.id});break;
    case 'send-chat':sendChatMessage(el.dataset.id);break;
    case 'quick-post':doQuickPost();break;
    case 'delete-my-post':deleteMyPost(el.dataset.id);break;
    case 'send-payment-request':openPaymentRequestModal();break;
    case 'show-bkash':showBkashModal();break;
    case 'quick-members':switchTab('members');break;
    case 'quick-my-contrib':pushPage('myPayment');break;
    case 'quick-all-events':pushPage('allEvents');break;
    case 'quick-all-posts':switchTab('posts');break;
    case 'quick-accounts':switchTab('accounts');break;
    case 'quick-messages':pushPage('notifications');break;
    case 'copy-number':{var num=el.dataset.num;try{navigator.clipboard.writeText(num).then(function(){toast('✅ কপি: '+num,'success')})}catch(e){toast('নাম্বার: '+num)}break}
    case 'theme-toggle':{state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;try{localStorage.setItem('dp_theme',state.theme)}catch(e){}render();break}
    case 'read-notif':{var id=el.dataset.id;var n=DB.notifications.filter(function(x){return x.id===id})[0];if(n&&!n.read){db.collection('notifications').doc(id).update({read:true}).catch(function(e){})}break}
    case 'call-audio': startCall([el.dataset.id], 'audio', false); break;
    case 'call-video': startCall([el.dataset.id], 'video', false); break;
    case 'open-group-call': openGroupCallSetup(); break;
  }
});

auth.onAuthStateChanged(async function(user){
  if(!user){state.user=null;state.member=null;state.loading=false;render();return}
  state.user=user;
  try{
    var member=null;
    var memberSnap=await db.collection('members').doc(user.uid).get();
    if(memberSnap.exists){member=Object.assign({},memberSnap.data(),{_docId:memberSnap.id,id:memberSnap.data().id||memberSnap.id})}
    else{
      var phoneNorm='';
      if(user.email){phoneNorm=user.email.split('@')[0]}
      if(phoneNorm){var snap=await db.collection('members').where('phoneNorm','==',phoneNorm).limit(1).get();if(!snap.empty){member=Object.assign({},snap.docs[0].data(),{_docId:snap.docs[0].id,id:snap.docs[0].data().id||snap.docs[0].id})}}
    }
    if(!member){state.member=null;state.loading=false;render();return}
    if(!member.accountSetup){try{await db.collection('members').doc(member._docId).update({accountSetup:true,authUid:user.uid,updatedAt:Date.now()});member.accountSetup=true}catch(e){}}
    state.member=member;
    requestNotificationPermission();
    await loadAllData();
    setupListeners();
    setupCallListeners();
    state.loading=false;render();
    toast('স্বাগতম, '+(member.name||''),'success');
  }catch(err){console.error('Auth error:',err);state.loading=false;render();toast('ডেটা লোড ব্যর্থ: '+err.message,'error')}
});

async function loadAllData(){
  try{
    var orgSnap=await db.collection('org').doc('settings').get();
    if(orgSnap.exists){DB.org=orgSnap.data()}
    else{DB.org={}}
    var results=await Promise.all([
      db.collection('members').get(),
      db.collection('contributions').get(),
      db.collection('transactions').get(),
      db.collection('events').get(),
      db.collection('announcements').get(),
      db.collection('notifications').get(),
      db.collection('paymentRequests').get(),
      db.collection('userPosts').get(),
      db.collection('extraPayments').get(),
      db.collection('messages').get()
    ]);
    DB.members=results[0].docs.map(function(d){return Object.assign({},d.data(),{_docId:d.id})});
    DB.contributions=results[1].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.transactions=results[2].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.events=results[3].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.announcements=results[4].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.notifications=results[5].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.paymentRequests=results[6].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.userPosts=results[7].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.extraPayments=results[8].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.messages=results[9].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
  }catch(err){
    try{var orgSnap2=await db.collection('org').doc('settings').get();if(orgSnap2.exists) DB.org=orgSnap2.data()}catch(e2){}
  }
}

  },function(err){});
  db.collection('members').onSnapshot(function(s){DB.members=s.docs.map(function(d){return Object.assign({},d.data(),{_docId:d.id})});if(!state.loading)render()},function(e){});
  db.collection('contributions').onSnapshot(function(s){DB.contributions=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()},function(e){});
  db.collection('transactions').onSnapshot(function(s){DB.transactions=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()},function(e){});
  db.collection('events').onSnapshot(function(s){DB.events=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()},function(e){});
  db.collection('announcements').onSnapshot(function(s){DB.announcements=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()},function(e){});
  db.collection('notifications').onSnapshot(function(s){
    DB.notifications=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    s.docChanges().forEach(function(change){
      if(change.type === 'added'){
        var n = change.doc.data();
        if(n.target === 'all' || n.userId === state.member.id || !n.userId){
          if(n.read === false && n.timestamp && (Date.now() - n.timestamp < 10000)) {
             showLocalNotification(n.title || 'নোটিফিকেশন', n.body || '');
          }
        }
      }
    });
    if(!state.loading)render();
  },function(e){});
  db.collection('paymentRequests').onSnapshot(function(s){DB.paymentRequests=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()},function(e){});
  db.collection('userPosts').onSnapshot(function(s){DB.userPosts=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()},function(e){});
  db.collection('extraPayments').onSnapshot(function(s){DB.extraPayments=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()},function(e){});
  db.collection('messages').onSnapshot(function(s){
    DB.messages=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    s.docChanges().forEach(function(change){
      if(change.type === 'added'){
        var msg = change.doc.data();
        if(msg.receiverId === state.member.id && msg.senderId !== state.member.id) {
           if(msg.timestamp && (Date.now() - msg.timestamp < 10000)) {
              showLocalNotification('নতুন মেসেজ', msg.senderName + ': ' + msg.text);
           }
           var currentStack = state.stack[state.stack.length - 1];
           if(currentStack && currentStack.name === 'chat' && currentStack.id === msg.senderId){
               markMessagesAsRead(msg.senderId);
           }
        }
      }
      if(change.type === 'modified'){
        var currentStack2 = state.stack[state.stack.length - 1];
        if(currentStack2 && currentStack2.name === 'chat'){
          var chatBox2 = document.getElementById('chatMessages');
          if(chatBox2){
            chatBox2.innerHTML = renderChatMessages(currentStack2.id);
            chatBox2.scrollTop = chatBox2.scrollHeight;
          }
        }
      }
    });
    var currentStack = state.stack[state.stack.length - 1];
    if(currentStack && currentStack.name === 'chat'){
      var chatBox = document.getElementById('chatMessages');
      if(chatBox){
        chatBox.innerHTML = renderChatMessages(currentStack.id);
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }
    if(!state.loading)render();
  },function(e){});
}
window.addEventListener('online',function(){if(state.member){render();toast('অনলাইন','success')}});
window.addEventListener('offline',function(){if(state.member){toast('অফলাইন মোড')}});
</script>
