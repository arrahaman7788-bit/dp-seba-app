<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0E5F30"/>
<title>DP সেবা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#0E5F30;--primary-d:#083A1C;--primary-l:#1B8044;--primary-soft:#E5F2EA;--accent:#C41E3A;--accent-soft:#FCE7EC;--gold:#D4A017;--gold-soft:#FBF3DC;--income:#16A34A;--income-soft:#E6F7EE;--expense:#DC2626;--expense-soft:#FDE8ED;--warn:#D97706;--warn-soft:#FEF3C7;--info:#0284C7;--info-soft:#E0F2FE;--danger:#B91C1C;--danger-soft:#FEE2E2;--bg:#F0F5F2;--bg-2:#E1EBE6;--card:#FFFFFF;--card-2:#F6FAF8;--text:#0A1A12;--text-2:#4E5F55;--text-3:#8B9A92;--border:#DCE7E1;--border-2:#E9F2ED;--shadow:0 4px 16px rgba(14,95,48,.07);--radius:20px;--nav-h:70px}
[data-theme="dark"]{--primary:#22A155;--primary-d:#0E5F30;--primary-l:#3DC76F;--primary-soft:#0A2A18;--accent:#FF4D6D;--accent-soft:#3A0F1A;--gold:#FBBF24;--gold-soft:#3A2E10;--income:#2ECC71;--income-soft:#12301F;--expense:#FF5C7A;--expense-soft:#3A1520;--warn:#FBBF24;--warn-soft:#3A2E10;--info:#38BDF8;--info-soft:#0C2A3A;--danger:#F87171;--danger-soft:#3A1010;--bg:#06100B;--bg-2:#030806;--card:#0F1A15;--card-2:#15241D;--text:#E8F5EE;--text-2:#95B3A5;--text-3:#627A70;--border:#1C2E24;--border-2:#15241C;--shadow:0 4px 16px rgba(0,0,0,.35)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:'Hind Siliguri',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-2);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:0;height:0}
#app{position:relative;max-width:540px;margin:0 auto;height:100dvh;height:100vh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 90px rgba(0,0,0,.12)}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + 26px)}
.hd{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd h1{font-size:20px;font-weight:700;margin:0}
.hd .sub{font-size:12px;color:var(--text-2);margin-top:2px}
.sec{padding:0 18px;margin-top:18px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-hd h2{font-size:15px;font-weight:700;margin:0}
.sec-hd .link{font-size:12px;color:var(--primary);font-weight:600}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border-2);padding:16px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--text-2)}.tiny{font-size:11px}.sm{font-size:12px}
.b{font-weight:600}.bb{font-weight:700}.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{text-align:center}.gap6{gap:6px}.gap10{gap:10px}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 65%,#000));color:#fff;font-weight:700;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:10.5px;font-weight:600;line-height:1.6}
.pill.paid,.pill.active,.pill.approved{background:var(--income-soft);color:var(--income)}
.pill.due,.pill.suspended,.pill.rejected{background:var(--expense-soft);color:var(--expense)}
.pill.partial,.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.inactive{background:var(--border);color:var(--text-3)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.urgent{background:var(--danger-soft);color:var(--danger)}
.pill.important{background:var(--warn-soft);color:var(--warn)}
.pill.normal{background:var(--info-soft);color:var(--info)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;color:#fff;transition:transform .12s;background:linear-gradient(135deg,var(--primary-l),var(--primary));box-shadow:0 8px 20px -8px rgba(14,95,48,.7);width:100%}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--border);box-shadow:none}
.btn.soft{background:var(--primary-soft);color:var(--primary);box-shadow:none}
.btn.gold{background:linear-gradient(135deg,var(--gold),#B58414)}
.btn.danger{background:linear-gradient(135deg,#E11D48,#B91C1C)}
.btn.block{width:100%}
.icon-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border-2);color:var(--text-2);transition:transform .12s;position:relative}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px}
.icon-btn .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--accent);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);line-height:1}
.balance-card{position:relative;overflow:hidden;border-radius:26px;padding:18px 20px 20px;background:radial-gradient(circle at 90% 10%,rgba(212,160,23,.35),transparent 40%),radial-gradient(circle at 10% 90%,rgba(196,30,58,.28),transparent 45%),linear-gradient(135deg,#0A4A24 0%,#0E5F30 45%,#1B8044 100%);color:#fff;box-shadow:0 22px 46px -18px rgba(14,95,48,.85),0 8px 18px -8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.18)}
[data-theme="dark"] .balance-card{background:radial-gradient(circle at 90% 10%,rgba(251,191,36,.28),transparent 40%),radial-gradient(circle at 10% 90%,rgba(255,77,109,.25),transparent 45%),linear-gradient(135deg,#041A0C 0%,#0E5F30 45%,#167A3A 100%)}
.balance-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);pointer-events:none;animation:bc-shine 8s ease-in-out infinite}
@keyframes bc-shine{0%,100%{transform:translateX(-60%) translateY(-60%)}50%{transform:translateX(-40%) translateY(-40%)}}
.balance-card::after{content:'';position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.09),transparent 70%);top:-120px;right:-70px;pointer-events:none}
.bc-header{display:flex;align-items:center;gap:12px;position:relative;z-index:2;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.15)}
.bc-logo{width:52px;height:52px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;padding:4px;flex:none;box-shadow:0 6px 14px rgba(0,0,0,.25);overflow:hidden}
.bc-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:11px}
.bc-org{flex:1;min-width:0}
.bc-org-name{font-size:14.5px;font-weight:700;line-height:1.2;letter-spacing:-.2px}
.bc-org-sub{font-size:10.5px;opacity:.82;margin-top:2px;font-weight:500}
.bc-label{font-size:12px;opacity:.86;letter-spacing:.4px;font-weight:500;margin-top:14px}
.bc-amount{font-size:33px;font-weight:700;letter-spacing:-1px;margin-top:4px;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.bc-sub{font-size:11px;opacity:.72;margin-top:4px}
.bc-stats{display:flex;gap:10px;margin-top:16px;position:relative;z-index:2}
.bc-stat{flex:1;background:rgba(255,255,255,.13);border-radius:14px;padding:10px 11px;border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.bc-stat .k{font-size:10px;opacity:.9}.bc-stat .v{font-size:14.5px;font-weight:700;margin-top:3px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.stat{background:linear-gradient(135deg,var(--card) 0%,var(--card-2) 100%);border:1px solid var(--border-2);border-radius:18px;padding:13px;box-shadow:var(--shadow)}
.stat .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.stat .ic svg{width:16px;height:16px}
.stat .k{font-size:10.5px;color:var(--text-2);font-weight:500;line-height:1.3}
.stat .v{font-size:16px;font-weight:700;margin-top:3px}
.list{background:var(--card);border:1px solid var(--border-2);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 15px;transition:background .15s}
.li:active{background:var(--card-2)}
.li+.li{border-top:1px solid var(--border-2)}
.li .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.li .ic svg{width:17px;height:17px}
.li .t{font-size:13.5px;font-weight:600;line-height:1.35}
.li .s{font-size:11px;color:var(--text-3);margin-top:2px}
.li .amt{font-size:14px;font-weight:700;white-space:nowrap}
.amt.pos{color:var(--income)}.amt.neg{color:var(--expense)}
.prog{height:8px;border-radius:99px;background:var(--border);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary-l),var(--primary));box-shadow:0 0 12px rgba(14,95,48,.5);transition:width .8s}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--card);border:1px solid var(--border);color:var(--text-2);flex:none}
.chip.on{background:linear-gradient(135deg,var(--primary-l),var(--primary));border-color:var(--primary);color:#fff}
.searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 13px;height:46px;box-shadow:var(--shadow)}
.searchbar svg{width:17px;height:17px;color:var(--text-3);flex:none}
.searchbar input{flex:1;border:none;outline:none;background:none;font-size:13.5px;height:100%}
.bottomnav{position:absolute;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--card);border-top:1px solid var(--border-2);display:flex;z-index:40}
.bottomnav .nv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);position:relative;padding-top:2px}
.bottomnav .nv svg{width:21px;height:21px}
.bottomnav .nv span{font-size:9.5px;font-weight:600}
.bottomnav .nv.on{color:var(--primary)}
.bottomnav .nv.on::before{content:'';position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--primary)}
.bottomnav .nv .badge{position:absolute;top:8px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--accent);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--card);line-height:1}
.subpage{position:absolute;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column}
.subhd{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border-2);flex:none}
.subhd h1{font-size:16.5px;font-weight:700;margin:0;flex:1}
.subbody{flex:1;overflow-y:auto;padding-bottom:34px}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:120;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:540px;border-radius:26px 26px 0 0;max-height:92vh;display:flex;flex-direction:column}
.modal-hd{padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border-2);flex:none}
.modal-hd h2{margin:0;font-size:16px;font-weight:700;flex:1}
.modal-body{flex:1;overflow-y:auto;padding:18px}
.modal-foot{padding:14px 18px;border-top:1px solid var(--border-2);flex:none;display:flex;gap:10px;background:var(--card)}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;height:46px;border-radius:13px;border:1.5px solid var(--border);background:var(--card);padding:0 13px;outline:none;font-size:14px}
.field textarea{height:auto;min-height:90px;padding:11px 13px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3.5px var(--primary-soft)}
.field .hint{font-size:10.5px;color:var(--text-3);margin-top:5px;line-height:1.5}
.field input.pin-input{text-align:center;font-size:24px;font-weight:700;letter-spacing:12px;font-family:'Courier New',monospace;padding-left:20px}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:16px;font-size:12.5px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:all .28s;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.success{background:#16A34A;color:#fff}
.toast.error{background:#DC2626;color:#fff}
.update-banner{position:fixed;top:14px;left:50%;transform:translate(-50%,-80px);background:linear-gradient(135deg,#16A34A,#0E7A38);color:#fff;padding:11px 20px;border-radius:99px;font-size:12.5px;font-weight:700;z-index:500;display:flex;align-items:center;gap:8px;box-shadow:0 12px 30px -8px rgba(22,163,74,.7),0 4px 12px rgba(0,0,0,.15);pointer-events:none;transition:transform .35s cubic-bezier(.22,.9,.3,1),opacity .35s;opacity:0;max-width:88%;white-space:nowrap}
.update-banner.show{transform:translate(-50%,0);opacity:1}
.update-banner svg{width:16px;height:16px;flex:none}
.empty{padding:44px 24px;text-align:center;color:var(--text-3)}
.empty .eic{width:66px;height:66px;border-radius:22px;background:var(--card);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.empty .eic svg{width:28px;height:28px;color:var(--text-3)}
.empty h3{margin:0 0 5px;font-size:14px;color:var(--text-2);font-weight:600}
.empty p{margin:0;font-size:12px}
.login{padding:0 24px;display:flex;flex-direction:column;justify-content:center;min-height:100%;position:relative;overflow:hidden}
.login-logo{width:90px;height:90px;border-radius:26px;overflow:hidden;background:#fff;padding:5px;margin:0 auto 18px;box-shadow:0 18px 38px -12px rgba(14,95,48,.6)}
.login-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:21px}
.login h1{font-size:22px;margin:0 0 6px;font-weight:700;text-align:center;color:var(--primary)}
.login .tag{font-size:13.5px;color:var(--text-2);margin:0 0 26px;line-height:1.6;text-align:center}
.splash{position:absolute;inset:0;background:linear-gradient(160deg,#0E5F30,#083A1C 60%,#041A0C);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:300;color:#fff}
.splash .logo-big{width:110px;height:110px;border-radius:30px;background:#fff;padding:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.splash .logo-big img{width:100%;height:100%;object-fit:contain;display:block;border-radius:24px}
.splash h1{font-size:22px;margin:0;font-weight:700}
.splash p{margin:0;font-size:12.5px;opacity:.85}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.offline{background:var(--warn-soft);color:var(--warn);font-size:11.5px;font-weight:600;padding:7px 16px;display:flex;align-items:center;justify-content:center;gap:7px;flex:none}
.offline svg{width:14px;height:14px}
.info-box{background:var(--info-soft);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--info);font-weight:500;line-height:1.6}
.warn-box{background:var(--warn-soft);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--warn);font-weight:500;line-height:1.6}
.err-box{background:var(--danger-soft);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--danger);font-weight:500;line-height:1.6;margin-bottom:12px;display:none}
.err-box.show{display:block}
.hd-logo{width:46px;height:46px;border-radius:14px;background:#fff;padding:3px;flex:none;border:1px solid var(--border-2);overflow:hidden}
.hd-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:11px}
.bkash-card{background:linear-gradient(135deg,#E2136E,#B30F57);color:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 18px 40px -18px rgba(226,19,110,.7);position:relative;overflow:hidden}
.bkash-brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;position:relative;z-index:2}
.bkash-brand .logo{background:#fff;color:#E2136E;padding:3px 9px;border-radius:8px;font-size:11.5px;font-weight:800}
.bkash-label{font-size:11.5px;opacity:.9;margin-top:14px;position:relative;z-index:2}
.bkash-num{font-size:26px;font-weight:700;letter-spacing:1.2px;margin-top:4px;position:relative;z-index:2}
.bkash-hint{font-size:11px;opacity:.85;margin-top:6px;position:relative;z-index:2;line-height:1.6}
.bkash-btn{position:relative;z-index:2;margin-top:13px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);color:#fff;padding:9px 15px;border-radius:11px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;width:auto}
.tabs-line{display:flex;gap:0;border-bottom:1.5px solid var(--border-2);margin-bottom:14px}
.tabs-line button{flex:1;padding:11px 4px;font-weight:600;font-size:12.5px;color:var(--text-3);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tabs-line button.on{color:var(--primary);border-bottom-color:var(--primary)}
.link-btn{color:var(--primary);font-weight:600;text-align:center;font-size:13px;padding:8px;width:100%;background:none;border:none;display:block}
.msg-item{padding:14px 16px;border-bottom:1px solid var(--border-2);cursor:pointer}
.msg-item.unread{background:var(--primary-soft)}
.msg-item.unread .msg-name{font-weight:700}
.msg-head{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.msg-name{font-size:13.5px;font-weight:600;flex:1;line-height:1.3}
.msg-time{font-size:10.5px;color:var(--text-3);flex:none}
.msg-preview{font-size:12.5px;color:var(--text-2);line-height:1.5;padding-left:52px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chat-bubble{max-width:78%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.55;word-break:break-word;white-space:pre-wrap}
.chat-me{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.chat-you{background:var(--card);color:var(--text);border:1px solid var(--border-2);align-self:flex-start;border-bottom-left-radius:5px}
.chat-time{font-size:10px;opacity:.7;margin-top:4px}
.dir-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:11px}
.dir-tile{background:var(--card);border:1px solid var(--border-2);border-radius:18px;padding:14px 8px;text-align:center;box-shadow:var(--shadow);cursor:pointer;display:block;width:100%}
.dir-tile .avatar{margin:0 auto 9px}

function $(s){ return document.querySelector(s); }
function pad2(n){ return String(n).padStart(2,'0'); }

function MN(m){ return BN_MONTHS[m-1]; }
function toISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseISO(s){ if(!s) return new Date(); const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function fmtDate(iso){
  if(!iso) return '—';
  try{ const d=parseISO(iso); return d.getDate()+' '+MN(d.getMonth()+1)+' '+d.getFullYear(); }
  catch(e){ return iso; }
}
function fmtTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  let hr = d.getHours();
  const ap = hr>=12 ? 'PM' : 'AM';
  hr = hr%12 || 12;
  const today = toISO(new Date());
  const dISO = toISO(d);
  if(dISO === today) return hr+':'+pad2(d.getMinutes())+' '+ap;
  const diff = Math.floor((Date.now()-ts)/86400000);
  if(diff === 1) return 'গতকাল';
  if(diff < 7) return diff+' দিন আগে';
  return d.getDate()+' '+MN(d.getMonth()+1);
}
function avatarHTML(m, size){

}

function normalizePhone(raw){
  if(!raw) return '';
  let s = String(raw).trim();
  const plus = s.startsWith('+');
  s = s.replace(/[^\d]/g, '');
  if(!s) return '';
  if(!plus && s.startsWith('0') && s.length === 11) s = '88' + s;
  return s;
}

function showUpdateBanner(message){
  const now = Date.now();
  if(now - _updateBannerLastShown < 4000) return;
  _updateBannerLastShown = now;
  const banner = document.getElementById('updateBanner');
  const textEl = document.getElementById('updateBannerText');
  if(!banner) return;
  if(textEl && message) textEl.textContent = message;
  banner.classList.add('show');

}

const DATA = {
  mySummary(){
    const cs = state.myContribs;
    const expected = cs.reduce((a,b)=>a+(b.amount||0),0);
    const paid = cs.reduce((a,b)=>a+(b.paidAmount||0),0);
    const extras = state.myExtras.reduce((a,b)=>a+(b.amount||0),0);
    return {
      expected: expected, paid: paid,
      due: Math.max(expected - paid, 0),
      extras: extras, count: cs.length,
      percent: expected ? Math.round(paid/expected*100) : 0
    };
  },
  thisMonth(){
    const n = new Date();
    return state.myContribs.find(c => c.year === n.getFullYear() && c.month === n.getMonth()+1) || null;
  },
  memberById(id){ return DB.allMembers.find(m => m.id === id) || null; },
  // সংগঠনের মোট হিসাব (সব সদস্যের ডেটা থেকে)
  orgStats(){
    let income=0, expense=0;
    let contribution=0, extra=0, donation=0, otherIncome=0, eventExp=0, otherExp=0;
    DB.allTransactions.forEach(function(t){
      if(t.type==='contribution'){contribution+=t.amount;income+=t.amount}
      else if(t.type==='extra_payment'){extra+=t.amount;income+=t.amount}
      else if(t.type==='donation'){donation+=t.amount;income+=t.amount}
      else if(t.type==='other_income'){otherIncome+=t.amount;income+=t.amount}
      else if(t.type==='event_expense'){eventExp+=t.amount;expense+=t.amount}
      else if(t.type==='other_expense'){otherExp+=t.amount;expense+=t.amount}
    });
    return {income:income, expense:expense, balance:income-expense, contribution:contribution, extra:extra, donation:donation, otherIncome:otherIncome, eventExp:eventExp, otherExp:otherExp};
  },
  // একজন সদস্যের সংগঠনে মোট জমা
  memberTotalPaid(memberId){
    const cs = DB.allContribs.filter(c=>c.memberId===memberId);
    const paid = cs.reduce((a,b)=>a+(b.paidAmount||0),0);
    const extras = DB.allExtras.filter(x=>x.memberId===memberId).reduce((a,b)=>a+(b.amount||0),0);
    const expected = cs.reduce((a,b)=>a+(b.amount||0),0);
    return { paid: paid, extras: extras, total: paid+extras, expected: expected, due: Math.max(expected-paid,0) };
  },
  // একজন সদস্যের মাসিক চাঁদার হিস্টোরি
  memberContribs(memberId){
    return DB.allContribs.filter(c=>c.memberId===memberId).sort(function(a,b){
      return (b.year||0)-(a.year||0) || (b.month||0)-(a.month||0);
    });
  },
  // একজন সদস্যের অতিরিক্ত জমা
  memberExtras(memberId){
    return DB.allExtras.filter(x=>x.memberId===memberId).sort(function(a,b){
      return (b.date||'').localeCompare(a.date||'');
    });
  }
};

async function findMemberByPhone(phoneNorm){
  let snap = await getDocs(query(collection(db,'members'), where('phoneNorm','==',phoneNorm), limit(1)));
  if(!snap.empty) return snap.docs[0];
  snap = await getDocs(query(collection(db,'members'), where('phone','==',phoneNorm), limit(1)));
  if(!snap.empty) return snap.docs[0];
  if(phoneNorm.startsWith('880')){
    const local = '0' + phoneNorm.slice(3);
    snap = await getDocs(query(collection(db,'members'), where('phone','==',local), limit(1)));
    if(!snap.empty) return snap.docs[0];
  }
  return null;
}

async function doLogin(){
  const errEl = document.getElementById('lgErr');
  const showErr = function(m){ if(errEl){ errEl.textContent = m; errEl.classList.add('show'); } };
  const hideErr = function(){ if(errEl){ errEl.classList.remove('show'); } };
  hideErr();
  const rawPhone = ($('#lgPhone')||{}).value || '';
  const pin = ($('#lgPin')||{}).value || '';
  const phoneNorm = normalizePhone(rawPhone);
  if(!phoneNorm){ showErr('ফোন নাম্বার দিন'); return; }
  if(!/^\d{4}$/.test(pin)){ showErr('৪-ডিজিট PIN দিন'); return; }
  const email = authEmailFromPhone(phoneNorm);
  try{
    toast('লগইন হচ্ছে…');
    await signInWithEmailAndPassword(auth, email, makeAuthPassword(pin));
  }catch(err){
    console.error(err);
    let msg = 'লগইন ব্যর্থ';
    if(err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') msg = 'ভুল নাম্বার বা PIN';
    else if(err.code === 'auth/user-not-found') msg = 'এই নাম্বারে অ্যাকাউন্ট নেই — "একাউন্ট তৈরি" ট্যাবে যান';
    else if(err.code === 'auth/invalid-email') msg = 'নাম্বার সঠিক নয়';
    else if(err.code === 'auth/too-many-requests') msg = 'অনেকবার চেষ্টা — কিছুক্ষণ পর';
    showErr(msg);
  }
}

async function doSetup(){
  const errEl = document.getElementById('suErr');
  const showErr = function(m){ if(errEl){ errEl.textContent = m; errEl.classList.add('show'); } };
  const hideErr = function(){ if(errEl){ errEl.classList.remove('show'); } };
  hideErr();
  const rawPhone = ($('#suPhone')||{}).value || '';
  const pin1 = ($('#suPin1')||{}).value || '';
  const pin2 = ($('#suPin2')||{}).value || '';
  const phoneNorm = normalizePhone(rawPhone);
  if(!phoneNorm){ showErr('ফোন নাম্বার দিন'); return; }
  if(!/^\d{4}$/.test(pin1)){ showErr('৪-ডিজিট PIN দিন'); return; }
  if(pin1 !== pin2){ showErr('দুটি PIN মিলছে না'); return; }

  try{
    toast('যাচাই হচ্ছে…');
    const memberDoc = await findMemberByPhone(phoneNorm);
    if(!memberDoc){ showErr('❌ এই নাম্বারটি অ্যাডমিন এখনো যোগ করেননি।\n\nঅ্যাডমিনের সাথে যোগাযোগ করুন।'); return; }
    const md = memberDoc.data();
    if(md.accountSetup === true){ showErr('এই অ্যাকাউন্ট আগেই তৈরি হয়েছে — লগইন করুন'); return; }

    const email = authEmailFromPhone(phoneNorm);
    const pass = makeAuthPassword(pin1);
    let uid = null;
    try{
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      uid = cred.user.uid;
    }catch(err){
      if(err.code === 'auth/email-already-in-use'){
        try{
          const cred2 = await signInWithEmailAndPassword(auth, email, pass);
          uid = cred2.user.uid;
        }catch(err2){
          showErr('এই নাম্বারে ইতিমধ্যে Firebase অ্যাকাউন্ট আছে কিন্তু PIN আলাদা। অ্যাডমিনের সাথে যোগাযোগ করুন।');
          return;
        }
      } else {
        showErr('Auth তৈরি ব্যর্থ: ' + err.message);
        return;
      }
    }
    await updateDoc(doc(db,'members',memberDoc.id), {
      authUid: uid,
      authEmail: email,
      accountSetup: true,
      updatedAt: Date.now()
    });
    toast('একাউন্ট তৈরি সম্পন্ন! স্বাগতম','success');
  }catch(err){
    console.error(err);
    showErr('ত্রুটি: ' + err.message);
  }
}

/* ========== মেসেজ ========== */
function viewMessages(){
  let h = '';
  h += '<div class="hd"><div><h1>মেসেজ</h1><div class="sub">'+state.inbox.length+' টি প্রাপ্ত · '+state.sent.length+' টি প্রেরিত</div></div></div>';
  h += '<div class="sec" style="margin-top:0">';
  if(!state.inbox.length && !state.sent.length){
    h += '<div class="empty"><div class="eic">'+icon('chat')+'</div><h3>এখনো কোনো মেসেজ নেই</h3><p>সদস্য ডিরেক্টরি থেকে মেসেজ পাঠান</p></div>';
  } else {
    const combined = state.inbox.concat(state.sent).sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
    const seen = {};
    const chats = [];
    combined.forEach(function(msg){
      const otherId = msg.fromId === state.member.id ? msg.toId : msg.fromId;
      if(seen[otherId]) return;
      seen[otherId] = 1;
      const other = DATA.memberById(otherId) || {id:otherId, name: (msg.fromId===state.member.id ? msg.toName : msg.fromName)};
      const isIn = msg.toId === state.member.id;
      chats.push({other:other, msg:msg, isIn:isIn});
    });
    h += '<div class="list">' + chats.map(function(c){
      const preview = (c.isIn ? '' : 'আপনি: ') + (c.msg.body || '');
      let unread = 0;
      state.inbox.forEach(function(x){ if(x.fromId===c.other.id && !x.read) unread++; });
      return '<div class="msg-item'+(unread?' unread':'')+'" data-act="open-chat" data-id="'+(c.other.id||'')+'">'+
        '<div class="msg-head">'+avatarHTML(c.other,40)+'<div class="msg-name ell">'+(c.other.name||'')+'</div><div class="msg-time">'+fmtTime(c.msg.ts)+'</div></div>'+
        '<div class="msg-preview">'+preview.replace(/</g,'&lt;')+'</div>'+
      '</div>';
    }).join('') + '</div>';
  }
  h += '</div>';
  return h;
}
function pageChat(otherId){
  const other = DATA.memberById(otherId);
  if(!other) return subHeader('মেসেজ') + '<div class="subbody"><div class="empty"><h3>সদস্য পাওয়া যায়নি</h3></div></div>';

        '<div class="chat-bubble '+(mine?'chat-me':'chat-you')+'">'+(m.body||'').replace(/</g,'&lt;')+'<div class="chat-time">'+fmtTime(m.ts)+(mine?' · '+(m.read?'✓✓':'✓'):'')+'</div></div>'+
      '</div>';
    });

  h += '</div>';
  h += '<div style="position:sticky;bottom:0;background:var(--card);padding:11px 14px;border-top:1px solid var(--border-2);display:flex;gap:9px;align-items:flex-end">'+
    '<textarea id="chatInput" rows="1" placeholder="মেসেজ লিখুন…" style="flex:1;resize:none;border:1.5px solid var(--border);background:var(--bg);border-radius:18px;padding:10px 14px;max-height:110px;font-family:inherit;font-size:13.5px;outline:none;line-height:1.5"></textarea>'+
    '<button class="btn" style="padding:11px 14px;border-radius:50%;width:auto;min-width:0" data-act="send-chat" data-id="'+(other.id||'')+'">'+icon('send')+'</button>'+
  '</div>';
  h += '</div>';
  return h;
}
async function sendChat(toId){
  const ta = document.getElementById('chatInput');
  if(!ta) return;
  const body = ta.value.trim();
  if(!body) return;
  const me = state.member;
  const other = DATA.memberById(toId);
  if(!other){ toast('প্রাপক পাওয়া যায়নি','error'); return; }
  ta.value = '';
  try{
    await addDoc(collection(db,'messages'), {
      fromId: me.id, fromName: me.name,
      fromAuthUid: state.user.uid,
      fromPhotoUrl: me.photoUrl || '',
      toId: other.id, toName: other.name,
      toAuthUid: other.authUid || '',
      body: body, ts: Date.now(), read: false
    });
    vibrate(12);
  }catch(err){ toast('পাঠানো যায়নি: '+err.message,'error'); }
}

/* ========== Modals ========== */
function openModal(opts){
  const root = $('#modalRoot');
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = '<div class="modal"><div class="modal-hd"><button class="icon-btn" data-mclose="1" style="width:34px;height:34px">'+icon('x')+'</button><h2>'+opts.title+'</h2></div><div class="modal-body">'+opts.body+'</div>'+(opts.footer?'<div class="modal-foot">'+opts.footer+'</div>':'')+'</div>';
  root.appendChild(back);
  back.addEventListener('click', function(e){
    if(e.target === back || e.target.closest('[data-mclose]')) closeModal();
  });
  if(opts.onMount) opts.onMount(back);
  return back;
}
function closeModal(){
  const b = document.querySelector('.modal-back');
  if(b) b.remove();
}
function formEditMyName(){
  const m = state.member;
  openModal({
    title: 'আমার নাম সম্পাদনা',
    body: '<div class="field"><label>নতুন নাম</label><input id="nmValue" value="'+(m.name||'').replace(/"/g,'&quot;')+'" placeholder="আপনার পুরো নাম"/></div>'+
      '<div class="info-box">আপনি শুধু নিজের নাম পরিবর্তন করতে পারবেন।</div>',
    footer: '<button class="btn ghost" data-mclose="1">বাতিল</button><button class="btn" id="nmSave">সংরক্ষণ</button>',
    onMount: function(mr){
      const inp = mr.querySelector('#nmValue');
      setTimeout(function(){ inp.focus(); inp.select(); }, 80);
      mr.querySelector('#nmSave').addEventListener('click', async function(){
        const v = inp.value.trim();
        if(!v){ toast('নাম দিন','error'); return; }
        try{
          await updateDoc(doc(db,'members',m._docId||m.id), {name:v, updatedAt:Date.now()});
          state.member.name = v;
          closeModal();
          toast('নাম আপডেট হয়েছে','success');
          render();
        }catch(err){ toast('Error: '+err.message,'error'); }

      '<div class="field"><label>নতুন ৪-ডিজিট PIN</label><input id="cpNew" type="tel" inputmode="numeric" maxlength="4" class="pin-input" placeholder="----"/></div>'+
      '<div class="field"><label>নতুন PIN আবার</label><input id="cpNew2" type="tel" inputmode="numeric" maxlength="4" class="pin-input" placeholder="----"/></div>',

      mr.querySelector('#cpSave').addEventListener('click', async function(){
        const oldP = mr.querySelector('#cpOld').value;

        if(!/^\d{4}$/.test(oldP)){ toast('বর্তমান ৪-ডিজিট PIN দিন','error'); return; }

          const cred = EmailAuthProvider.credential(auth.currentUser.email, makeAuthPassword(oldP));

          await updatePassword(auth.currentUser, makeAuthPassword(p1));
          closeModal();
          toast('PIN পরিবর্তিত হয়েছে','success');
        }catch(err){
          if(err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') toast('পুরনো PIN ভুল','error');
          else toast('Error: '+err.message,'error');
        }
      });
    }
  });
}
function formPayNotify(){
  const m = state.member;
  const now = new Date();
  openModal({
    title: 'আমি টাকা পাঠিয়েছি',
    body: '<div class="info-box" style="margin-bottom:14px">bKash-এ টাকা পাঠানোর পর এই ফর্মটি পূরণ করুন। অ্যাডমিন দেখে যাচাই করে আপনার চাঁদায় যোগ করবেন।</div>'+
      '<div class="field"><label>টাকার পরিমাণ (৳)</label><input id="pnAmt" type="number" placeholder="যেমন: 500"/></div>'+
      '<div class="field-row"><div class="field"><label>কোন মাসের জন্য</label><select id="pnMonth">'+BN_MONTHS.map((nm,i)=>'<option value="'+(i+1)+'" '+(i+1===now.getMonth()+1?'selected':'')+'>'+nm+'</option>').join('')+'</select></div><div class="field"><label>বছর</label><input id="pnYear" type="number" value="'+now.getFullYear()+'"/></div></div>'+
      '<div class="field"><label>কবে পাঠিয়েছেন</label><input id="pnDate" type="date" value="'+toISO(now)+'"/></div>'+
      '<div class="field"><label>নোট (ঐচ্ছিক)</label><input id="pnNote" placeholder="যেমন: bKash ref 8XX1234..."/></div>'+
      '<div class="info-box" style="text-align:left">📱 bKash নাম্বার: <b>'+BKASH_NUMBER+'</b><br>Reference-এ লিখুন: <b>'+(m.id||'')+'</b></div>',
    footer: '<button class="btn ghost" data-mclose="1">বাতিল</button><button class="btn gold" id="pnSave">অ্যাডমিনকে জানান</button>',
    onMount: function(mr){
      mr.querySelector('#pnSave').addEventListener('click', async function(){
        const amt = parseInt(mr.querySelector('#pnAmt').value)||0;
        const mm = parseInt(mr.querySelector('#pnMonth').value)||1;
        const yy = parseInt(mr.querySelector('#pnYear').value)||now.getFullYear();
        const date = mr.querySelector('#pnDate').value || toISO(now);
        const note = mr.querySelector('#pnNote').value.trim();
        if(amt<=0){ toast('সঠিক পরিমাণ দিন','error'); return; }
        try{
          await addDoc(collection(db,'paymentRequests'), {
            memberId: m.id,
            memberName: m.name,
            authUid: state.user.uid,
            amount: amt,
            forMonth: mm,
            forYear: yy,
            date: date,
            note: note,
            status: 'pending',
            ts: Date.now()
          });
          closeModal();
          toast('✓ অ্যাডমিনকে জানানো হয়েছে!','success');
          vibrate(20);
        }catch(err){
          console.error(err);
          toast('Error: '+err.message,'error');
        }
      });
    }
  });
}

/* ========== Navigation ========== */
function pushPage(name, params){
  state.stack.push(Object.assign({name:name}, params||{}));
  render();
}
function popPage(){
  state.stack.pop();
  if(!state.stack.length && state.openChat){ state.openChat = null; state.chatMessages = []; }
  render();
}
function switchTab(t){
  state.stack = [];
  state.openChat = null;
  state.chatMessages = [];
  state.tab = t;
  render();
  const c = $('#content');
  if(c) c.scrollTop = 0;
}

document.addEventListener('click', function(ev){
  const el = ev.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  vibrate(6);
  if(act === 'login-tab'){ state.loginTab = el.dataset.v; render(); return; }
  if(act === 'do-login'){ doLogin(); return; }
  if(act === 'do-setup'){ doSetup(); return; }
  if(act === 'tab'){ switchTab(el.dataset.tab); return; }
  if(act === 'back'){ popPage(); return; }
  if(act === 'mfilter'){ state.memberFilter = el.dataset.v; render(); return; }
  if(act === 'open-member'){ pushPage('memberProfile', {id: el.dataset.id}); return; }
  if(act === 'open-chat'){
    const id = el.dataset.id;
    if(!id) return;
    state.openChat = id;
    pushPage('chat', {id:id});
    return;
  }
  if(act === 'send-chat'){ sendChat(el.dataset.id); return; }
  if(act === 'edit-my-name'){ formEditMyName(); return; }
  if(act === 'change-pin'){ formChangePin(); return; }
  if(act === 'open-pay-notify'){ formPayNotify(); return; }
  if(act === 'toggle-theme'){
    state.theme = state.theme==='dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = state.theme;
    try{ localStorage.setItem('dp_theme', state.theme); }catch(e){}
    render();
    return;
  }
  if(act === 'copy-bkash'){
    const num = BKASH_NUMBER.replace(/\D/g,'');
    const done = function(){ toast('নাম্বার কপি হয়েছে','success'); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(num).then(done).catch(function(){ fallbackCopy(num); done(); });
    } else { fallbackCopy(num); done(); }
    return;
  }
  if(act === 'logout'){
    openModal({
      title: 'লগআউট?',
      body: '<div class="warn-box">আপনি কি নিশ্চিত?</div>',
      footer: '<button class="btn ghost" data-mclose="1">বাতিল</button><button class="btn danger" id="loYes">লগআউট</button>',
      onMount: function(mr){
        mr.querySelector('#loYes').addEventListener('click', async function(){
          closeModal();
          await signOut(auth);
        });
      }
    });
    return;
  }
});

document.addEventListener('input', function(ev){
  if(ev.target.id === 'memberSearch'){
    state.memberQ = ev.target.value;
    const pos = ev.target.selectionStart;
    render();
    const inp = $('#memberSearch');
    if(inp){ inp.focus(); try{ inp.setSelectionRange(pos,pos); }catch(e){} }
  }
  if(ev.target.classList && ev.target.classList.contains('pin-input')){
    ev.target.value = ev.target.value.replace(/\D/g,'').slice(0,4);
  }
});

document.addEventListener('keydown', function(ev){
  if(ev.key !== 'Enter') return;
  const id = ev.target.id;
  if(id === 'lgPhone' || id === 'lgPin') doLogin();
  else if(id === 'suPhone' || id === 'suPin1' || id === 'suPin2') doSetup();
  else if(id === 'chatInput'){ sendChat(state.openChat); }
});

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

try{
  const t = localStorage.getItem('dp_theme');
  if(t){ state.theme = t; document.documentElement.dataset.theme = t; }
}catch(e){}

state.loading = true;
render();

onAuthStateChanged(auth, async function(user){
  if(unsubs.length){ unsubs.forEach(function(u){ try{u();}catch(e){} }); unsubs = []; }
  if(!user){
    state.user = null;
    state.member = null;
    state.myContribs = [];
    state.myExtras = [];
    state.inbox = [];
    state.sent = [];
    state.unreadCount = 0;
    state.openChat = null;
    state.chatMessages = [];
    state.myRequests = [];
    state.tab = 'home';
    state.stack = [];
    state.loading = false;
    render();
    return;
  }
  state.user = user;
  try{
    let mSnap = await getDocs(query(collection(db,'members'), where('authUid','==',user.uid), limit(1)));
    let memberDoc = null;
    if(!mSnap.empty) memberDoc = mSnap.docs[0];
    else {
      const byEmail = await getDocs(query(collection(db,'members'), where('authEmail','==',user.email||''), limit(1)));
      if(!byEmail.empty) memberDoc = byEmail.docs[0];
    }
    if(!memberDoc){
      state.member = null;
      state.loading = false;
      render();
      return;
    }
    const md = memberDoc.data();
    state.member = Object.assign({}, md, {_docId: memberDoc.id, id: md.id || memberDoc.id});
    if(!state.member.phoneNorm && state.member.phone) state.member.phoneNorm = normalizePhone(state.member.phone);
    await loadInitialData();
    setupRealtime();
    state.loading = false;
    render();
  }catch(err){
    console.error(err);
    toast('ত্রুটি: '+err.message,'error');
    state.loading = false;
    render();
  }
});

async function loadInitialData(){
  const mid = state.member.id;
  try{
    const results = await Promise.all([
      getDocs(query(collection(db,'contributions'), where('memberId','==',mid))),
      getDocs(query(collection(db,'extraPayments'), where('memberId','==',mid))),
      getDocs(collection(db,'announcements')),
      getDocs(collection(db,'members')),
      getDocs(collection(db,'contributions')),
      getDocs(collection(db,'transactions')),
      getDocs(collection(db,'extraPayments')),
      getDocs(query(collection(db,'paymentRequests'), where('authUid','==',state.user.uid)))
    ]);
    state.myContribs = results[0].docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); });
    state.myExtras = results[1].docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); });
    DB.announcements = results[2].docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); }).sort(function(a,b){
      return (b.date||'').localeCompare(a.date||'');
    });
    DB.allMembers = results[3].docs.map(function(d){ return Object.assign({}, d.data(), {_docId:d.id}); });
    DB.allContribs = results[4].docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); });
    DB.allTransactions = results[5].docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); });
    DB.allExtras = results[6].docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); });
    state.myRequests = results[7].docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); });
  }catch(err){
    console.error('load failed', err);
    toast('ডেটা লোড ব্যর্থ: '+err.message,'error');
  }
}

function setupRealtime(){
  const mid = state.member.id;
  const uid = state.user.uid;

  unsubs.push(onSnapshot(
    query(collection(db,'contributions'), where('memberId','==',mid)),
    { includeMetadataChanges: false },
    function(s){
      const prevPaid = state.myContribs.reduce(function(a,b){ return a + (b.paidAmount||0); }, 0);
      state.myContribs = s.docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); });
      const newPaid = state.myContribs.reduce(function(a,b){ return a + (b.paidAmount||0); }, 0);
      if(!state.loading){
        render();
        if(!s.metadata.fromCache && newPaid > prevPaid) showUpdateBanner('আপনার চাঁদা আপডেট হয়েছে');
      }
    }
  ));

  unsubs.push(onSnapshot(
    query(collection(db,'extraPayments'), where('memberId','==',mid)),
    { includeMetadataChanges: false },
    function(s){
      const prevCount = state.myExtras.length;
      state.myExtras = s.docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); });
      if(!state.loading){
        render();
        if(!s.metadata.fromCache && state.myExtras.length > prevCount) showUpdateBanner('নতুন অতিরিক্ত জমা এসেছে');
      }
    }
  ));

  unsubs.push(onSnapshot(
    collection(db,'announcements'),
    { includeMetadataChanges: false },
    function(s){
      const oldCount = DB.announcements.length;
      DB.announcements = s.docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); })
        .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
      if(!state.loading){
        render();
        if(!s.metadata.fromCache && DB.announcements.length > oldCount) showUpdateBanner('নতুন ঘোষণা এসেছে');
      }
    }
  ));

  unsubs.push(onSnapshot(
    collection(db,'members'),
    { includeMetadataChanges: false },
    function(s){
      const old = state.member ? Object.assign({}, state.member) : {};
      DB.allMembers = s.docs.map(function(d){ return Object.assign({}, d.data(), {_docId:d.id}); });
      const me = DB.allMembers.find(function(x){ return x.id === mid; });
      if(me) state.member = Object.assign({}, me, {_docId: me._docId||mid, id: me.id||mid});
      if(!state.loading){
        render();
        if(!s.metadata.fromCache && state.member){
          if(old.name && old.name !== state.member.name) showUpdateBanner('আপনার নাম আপডেট হয়েছে');
          else if(old.status && old.status !== state.member.status) showUpdateBanner('আপনার স্ট্যাটাস আপডেট হয়েছে');
          else if(old.monthly !== undefined && old.monthly !== state.member.monthly) showUpdateBanner('মাসিক চাঁদা আপডেট হয়েছে');
        }
      }
    }
  ));

  // সব চাঁদা (সংগঠনের হিসাবের জন্য)
  unsubs.push(onSnapshot(
    collection(db,'contributions'),
    { includeMetadataChanges: false },
    function(s){
      DB.allContribs = s.docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); });
      if(!state.loading) render();
    }
  ));

  // সব লেনদেন (সংগঠনের হিসাবের জন্য)
  unsubs.push(onSnapshot(
    collection(db,'transactions'),
    { includeMetadataChanges: false },
    function(s){
      DB.allTransactions = s.docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); });
      if(!state.loading) render();
    }
  ));

  // সব অতিরিক্ত জমা
  unsubs.push(onSnapshot(
    collection(db,'extraPayments'),
    { includeMetadataChanges: false },
    function(s){
      DB.allExtras = s.docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); });
      if(!state.loading) render();
    }
  ));

  // আমার পেমেন্ট রিকোয়েস্ট
  unsubs.push(onSnapshot(
    query(collection(db,'paymentRequests'), where('authUid','==',uid)),
    { includeMetadataChanges: false },
    function(s){
      state.myRequests = s.docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); });
      if(!state.loading) render();
    }
  ));

  // inbox messages
  unsubs.push(onSnapshot(
    query(collection(db,'messages'), where('toId','==',mid)),
    { includeMetadataChanges: false },
    function(s){
      const oldUnread = state.unreadCount;
      state.inbox = s.docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); })
        .sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
      state.unreadCount = state.inbox.filter(function(m){ return !m.read; }).length;
      if(state.openChat){
        state.chatMessages = state.inbox.filter(function(m){ return m.fromId === state.openChat; })
          .concat(state.sent.filter(function(m){ return m.toId === state.openChat; }))
          .sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
      }
      if(!state.loading){
        render();
        if(!s.metadata.fromCache && state.unreadCount > oldUnread) showUpdateBanner('নতুন মেসেজ এসেছে');
      }
    }
  ));

  // sent messages
  unsubs.push(onSnapshot(
    query(collection(db,'messages'), where('fromId','==',mid)),
    { includeMetadataChanges: false },
    function(s){
      state.sent = s.docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); })
        .sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
      if(state.openChat){
        state.chatMessages = state.inbox.filter(function(m){ return m.fromId === state.openChat; })
          .concat(state.sent.filter(function(m){ return m.toId === state.openChat; }))
          .sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
      }
      if(!state.loading) render();
    }
  ));
}

window.addEventListener('online', function(){ if(state.user){ render(); toast('অনলাইন','success'); } });
window.addEventListener('offline', function(){ if(state.user){ toast('অফলাইন'); } });
</script>
