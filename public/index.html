<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0E5F30"/>
<title>DP সেবা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#0E5F30;--primary-d:#083A1C;--primary-l:#1B8044;--primary-soft:#E5F2EA;--primary-soft2:#CDE6D9;--accent:#C41E3A;--accent-soft:#FCE7EC;--gold:#D4A017;--gold-soft:#FBF3DC;--income:#16A34A;--income-soft:#E6F7EE;--expense:#DC2626;--expense-soft:#FDE8ED;--donation:#C41E3A;--donation-soft:#FCE7EC;--event:#EA580C;--event-soft:#FEF0E7;--warn:#D97706;--warn-soft:#FEF3C7;--info:#0284C7;--info-soft:#E0F2FE;--danger:#B91C1C;--danger-soft:#FEE2E2;--bg:#F0F5F2;--bg-2:#E1EBE6;--card:#FFFFFF;--card-2:#F6FAF8;--text:#0A1A12;--text-2:#4E5F55;--text-3:#8B9A92;--border:#DCE7E1;--border-2:#E9F2ED;--shadow:0 4px 16px rgba(14,95,48,.07);--radius:20px;--nav-h:70px}
[data-theme="dark"]{--primary:#22A155;--primary-d:#0E5F30;--primary-l:#3DC76F;--primary-soft:#0A2A18;--primary-soft2:#123A22;--accent:#FF4D6D;--accent-soft:#3A0F1A;--gold:#FBBF24;--gold-soft:#3A2E10;--income:#2ECC71;--income-soft:#12301F;--expense:#FF5C7A;--expense-soft:#3A1520;--donation:#FF4D6D;--donation-soft:#3A0F1A;--event:#FB923C;--event-soft:#3A2110;--warn:#FBBF24;--warn-soft:#3A2E10;--info:#38BDF8;--info-soft:#0C2A3A;--danger:#F87171;--danger-soft:#3A1010;--bg:#06100B;--bg-2:#030806;--card:#0F1A15;--card-2:#15241D;--text:#E8F5EE;--text-2:#95B3A5;--text-3:#627A70;--border:#1C2E24;--border-2:#15241C;--shadow:0 4px 16px rgba(0,0,0,.35)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:'Hind Siliguri',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-2);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:0;height:0}
#app{position:relative;max-width:540px;margin:0 auto;height:100dvh;height:100vh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 90px rgba(0,0,0,.12)}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + 26px)}
.hd{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd h1{font-size:20px;font-weight:700;margin:0}
.hd .sub{font-size:12px;color:var(--text-2);margin-top:2px}
.sec{padding:0 18px;margin-top:18px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-hd h2{font-size:15px;font-weight:700;margin:0}
.sec-hd .link{font-size:12px;color:var(--primary);font-weight:600;cursor:pointer}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border-2);padding:16px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--text-2)}.tiny{font-size:11px}.sm{font-size:12px}
.b{font-weight:600}.bb{font-weight:700}.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{text-align:center}.gap6{gap:6px}.gap10{gap:10px}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 65%,#000));color:#fff;font-weight:700;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:10.5px;font-weight:600;line-height:1.6}
.pill.paid,.pill.active,.pill.approved,.pill.upcoming{background:var(--income-soft);color:var(--income)}
.pill.due,.pill.suspended,.pill.rejected{background:var(--expense-soft);color:var(--expense)}
.pill.partial,.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.na,.pill.inactive,.pill.past{background:var(--border);color:var(--text-3)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.extra{background:var(--accent-soft);color:var(--accent)}
.pill.urgent{background:var(--danger-soft);color:var(--danger)}
.pill.important{background:var(--warn-soft);color:var(--warn)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.event{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;color:#fff;transition:transform .12s;background:linear-gradient(135deg,var(--primary-l),var(--primary));box-shadow:0 8px 20px -8px rgba(14,95,48,.7)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--border);box-shadow:none}
.btn.soft{background:var(--primary-soft);color:var(--primary);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#E11D48,#B91C1C)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#B58414)}
.btn.small{padding:8px 14px;font-size:12.5px;border-radius:11px}
.btn.xs{padding:6px 11px;font-size:11.5px;border-radius:10px;gap:5px}
.btn.block{width:100%}
.icon-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border-2);color:var(--text-2);transition:transform .12s;flex:none}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px}
.balance-card{position:relative;overflow:hidden;border-radius:26px;padding:18px 20px 20px;background:radial-gradient(circle at 90% 10%,rgba(212,160,23,.35),transparent 40%),radial-gradient(circle at 10% 90%,rgba(196,30,58,.28),transparent 45%),linear-gradient(135deg,#0A4A24 0%,#0E5F30 45%,#1B8044 100%);color:#fff;box-shadow:0 22px 46px -18px rgba(14,95,48,.85),0 8px 18px -8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.18)}
[data-theme="dark"] .balance-card{background:radial-gradient(circle at 90% 10%,rgba(251,191,36,.28),transparent 40%),radial-gradient(circle at 10% 90%,rgba(255,77,109,.25),transparent 45%),linear-gradient(135deg,#041A0C 0%,#0E5F30 45%,#167A3A 100%)}
.balance-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);pointer-events:none;animation:bc-shine 8s ease-in-out infinite}
@keyframes bc-shine{0%,100%{transform:translateX(-60%) translateY(-60%)}50%{transform:translateX(-40%) translateY(-40%)}}
.balance-card::after{content:'';position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.09),transparent 70%);top:-120px;right:-70px;pointer-events:none}
.bc-header{display:flex;align-items:center;gap:12px;position:relative;z-index:2;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.15)}
.bc-logo{width:52px;height:52px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;padding:4px;flex:none;box-shadow:0 6px 14px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.9);overflow:hidden}
.bc-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:11px}
.bc-logo .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary-l),var(--primary));border-radius:11px;color:#fff}
.bc-logo .fallback svg{width:26px;height:26px}
.bc-org{flex:1;min-width:0}
.bc-org-name{font-size:14.5px;font-weight:700;line-height:1.2;letter-spacing:-.2px}
.bc-org-sub{font-size:10.5px;opacity:.82;margin-top:2px;font-weight:500}
.bc-label{font-size:12px;opacity:.86;letter-spacing:.4px;font-weight:500;margin-top:14px}
.bc-amount{font-size:33px;font-weight:700;letter-spacing:-1px;margin-top:4px;line-height:1.15}
.bc-sub{font-size:11px;opacity:.72;margin-top:4px}
.bc-stats{display:flex;gap:10px;margin-top:16px;position:relative;z-index:2}
.bc-stat{flex:1;background:rgba(255,255,255,.13);border-radius:14px;padding:10px 11px;border:1px solid rgba(255,255,255,.18)}
.bc-stat .k{font-size:10px;opacity:.9}.bc-stat .v{font-size:14.5px;font-weight:700;margin-top:3px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.stat{background:linear-gradient(135deg,var(--card) 0%,var(--card-2) 100%);border:1px solid var(--border-2);border-radius:18px;padding:13px;box-shadow:var(--shadow)}
.stat .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.stat .ic svg{width:16px;height:16px}
.stat .k{font-size:10.5px;color:var(--text-2);font-weight:500;line-height:1.3}
.stat .v{font-size:16px;font-weight:700;margin-top:3px}
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.qa{background:linear-gradient(135deg,var(--card) 0%,var(--card-2) 100%);border:1px solid var(--border-2);border-radius:18px;padding:13px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:var(--shadow);transition:transform .13s}
.qa:active{transform:scale(.94)}
.qa .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.qa .ic svg{width:18px;height:18px}
.qa span{font-size:10px;font-weight:600;color:var(--text-2);text-align:center;line-height:1.25}
.list{background:var(--card);border:1px solid var(--border-2);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 15px;transition:background .15s;cursor:pointer}
.li:active{background:var(--card-2)}
.li+.li{border-top:1px solid var(--border-2)}
.li .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.li .ic svg{width:17px;height:17px}
.li .t{font-size:13.5px;font-weight:600;line-height:1.35}
.li .s{font-size:11px;color:var(--text-3);margin-top:2px}
.li .amt{font-size:14px;font-weight:700;white-space:nowrap}
.li > .chev{width:20px;height:20px;color:var(--text-3);flex:none;display:flex;align-items:center;justify-content:center}
.li > .chev svg{width:18px;height:18px}
.amt.pos{color:var(--income)}.amt.neg{color:var(--expense)}
.prog{height:8px;border-radius:99px;background:var(--border);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary-l),var(--primary));transition:width .8s}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.pad0{padding:0}
.chip{padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--card);border:1px solid var(--border);color:var(--text-2);flex:none;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--primary-l),var(--primary));border-color:var(--primary);color:#fff}
.bottomnav{position:absolute;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--border-2);display:flex;z-index:40}
.bottomnav .nv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);position:relative;padding-top:2px;cursor:pointer}
.bottomnav .nv svg{width:21px;height:21px}
.bottomnav .nv span{font-size:9.5px;font-weight:600}
.bottomnav .nv.on{color:var(--primary)}
.bottomnav .nv.on::before{content:'';position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--primary-l),var(--primary))}
.subpage{position:absolute;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;animation:slideIn .26s cubic-bezier(.22,.9,.3,1)}
@keyframes slideIn{from{transform:translateX(28px);opacity:.3}to{transform:translateX(0);opacity:1}}
.subhd{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border-2);flex:none;position:sticky;top:0;z-index:5}
.subhd h1{font-size:16.5px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subbody{flex:1;overflow-y:auto;padding-bottom:34px}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:120;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(5px)}
.modal{background:var(--bg);width:100%;max-width:540px;border-radius:26px 26px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:slideUp .3s cubic-bezier(.22,.9,.3,1);box-shadow:0 -20px 60px rgba(0,0,0,.3)}
@keyframes slideUp{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
.modal-hd{padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border-2);flex:none}
.modal-hd h2{margin:0;font-size:16px;font-weight:700;flex:1}
.modal-body{flex:1;overflow-y:auto;padding:18px}
.modal-foot{padding:14px 18px;border-top:1px solid var(--border-2);flex:none;display:flex;gap:10px;background:var(--card)}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;height:46px;border-radius:13px;border:1.5px solid var(--border);background:var(--card);padding:0 13px;outline:none;transition:border-color .18s;font-size:14px}
.field textarea{height:auto;min-height:80px;padding:11px 13px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3.5px var(--primary-soft)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:16px;font-size:12.5px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:all .28s;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.success{background:linear-gradient(135deg,var(--income),#0E7A38);color:#fff}
.toast.error{background:linear-gradient(135deg,#E11D48,var(--danger));color:#fff}
.empty{padding:44px 24px;text-align:center;color:var(--text-3)}
.empty .eic{width:66px;height:66px;border-radius:22px;background:var(--card);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:var(--shadow)}
.empty .eic svg{width:28px;height:28px;color:var(--text-3)}
.empty h3{margin:0 0 5px;font-size:14px;color:var(--text-2);font-weight:600}
.empty p{margin:0;font-size:12px}
.login{padding:0 24px;display:flex;flex-direction:column;justify-content:center;min-height:100%;position:relative;overflow:hidden}
.login-bg{position:absolute;top:-160px;right:-130px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--primary-soft2),transparent 68%);opacity:.9}
.login-logo{width:90px;height:90px;border-radius:26px;overflow:hidden;background:#fff;padding:5px;margin:0 auto 18px;box-shadow:0 18px 38px -12px rgba(14,95,48,.6);animation:logo-float 4s ease-in-out infinite}
@keyframes logo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.login-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:21px}
.login-logo .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary-l),var(--primary));border-radius:21px;color:#fff}
.login-logo .fallback svg{width:44px;height:44px}
.login h1{font-size:22px;margin:0 0 6px;font-weight:700;text-align:center;background:linear-gradient(135deg,var(--primary),var(--primary-l));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login .tag{font-size:13.5px;color:var(--text-2);margin:0 0 30px;line-height:1.6;text-align:center}
.splash{position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,rgba(212,160,23,.28),transparent 45%),radial-gradient(circle at 15% 85%,rgba(196,30,58,.25),transparent 45%),linear-gradient(160deg,#0E5F30,#083A1C 60%,#041A0C);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:300;color:#fff}
.splash .logo-big{width:110px;height:110px;border-radius:30px;background:#fff;padding:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 24px 60px -18px rgba(0,0,0,.6)}
.splash .logo-big img{width:100%;height:100%;object-fit:contain;display:block;border-radius:24px}
.splash .logo-big .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary-l),var(--primary));border-radius:24px;color:#fff}
.splash .logo-big .fallback svg{width:56px;height:56px}
.splash h1{font-size:22px;margin:0;font-weight:700}
.splash p{margin:0;font-size:12.5px;opacity:.85}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.offline{background:var(--warn-soft);color:var(--warn);font-size:11.5px;font-weight:600;padding:7px 16px;display:flex;align-items:center;justify-content:center;gap:7px;flex:none}
.offline svg{width:14px;height:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp .4s cubic-bezier(.2,.8,.3,1) both}
.anim-d1{animation-delay:.05s}.anim-d2{animation-delay:.1s}.anim-d3{animation-delay:.15s}.anim-d4{animation-delay:.2s}.anim-d5{animation-delay:.25s}
.info-box{background:var(--info-soft);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--info);font-weight:500;line-height:1.6}
.warn-box{background:var(--warn-soft);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--warn);font-weight:500;line-height:1.6}
.hd-logo{width:46px;height:46px;border-radius:14px;background:#fff;padding:3px;flex:none;box-shadow:0 6px 14px -4px rgba(14,95,48,.35);border:1px solid var(--border-2);overflow:hidden}
.hd-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:11px}
.hd-logo .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary-l),var(--primary));border-radius:11px;color:#fff}
.hd-logo .fallback svg{width:22px;height:22px}
.event-hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 18px;background:radial-gradient(circle at 85% 15%,rgba(251,191,36,.35),transparent 45%),radial-gradient(circle at 10% 90%,rgba(196,30,58,.3),transparent 50%),linear-gradient(135deg,#B93A0E 0%,#EA580C 45%,#F59E0B 100%);color:#fff;box-shadow:0 20px 44px -16px rgba(234,88,12,.7),inset 0 1px 0 rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.22);cursor:pointer;transition:transform .15s}
.event-hero:active{transform:scale(.985)}
.event-hero::before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.13),transparent 70%);top:-130px;right:-80px;pointer-events:none}
.event-hero .eh-tag{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;background:rgba(255,255,255,.22);border-radius:99px;font-size:11px;font-weight:700;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28);position:relative;z-index:2}
.event-hero .eh-title{font-size:20px;font-weight:700;line-height:1.25;margin:12px 0 8px;letter-spacing:-.3px;position:relative;z-index:2}
.event-hero .eh-desc{font-size:12.5px;line-height:1.6;opacity:.94;margin:0 0 14px;position:relative;z-index:2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.event-hero .eh-meta{display:grid;grid-template-columns:1fr 1fr;gap:9px;position:relative;z-index:2}

function icon(n){return I[n]||''}

const state={
  user:null, member:null, tab:'home', theme:'light',
  stack:[], loading:true, myMonth:null, myYear:null
};
let DB={members:[],contributions:[],transactions:[],events:[],announcements:[],notifications:[],paymentRequests:[],userPosts:[],extraPayments:[]};

const $=s=>document.querySelector(s);
const pad2=n=>String(n).padStart(2,'0');
const fmtN=n=>Math.round(n).toLocaleString('en-IN');
const money=n=>'৳ '+fmtN(n);
function shortMoney(n){n=Math.abs(n);if(n>=1e7)return '৳'+(n/1e7).toFixed(2)+'কো';if(n>=1e5)return '৳'+(n/1e5).toFixed(2)+'লা';if(n>=1e3)return '৳'+(n/1e3).toFixed(1)+'হা';return '৳'+Math.round(n)}
const MN=m=>BN_MONTHS[m-1];
const MNS=m=>BN_MONTHS_SHORT[m-1];
function toISO(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function parseISO(s){if(!s)return new Date();const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function fmtDate(iso){if(!iso)return '—';try{const d=parseISO(iso);return d.getDate()+' '+MN(d.getMonth()+1)+' '+d.getFullYear()}catch(e){return iso}}
function fmtDateShort(iso){if(!iso)return '—';try{const d=parseISO(iso);return d.getDate()+' '+MN(d.getMonth()+1)}catch(e){return iso}}
function fmtDateTime(ts){if(!ts)return '—';const d=new Date(ts);let hr=d.getHours();const ampm=hr>=12?'PM':'AM';hr=hr%12||12;return d.getDate()+' '+MN(d.getMonth()+1)+' '+hr+':'+pad2(d.getMinutes())+' '+ampm}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function avatarHTML(m,size){
  size=size||46;
  const nm=m.name||m.nameEn||'?';
  const ini=nm.split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const color=m.color||'#0E5F30';
  return '<div class="avatar" style="--c:'+color+';width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*0.36)+'px">'+ini+'</div>';
}
function toast(msg,type){
  const t=$('#toast');t.textContent=msg;t.className='toast show'+(type?' '+type:'');
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2400);
}
function vibrate(ms){try{navigator.vibrate&&navigator.vibrate(ms||8)}catch(e){}}

const DATA={
  myContribs(){
    if(!state.member) return [];
    return DB.contributions.filter(c=>c.memberId===state.member.id);
  },
  mySummary(){
    const cs=this.myContribs();
    const expected=cs.reduce((a,b)=>a+(b.amount||0),0);
    const paid=cs.reduce((a,b)=>a+(b.paidAmount||0),0);
    return {expected,paid,due:expected-paid,percent:expected?Math.round(paid/expected*100):0};
  },
  totalFund(){
    let income=0,expense=0;
    DB.transactions.forEach(t=>{
      if(t.type==='contribution'||t.type==='donation'||t.type==='other_income'||t.type==='extra_payment') income+=t.amount||0;
      else expense+=t.amount||0;
    });
    return {income,expense,balance:income-expense};
  },
  upcomingEvents(){return DB.events.filter(e=>!e.isCompleted).sort((a,b)=>(a.date||'').localeCompare(b.date||''))},
  pastEvents(){return DB.events.filter(e=>e.isCompleted).sort((a,b)=>(b.date||'').localeCompare(a.date||''))},
  nextEvent(){const u=this.upcomingEvents();return u.length?u[0]:null},
  myNotifications(){
    if(!state.member) return [];
    return DB.notifications.filter(n=>n.userId===state.member.id||n.target==='all'||!n.userId).sort((a,b)=>(b.timestamp||b.createdAt||0)-(a.timestamp||a.createdAt||0));
  },
  unreadCount(){
    return this.myNotifications().filter(n=>!n.read).length;
  },
  myPendingRequests(){
    if(!state.member) return [];
    return DB.paymentRequests.filter(r=>r.memberId===state.member.id);
  }
};

function openModal(opts){
  const root=$('#modalRoot');
  const back=document.createElement('div');
  back.className='modal-back';
  back.innerHTML='<div class="modal"><div class="modal-hd"><button class="icon-btn" data-mclose="1" style="width:34px;height:34px">'+icon('x')+'</button><h2>'+opts.title+'</h2></div><div class="modal-body">'+opts.body+'</div>'+(opts.footer?'<div class="modal-foot">'+opts.footer+'</div>':'')+'</div>';
  root.appendChild(back);
  back.addEventListener('click',function(e){if(e.target===back||e.target.closest('[data-mclose]')) closeModal()});
  if(opts.onMount) opts.onMount(back);
  return back;
}
function closeModal(){const b=$('.modal-back');if(b)b.remove()}

/* ========= LOGIN ========= */
function viewLogin(){
  return '<div class="content" style="padding-bottom:0"><div class="login">'+
    '<div class="login-bg"></div>'+
    '<div class="login-logo">'+(LOGO_URL?'<img src="'+LOGO_URL+'" alt="DP" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<div class=&quot;fallback&quot;>'+icon('shield').replace(/"/g,'&quot;')+'</div>\'"/>':'<div class="fallback">'+icon('shield')+'</div>')+'</div>'+
    '<h1>দাড়িপাকা প্রবাসী কল্যাণ ফাউন্ডেশন</h1>'+
    '<p class="tag">DP সেবা — প্রবাসীর পাশে, সবসময়</p>'+
    '<div class="field"><label>মোবাইল নাম্বার</label><input id="loginPhone" type="tel" placeholder="01XXXXXXXXX"/></div>'+
    '<div class="field"><label>PIN (৪ ডিজিট)</label><input id="loginPin" type="password" inputmode="numeric" maxlength="6" placeholder="••••"/></div>'+
    '<button class="btn block mt6" data-act="login">লগইন করুন</button>'+
    '<div class="tiny muted mt14 center">সমস্যা হলে অ্যাডমিনের সাথে যোগাযোগ করুন</div>'+
  '</div></div>';
}
function normalizePhone(raw){
  if(!raw) return '';
  let s=String(raw).trim();
  const plus=s.startsWith('+');
  s=s.replace(/[^\d]/g,'');
  if(!s) return '';
  if(!plus && s.startsWith('0') && s.length===11) s='88'+s;
  return s;
}
async function doLogin(){
  const phone=($('#loginPhone')||{}).value||'';
  const pin=($('#loginPin')||{}).value||'';
  if(!phone||!pin){toast('মোবাইল ও PIN দিন','error');return}
  if(pin.length<4){toast('PIN কমপক্ষে ৪ ডিজিট','error');return}
  const phoneNorm=normalizePhone(phone);
  if(!phoneNorm){toast('সঠিক মোবাইল নাম্বার দিন','error');return}
  const email=phoneNorm+'@dpseba.local';
  try{
    toast('লগইন হচ্ছে...');
    await signInWithEmailAndPassword(auth,email,pin);
    // onAuthStateChanged নিজেই হ্যান্ডল করবে
  }catch(err){
    console.error('Login error:',err);
    let msg='লগইন ব্যর্থ';
    if(err.code==='auth/wrong-password'||err.code==='auth/invalid-credential') msg='PIN ভুল';
    else if(err.code==='auth/user-not-found') msg='এই নাম্বারে কোনো অ্যাকাউন্ট নেই';
    else if(err.code==='auth/too-many-requests') msg='অনেকবার চেষ্টা — একটু পরে';
    else msg='সমস্যা: '+err.message;
    toast(msg,'error');
  }
}

/* ========= RENDER ========= */
function render(){
  const app=$('#app');
  if(state.loading){
    app.innerHTML='<div class="splash"><div class="logo-big">'+(LOGO_URL?'<img src="'+LOGO_URL+'" alt="DP" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<div class=&quot;fallback&quot;>'+icon('shield').replace(/"/g,'&quot;')+'</div>\'"/>':'<div class="fallback">'+icon('shield')+'</div>')+'</div><h1>DP সেবা</h1><p>দাড়িপাকা প্রবাসী কল্যাণ ফাউন্ডেশন</p><div class="spin" style="margin-top:14px"></div></div>';
    return;
  }
  if(!state.user){app.innerHTML=viewLogin();return}
  if(!state.member){
    app.innerHTML='<div class="content" style="padding:24px"><div class="card" style="text-align:center;padding:32px 20px"><div style="font-size:48px">⏳</div><div class="bb mt14" style="font-size:17px">অ্যাকাউন্ট সেটআপ হয়নি</div><div class="sm muted mt10">আপনার নাম্বার '+(state.user.email||'')+' অ্যাডমিনের সাথে যোগাযোগ করুন।</div><button class="btn mt14" data-act="logout">লগআউট</button></div></div>';
    return;
  }
  let h='';
  if(!navigator.onLine) h+='<div class="offline">📶 অফলাইন মোড</div>';
  h+='<main class="content" id="content">'+renderTab()+'</main>';
  h+=renderBottomNav();
  h+=renderStack();
  app.innerHTML=h;
}
function renderTab(){
  switch(state.tab){
    case 'home':return viewHome();
    case 'members':return viewMembers();
    case 'accounts':return viewAccounts();
    case 'posts':return viewPosts();
    case 'profile':return viewProfile();
    default:return viewHome();
  }
}
function renderBottomNav(){
  const items=[
    {k:'home',ic:'home',bn:'হোম'},
    {k:'members',ic:'users',bn:'সদস্য'},
    {k:'accounts',ic:'wallet',bn:'আমার হিসাব'},
    {k:'posts',ic:'post',bn:'ফিড'},
    {k:'profile',ic:'user',bn:'প্রোফাইল'}
  ];
  return '<nav class="bottomnav">'+items.map(it=>'<button class="nv'+(state.tab===it.k?' on':'')+'" data-act="tab" data-tab="'+it.k+'">'+icon(it.ic)+'<span>'+it.bn+'</span></button>').join('')+'</nav>';
}
function renderStack(){
  if(!state.stack.length) return '';
  const p=state.stack[state.stack.length-1];
  let body='';
  switch(p.name){
    case 'member':body=pageMember(p.id);break;
    case 'eventDetail':body=pageEventDetail(p.id);break;
    case 'notifications':body=pageNotifications();break;
    case 'newPost':body=pageNewPost();break;
    case 'myPayment':body=pageMyPayment();break;
    default:body=subHeader('—')+'<div class="subbody"></div>';
  }
  return '<div class="subpage" id="subpage">'+body+'</div>';
}
function subHeader(title,right){return '<div class="subhd"><button class="icon-btn" data-act="back" style="width:34px;height:34px">'+icon('back')+'</button><h1>'+title+'</h1>'+(right||'')+'</div>'}
function chev(){return '<div class="chev">'+icon('chevron')+'</div>'}

/* ========= HOME ========= */
function viewHome(){
  const me=state.member;
  const fund=DATA.totalFund();

function pageMember(id){
  const m=DB.members.find(x=>x.id===id);
  if(!m) return subHeader('সদস্য')+'<div class="subbody"><div class="empty"><h3>পাওয়া যায়নি</h3></div></div>';
  const isMe=id===state.member.id;
  const cs=DB.contributions.filter(c=>c.memberId===id);
  const expected=cs.reduce((a,b)=>a+(b.amount||0),0);
  const paid=cs.reduce((a,b)=>a+(b.paidAmount||0),0);
  const due=expected-paid;
  const pct=expected?Math.round(paid/expected*100):0;
  const years=[].concat.apply([],cs.map(c=>[c.year])).filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>b-a);
  const y=years[0]||new Date().getFullYear();
  const yearCs=cs.filter(c=>c.year===y).sort((a,b)=>b.month-a.month);
  
  // ✅ উপরে ডান পাশে ছোট "মেসেজ করুন" বাটন
  const rightBtns = isMe 
    ? '<span class="pill active" style="font-size:10px">আপনি</span>'
    : '<button class="btn xs" data-act="message-member" data-id="'+esc(id)+'" style="padding:6px 11px;font-size:11.5px">'+icon('message')+' মেসেজ করুন</button>';
  
  let h=subHeader(m.name||'সদস্য',rightBtns);
  h+='<div class="subbody">';
  
  // Profile card
  h+='<div class="sec" style="margin-top:16px"><div class="card" style="text-align:center;padding:20px 16px">'+
      '<div style="display:flex;justify-content:center">'+avatarHTML(m,74)+'</div>'+
      '<div class="bb" style="font-size:18px;margin-top:12px">'+esc(m.name||'')+'</div>'+
      '<div class="sm muted" style="margin-top:3px">'+(m.id||'')+'</div>'+
    '</div></div>';
  
  // Stats
  h+='<div class="sec"><div class="stat-grid">'+
      '<div class="stat"><div class="ic" style="background:var(--primary-soft);color:var(--primary)">'+icon('wallet')+'</div><div class="k">প্রত্যাশিত</div><div class="v">৳ '+fmtN(expected)+'</div></div>'+
      '<div class="stat"><div class="ic" style="background:var(--income-soft);color:var(--income)">'+icon('check')+'</div><div class="k">পরিশোধিত</div><div class="v" style="color:var(--income)">৳ '+fmtN(paid)+'</div></div>'+
      '<div class="stat"><div class="ic" style="background:var(--expense-soft);color:var(--expense)">'+icon('minus')+'</div><div class="k">বাকি</div><div class="v" style="color:'+(due>0?'var(--expense)':'var(--text-3)')+'">৳ '+fmtN(Math.max(due,0))+'</div></div>'+
      '<div class="stat"><div class="ic" style="background:var(--info-soft);color:var(--info)">'+icon('trend')+'</div><div class="k">অগ্রগতি</div><div class="v">'+pct+'%</div></div>'+
    '</div><div class="prog mt14"><i style="width:'+pct+'%"></i></div></div>';
  
  // History
  h+='<div class="chips" style="margin-top:14px">'+years.map(yy=>'<button class="chip'+(yy===y?' on':'')+'" data-act="cyear-member" data-v="'+yy+'">'+yy+'</button>').join('')+'</div>';
  h+='<div class="sec" style="margin-top:14px"><div class="sec-hd"><h2>চাঁদার ইতিহাস</h2></div>';
  if(!yearCs.length){h+='<div class="empty"><div class="eic">'+icon('calendar')+'</div><h3>কোনো রেকর্ড নেই</h3></div>';}
  else{
    h+=yearCs.map(c=>{
      const st=c.status||'due';
      const label=st==='paid'?'পরিশোধিত':(st==='due'?'বাকি':'আংশিক');
      const color=st==='paid'?'var(--income)':(st==='due'?'var(--expense)':'var(--warn)');
      const bg=st==='paid'?'var(--income-soft)':(st==='due'?'var(--expense-soft)':'var(--warn-soft)');
      return '<div style="display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--card);border:1px solid var(--border-2);border-radius:14px;margin-bottom:7px;box-shadow:var(--shadow)"><div style="width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;background:'+bg+';color:'+color+'">'+(c.month||0)+'</div><div class="grow"><div style="font-size:13.5px;font-weight:600">'+MN(c.month||1)+' '+c.year+'</div><div class="tiny muted">প্রত্যাশিত ৳'+fmtN(c.amount||0)+' · পরিশোধিত ৳'+fmtN(c.paidAmount||0)+'</div></div><span class="pill '+st+'">'+label+'</span></div>';
    }).join('');
  }
  h+='</div></div>';
  return h;
}

/* ========= NAV ========= */
function pushPage(name,params){state.stack.push(Object.assign({name:name},params||{}));render()}
function popPage(){state.stack.pop();render()}
function switchTab(t){
  if(state.tab===t&&!state.stack.length){const c=$('#content');if(c)c.scrollTop=0;return}
  state.stack=[];state.tab=t;render();
  const c=$('#content');if(c)c.scrollTop=0;
}

document.addEventListener('click',function(ev){
  const el=ev.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act;
  vibrate(6);
  switch(act){
    case 'login':doLogin();break;
    case 'logout':{
      if(confirm('লগআউট করবেন?')){
        try{await signOut(auth)}catch(e){}
      }
      break;
    }
    case 'tab':switchTab(el.dataset.tab);break;
    case 'page':pushPage(el.dataset.page);break;
    case 'back':popPage();break;
    case 'member':pushPage('member',{id:el.dataset.id});break;
    case 'page-event':pushPage('eventDetail',{id:el.dataset.id});break;
    case 'tab-events':{
      // সব ইভেন্ট আসলে হোমে দেখানো হয়, তাই হোমে থাকা ইভেন্ট সেকশনে scroll
      const list=DATA.pastEvents();
      if(list.length===0){toast('কোনো পূর্ববর্তী ইভেন্ট নেই')}
      else{pushPage('eventDetail',{id:list[0].id})}
      break;
    }
    case 'message-member':openMessageModal(el.dataset.id);break;
    case 'quick-post':doQuickPost();break;
    case 'delete-my-post':deleteMyPost(el.dataset.id);break;
    case 'send-payment-request':openPaymentRequestModal();break;
    case 'copy-number':{
      const num=el.dataset.num;
      try{
        navigator.clipboard.writeText(num).then(()=>toast('✅ নাম্বার কপি হয়েছে','success'));
      }catch(e){
        toast('নাম্বার: '+num);
      }
      break;
    }
    case 'theme-toggle':{
      state.theme=state.theme==='dark'?'light':'dark';
      document.documentElement.dataset.theme=state.theme;
      try{localStorage.setItem('dp_theme',state.theme)}catch(e){}
      render();
      break;
    }
    case 'read-notif':{
      const id=el.dataset.id;
      const n=DB.notifications.find(x=>x.id===id);
      if(n&&!n.read){
        updateDoc(doc(db,'notifications',id),{read:true}).catch(e=>console.warn(e));
      }
      break;
    }
  }
});

onAuthStateChanged(auth,async (user)=>{
  console.log('🔐 Auth state:', user?('logged in: '+user.uid):'logged out');
  
  if(!user){
    state.user=null;
    state.member=null;
    state.loading=false;
    render();
    return;
  }
  
  state.user=user;
  
  try{
    // প্রথমে UID দিয়ে খোঁজা
    let memberSnap=await getDoc(doc(db,'members',user.uid));
    let member=null;
    
    if(memberSnap.exists()){
      member={...memberSnap.data(),_docId:memberSnap.id,id:memberSnap.data().id||memberSnap.id};
      console.log('✅ Member found by UID:',member.id);
    } else {
      // ফোন নাম্বার দিয়ে খোঁজা
      let phoneNorm='';
      if(user.email){phoneNorm=user.email.split('@')[0]}
      if(phoneNorm){
        const q=query(collection(db,'members'),where('phoneNorm','==',phoneNorm),limit(1));
        const snap=await getDocs(q);
        if(!snap.empty){
          member={...snap.docs[0].data(),_docId:snap.docs[0].id,id:snap.docs[0].data().id||snap.docs[0].id};
          console.log('✅ Member found by phone:',member.id);
        }
      }
    }
    
    if(!member){
      console.warn('⚠️ Member not found for user:',user.uid);
      state.member=null;
      state.loading=false;
      render();
      return;
    }
    
    // অ্যাকাউন্ট সেটআপ চিহ্নিত করা (প্রথমবার লগইন হলে)
    if(!member.accountSetup){
      try{
        await updateDoc(doc(db,'members',member._docId),{accountSetup:true,updatedAt:Date.now()});
        member.accountSetup=true;
      }catch(e){console.warn('setup flag fail',e)}
    }
    
    state.member=member;
    
    // ডেটা লোড
    await loadAllData();
    setupListeners();
    
    state.loading=false;
    render();
    toast('স্বাগতম, '+(member.name||''),'success');
    
  }catch(err){
    console.error('❌ Auth error:',err);
    // ⚠️ এখানে signOut করবেন না!
    state.loading=false;
    render();
    toast('ডেটা লোড ব্যর্থ: '+err.message,'error');
  }
});

async function loadAllData(){
  try{
    const [mem,con,tx,eve,ann,not,pre,upo,ext]=await Promise.all([
      getDocs(collection(db,'members')),
      getDocs(collection(db,'contributions')),
      getDocs(collection(db,'transactions')),
      getDocs(collection(db,'events')),
      getDocs(collection(db,'announcements')),
      getDocs(collection(db,'notifications')),
      getDocs(collection(db,'paymentRequests')),
      getDocs(collection(db,'userPosts')),
      getDocs(collection(db,'extraPayments'))
    ]);
    DB.members=mem.docs.map(d=>({...d.data(),_docId:d.id}));
    DB.contributions=con.docs.map(d=>({...d.data(),id:d.id}));
    DB.transactions=tx.docs.map(d=>({...d.data(),id:d.id}));
    DB.events=eve.docs.map(d=>({...d.data(),id:d.id}));
    DB.announcements=ann.docs.map(d=>({...d.data(),id:d.id}));
    DB.notifications=not.docs.map(d=>({...d.data(),id:d.id}));
    DB.paymentRequests=pre.docs.map(d=>({...d.data(),id:d.id}));
    DB.userPosts=upo.docs.map(d=>({...d.data(),id:d.id}));
    DB.extraPayments=ext.docs.map(d=>({...d.data(),id:d.id}));
  }catch(err){
    console.error('loadAllData error:',err);
    throw err;
  }
}
