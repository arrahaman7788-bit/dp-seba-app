<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0E5F30"/>
<title>DP সেবা অ্যাডমিন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#0E5F30;--primary-d:#083A1C;--primary-l:#1B8044;--primary-soft:#E5F2EA;--primary-soft2:#CDE6D9;--accent:#C41E3A;--accent-soft:#FCE7EC;--gold:#D4A017;--gold-soft:#FBF3DC;--income:#16A34A;--income-soft:#E6F7EE;--expense:#DC2626;--expense-soft:#FDE8ED;--donation:#C41E3A;--donation-soft:#FCE7EC;--event:#EA580C;--event-soft:#FEF0E7;--warn:#D97706;--warn-soft:#FEF3C7;--info:#0284C7;--info-soft:#E0F2FE;--danger:#B91C1C;--danger-soft:#FEE2E2;--bg:#F0F5F2;--bg-2:#E1EBE6;--card:#FFFFFF;--card-2:#F6FAF8;--text:#0A1A12;--text-2:#4E5F55;--text-3:#8B9A92;--border:#DCE7E1;--border-2:#E9F2ED;--shadow:0 4px 16px rgba(14,95,48,.07);--radius:20px;--nav-h:70px}
[data-theme="dark"]{--primary:#22A155;--primary-d:#0E5F30;--primary-l:#3DC76F;--primary-soft:#0A2A18;--primary-soft2:#123A22;--accent:#FF4D6D;--accent-soft:#3A0F1A;--gold:#FBBF24;--gold-soft:#3A2E10;--income:#2ECC71;--income-soft:#12301F;--expense:#FF5C7A;--expense-soft:#3A1520;--donation:#FF4D6D;--donation-soft:#3A0F1A;--event:#FB923C;--event-soft:#3A2110;--warn:#FBBF24;--warn-soft:#3A2E10;--info:#38BDF8;--info-soft:#0C2A3A;--danger:#F87171;--danger-soft:#3A1010;--bg:#06100B;--bg-2:#030806;--card:#0F1A15;--card-2:#15241D;--text:#E8F5EE;--text-2:#95B3A5;--text-3:#627A70;--border:#1C2E24;--border-2:#15241C;--shadow:0 4px 16px rgba(0,0,0,.35)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:'Hind Siliguri',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-2);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:0;height:0}
#app{position:relative;max-width:540px;margin:0 auto;height:100dvh;height:100vh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 90px rgba(0,0,0,.12)}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + 26px)}
.hd{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd h1{font-size:20px;font-weight:700;margin:0}
.hd .sub{font-size:12px;color:var(--text-2);margin-top:2px}
.sec{padding:0 18px;margin-top:18px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-hd h2{font-size:15px;font-weight:700;margin:0}
.sec-hd .link{font-size:12px;color:var(--primary);font-weight:600;cursor:pointer}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border-2);padding:16px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--text-2)}.tiny{font-size:11px}.sm{font-size:12px}
.b{font-weight:600}.bb{font-weight:700}.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{text-align:center}.gap6{gap:6px}.gap10{gap:10px}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 65%,#000));color:#fff;font-weight:700;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:10.5px;font-weight:600;line-height:1.6}
.pill.paid,.pill.active,.pill.approved,.pill.upcoming{background:var(--income-soft);color:var(--income)}
.pill.due,.pill.suspended,.pill.rejected{background:var(--expense-soft);color:var(--expense)}
.pill.partial,.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.na,.pill.inactive,.pill.past{background:var(--border);color:var(--text-3)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.extra{background:var(--accent-soft);color:var(--accent)}
.pill.urgent{background:var(--danger-soft);color:var(--danger)}
.pill.important{background:var(--warn-soft);color:var(--warn)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.event{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;color:#fff;transition:transform .12s;background:linear-gradient(135deg,var(--primary-l),var(--primary));box-shadow:0 8px 20px -8px rgba(14,95,48,.7)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--border);box-shadow:none}
.btn.soft{background:var(--primary-soft);color:var(--primary);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#E11D48,#B91C1C)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#B58414)}
.btn.small{padding:8px 14px;font-size:12.5px;border-radius:11px}
.btn.block{width:100%}
.icon-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border-2);color:var(--text-2);transition:transform .12s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px}
.balance-card{position:relative;overflow:hidden;border-radius:26px;padding:18px 20px 20px;background:radial-gradient(circle at 90% 10%,rgba(212,160,23,.35),transparent 40%),radial-gradient(circle at 10% 90%,rgba(196,30,58,.28),transparent 45%),linear-gradient(135deg,#0A4A24 0%,#0E5F30 45%,#1B8044 100%);color:#fff;box-shadow:0 22px 46px -18px rgba(14,95,48,.85),0 8px 18px -8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.18)}
[data-theme="dark"] .balance-card{background:radial-gradient(circle at 90% 10%,rgba(251,191,36,.28),transparent 40%),radial-gradient(circle at 10% 90%,rgba(255,77,109,.25),transparent 45%),linear-gradient(135deg,#041A0C 0%,#0E5F30 45%,#167A3A 100%)}
.balance-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);pointer-events:none;animation:bc-shine 8s ease-in-out infinite}
@keyframes bc-shine{0%,100%{transform:translateX(-60%) translateY(-60%)}50%{transform:translateX(-40%) translateY(-40%)}}
.balance-card::after{content:'';position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.09),transparent 70%);top:-120px;right:-70px;pointer-events:none}
.bc-header{display:flex;align-items:center;gap:12px;position:relative;z-index:2;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.15)}
.bc-logo{width:52px;height:52px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;padding:4px;flex:none;box-shadow:0 6px 14px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.9);overflow:hidden}
.bc-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:11px}
.bc-logo .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary-l),var(--primary));border-radius:11px;color:#fff}
.bc-logo .fallback svg{width:26px;height:26px}
.bc-org{flex:1;min-width:0}
.bc-org-name{font-size:14.5px;font-weight:700;line-height:1.2;letter-spacing:-.2px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.bc-org-sub{font-size:10.5px;opacity:.82;margin-top:2px;font-weight:500}
.bc-label{font-size:12px;opacity:.86;letter-spacing:.4px;font-weight:500;margin-top:14px}
.bc-amount{font-size:33px;font-weight:700;letter-spacing:-1px;margin-top:4px;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.bc-sub{font-size:11px;opacity:.72;margin-top:4px}
.bc-stats{display:flex;gap:10px;margin-top:16px;position:relative;z-index:2}
.bc-stat{flex:1;background:rgba(255,255,255,.13);border-radius:14px;padding:10px 11px;border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.bc-stat .k{font-size:10px;opacity:.9}.bc-stat .v{font-size:14.5px;font-weight:700;margin-top:3px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.stat{background:linear-gradient(135deg,var(--card) 0%,var(--card-2) 100%);border:1px solid var(--border-2);border-radius:18px;padding:13px;box-shadow:var(--shadow);transition:transform .13s}
.stat.clickable{cursor:pointer}
.stat.clickable:active{transform:scale(.97)}
.stat .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.stat .ic svg{width:16px;height:16px}
.stat .k{font-size:10.5px;color:var(--text-2);font-weight:500;line-height:1.3;display:flex;align-items:center;gap:4px}
.stat .k .edit-hint{color:var(--primary);font-weight:700}
.stat .v{font-size:16px;font-weight:700;margin-top:3px}
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.qa{background:linear-gradient(135deg,var(--card) 0%,var(--card-2) 100%);border:1px solid var(--border-2);border-radius:18px;padding:13px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:var(--shadow);transition:transform .13s}
.qa:active{transform:scale(.94)}
.qa .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.qa .ic svg{width:18px;height:18px}
.qa span{font-size:10px;font-weight:600;color:var(--text-2);text-align:center;line-height:1.25}
.list{background:var(--card);border:1px solid var(--border-2);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 15px;transition:background .15s}
.li:active{background:var(--card-2)}
.li+.li{border-top:1px solid var(--border-2)}
.li .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.li .ic svg{width:17px;height:17px}
.li .t{font-size:13.5px;font-weight:600;line-height:1.35}
.li .s{font-size:11px;color:var(--text-3);margin-top:2px}
.li .amt{font-size:14px;font-weight:700;white-space:nowrap}
.li > .chev{width:20px;height:20px;color:var(--text-3);flex:none;display:flex;align-items:center;justify-content:center}
.li > .chev svg{width:18px;height:18px}
.amt.pos{color:var(--income)}.amt.neg{color:var(--expense)}
.prog{height:8px;border-radius:99px;background:var(--border);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary-l),var(--primary));box-shadow:0 0 12px rgba(14,95,48,.5);transition:width .8s}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.pad0{padding:0}
.chip{padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--card);border:1px solid var(--border);color:var(--text-2);flex:none}
.chip.on{background:linear-gradient(135deg,var(--primary-l),var(--primary));border-color:var(--primary);color:#fff}
.seg{display:flex;background:var(--border-2);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-size:12px;font-weight:600;color:var(--text-2);transition:all .18s}
.seg button.on{background:var(--card);color:var(--primary);box-shadow:0 3px 8px rgba(0,0,0,.08)}
.searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 13px;height:46px;box-shadow:var(--shadow)}
.searchbar svg{width:17px;height:17px;color:var(--text-3);flex:none}
.searchbar input{flex:1;border:none;outline:none;background:none;font-size:13.5px;height:100%}
.bottomnav{position:absolute;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--border-2);display:flex;z-index:40}
.bottomnav .nv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);position:relative;padding-top:2px}
.bottomnav .nv svg{width:21px;height:21px}
.bottomnav .nv span{font-size:9.5px;font-weight:600}
.bottomnav .nv.on{color:var(--primary)}
.bottomnav .nv.on::before{content:'';position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--primary-l),var(--primary))}
.subpage{position:absolute;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;animation:slideIn .26s cubic-bezier(.22,.9,.3,1)}
@keyframes slideIn{from{transform:translateX(28px);opacity:.3}to{transform:translateX(0);opacity:1}}
.subhd{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border-2);flex:none;position:sticky;top:0;z-index:5}
.subhd h1{font-size:16.5px;font-weight:700;margin:0;flex:1}
.subbody{flex:1;overflow-y:auto;padding-bottom:34px}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:120;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(5px)}
.modal{background:var(--bg);width:100%;max-width:540px;border-radius:26px 26px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:slideUp .3s cubic-bezier(.22,.9,.3,1);box-shadow:0 -20px 60px rgba(0,0,0,.3)}
@keyframes slideUp{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
.modal-hd{padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border-2);flex:none}
.modal-hd h2{margin:0;font-size:16px;font-weight:700;flex:1}
.modal-body{flex:1;overflow-y:auto;padding:18px}
.modal-foot{padding:14px 18px;border-top:1px solid var(--border-2);flex:none;display:flex;gap:10px;background:var(--card)}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;height:46px;border-radius:13px;border:1.5px solid var(--border);background:var(--card);padding:0 13px;outline:none;transition:border-color .18s;font-size:14px}
.field textarea{height:auto;min-height:80px;padding:11px 13px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3.5px var(--primary-soft)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:16px;font-size:12.5px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:all .28s;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.success{background:linear-gradient(135deg,var(--income),#0E7A38);color:#fff}
.toast.error{background:linear-gradient(135deg,#E11D48,var(--danger));color:#fff}
.empty{padding:44px 24px;text-align:center;color:var(--text-3)}
.empty .eic{width:66px;height:66px;border-radius:22px;background:var(--card);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:var(--shadow)}
.empty .eic svg{width:28px;height:28px;color:var(--text-3)}
.empty h3{margin:0 0 5px;font-size:14px;color:var(--text-2);font-weight:600}
.empty p{margin:0;font-size:12px}
.login{padding:0 24px;display:flex;flex-direction:column;justify-content:center;min-height:100%;position:relative;overflow:hidden}
.login-bg{position:absolute;top:-160px;right:-130px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--primary-soft2),transparent 68%);opacity:.9}
.login-logo{width:90px;height:90px;border-radius:26px;overflow:hidden;background:#fff;padding:5px;margin:0 auto 18px;box-shadow:0 18px 38px -12px rgba(14,95,48,.6);animation:logo-float 4s ease-in-out infinite}
@keyframes logo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.login-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:21px}
.login-logo .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary-l),var(--primary));border-radius:21px;color:#fff}
.login-logo .fallback svg{width:44px;height:44px}
.login h1{font-size:22px;margin:0 0 6px;font-weight:700;text-align:center;background:linear-gradient(135deg,var(--primary),var(--primary-l));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login .tag{font-size:13.5px;color:var(--text-2);margin:0 0 30px;line-height:1.6;text-align:center}
.divider{display:flex;align-items:center;gap:12px;color:var(--text-3);font-size:11px;margin:16px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;height:52px;border-radius:16px;background:var(--card);border:1.5px solid var(--border);font-weight:600;font-size:14px;box-shadow:var(--shadow);transition:transform .13s}
.gbtn:active{transform:scale(.975)}
.gbtn svg{width:19px;height:19px}
.splash{position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,rgba(212,160,23,.28),transparent 45%),radial-gradient(circle at 15% 85%,rgba(196,30,58,.25),transparent 45%),linear-gradient(160deg,#0E5F30,#083A1C 60%,#041A0C);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:300;color:#fff}
.splash .logo-big{width:110px;height:110px;border-radius:30px;background:#fff;padding:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 24px 60px -18px rgba(0,0,0,.6);animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
.splash .logo-big img{width:100%;height:100%;object-fit:contain;display:block;border-radius:24px}
.splash .logo-big .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary-l),var(--primary));border-radius:24px;color:#fff}
.splash .logo-big .fallback svg{width:56px;height:56px}
.splash h1{font-size:22px;margin:0;font-weight:700}
.splash p{margin:0;font-size:12.5px;opacity:.85}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.offline{background:var(--warn-soft);color:var(--warn);font-size:11.5px;font-weight:600;padding:7px 16px;display:flex;align-items:center;justify-content:center;gap:7px;flex:none}
.offline svg{width:14px;height:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp .4s cubic-bezier(.2,.8,.3,1) both}
.anim-d1{animation-delay:.05s}.anim-d2{animation-delay:.1s}.anim-d3{animation-delay:.15s}.anim-d4{animation-delay:.2s}.anim-d5{animation-delay:.25s}
.warn-box{background:var(--warn-soft);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--warn);font-weight:500;line-height:1.6}
.info-box{background:var(--info-soft);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--info);font-weight:500;line-height:1.6}
.danger-box{background:var(--danger-soft);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--danger);font-weight:500;line-height:1.6}
.gold-box{background:var(--gold-soft);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--gold);font-weight:600;line-height:1.6;border:1.5px dashed var(--gold)}
.month-edit-list{max-height:340px;overflow-y:auto;padding-right:4px;margin-bottom:10px}
.month-edit-row{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:10px;margin-bottom:8px}
.month-edit-row .mlbl{font-weight:600;font-size:13px}
.month-edit-row.disabled .mlbl{color:var(--text-3)}
.month-edit-row input{height:42px;padding:0 12px;border-radius:11px;border:1.5px solid var(--border);background:var(--card);font-size:14px;width:100%;color:var(--text);outline:none}
.month-edit-row input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.month-edit-row input:disabled{background:var(--card-2);color:var(--text-3)}
.hd-logo{width:46px;height:46px;border-radius:14px;background:#fff;padding:3px;flex:none;box-shadow:0 6px 14px -4px rgba(14,95,48,.35);border:1px solid var(--border-2);overflow:hidden}
.hd-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:11px}
.hd-logo .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary-l),var(--primary));border-radius:11px;color:#fff}
.hd-logo .fallback svg{width:22px;height:22px}
.event-hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 18px;background:radial-gradient(circle at 85% 15%,rgba(251,191,36,.35),transparent 45%),radial-gradient(circle at 10% 90%,rgba(196,30,58,.3),transparent 50%),linear-gradient(135deg,#B93A0E 0%,#EA580C 45%,#F59E0B 100%);color:#fff;box-shadow:0 20px 44px -16px rgba(234,88,12,.7),inset 0 1px 0 rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.22);cursor:pointer;transition:transform .15s}
.event-hero:active{transform:scale(.985)}
.event-hero::before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.13),transparent 70%);top:-130px;right:-80px;pointer-events:none}
.event-hero::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);bottom:-100px;left:-60px;pointer-events:none}
.event-hero .eh-tag{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;background:rgba(255,255,255,.22);border-radius:99px;font-size:11px;font-weight:700;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28);position:relative;z-index:2}
.event-hero .eh-title{font-size:20px;font-weight:700;line-height:1.25;margin:12px 0 8px;letter-spacing:-.3px;text-shadow:0 2px 6px rgba(0,0,0,.28);position:relative;z-index:2}
.event-hero .eh-desc{font-size:12.5px;line-height:1.6;opacity:.94;margin:0 0 14px;position:relative;z-index:2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.event-hero .eh-meta{display:grid;grid-template-columns:1fr 1fr;gap:9px;position:relative;z-index:2}
.event-hero .eh-cell{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(10px)}
.event-hero .eh-cell .k{font-size:10px;opacity:.92;font-weight:500;letter-spacing:.3px}
.event-hero .eh-cell .v{font-size:14.5px;font-weight:700;margin-top:3px}
.past-grid{display:grid;grid-template-columns:1fr;gap:9px}
.past-card{background:var(--card);border-radius:16px;padding:12px 14px;border:1px solid var(--border-2);box-shadow:var(--shadow);cursor:pointer;transition:transform .13s;display:flex;align-items:center;gap:12px;border-left:4px solid var(--text-3)}
.past-card:active{transform:scale(.98)}
.past-card .pc-date{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#6B7280,#4B5563);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.past-card .pc-date .d{font-size:16px;font-weight:800}
.past-card .pc-date .m{font-size:9px;opacity:.9;margin-top:2px;font-weight:600}
.past-card .pc-body{flex:1;min-width:0}
.past-card .pc-title{font-size:13.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.past-card .pc-sub{font-size:11px;color:var(--text-3);margin-top:3px}
.post-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border:1px solid var(--border-2);margin-bottom:10px}
.post-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.post-body{font-size:13.5px;line-height:1.6;color:var(--text);white-space:pre-wrap}
.post-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:10px;border-top:1px solid var(--border-2)}
.post-time{font-size:10.5px;color:var(--text-3)}

function toISO(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function parseISO(s){if(!s)return new Date();const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function fmtDate(iso){if(!iso)return '—';try{const d=parseISO(iso);return d.getDate()+' '+MN(d.getMonth()+1)+' '+d.getFullYear()}catch(e){return iso}}
function fmtDateShort(iso){if(!iso)return '—';try{const d=parseISO(iso);return d.getDate()+' '+MN(d.getMonth()+1)}catch(e){return iso}}
function fmtDateTime(ts){if(!ts)return '—';const d=new Date(ts);let hr=d.getHours();const ampm=hr>=12?'PM':'AM';hr=hr%12||12;return d.getDate()+' '+MN(d.getMonth()+1)+' '+hr+':'+pad2(d.getMinutes())+' '+ampm}
function avatarHTML(m,size){
  size=size||46;

  return '<div class="avatar" style="--c:'+color+';width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*0.36)+'px">'+ini+'</div>';

function normalizePhone(raw){
  if(!raw) return '';
  let s = String(raw).trim();
  const plus = s.startsWith('+');
  s = s.replace(/[^\d]/g, '');
  if(!s) return '';
  if(!plus && s.startsWith('0') && s.length === 11) s = '88' + s;
  return s;
}

const DATA={
  stats(){
    let income=0,expense=0,contrib=0,extra=0,donation=0,eventExp=0,otherExp=0,otherInc=0;
    DB.transactions.forEach(t=>{
      if(t.type==='contribution'){contrib+=t.amount;income+=t.amount}
      else if(t.type==='extra_payment'){extra+=t.amount;income+=t.amount}
      else if(t.type==='donation'){donation+=t.amount;income+=t.amount}
      else if(t.type==='other_income'){otherInc+=t.amount;income+=t.amount}
      else if(t.type==='event_expense'){eventExp+=t.amount;expense+=t.amount}
      else if(t.type==='other_expense'){otherExp+=t.amount;expense+=t.amount}
    });
    return {income,expense,balance:income-expense,contrib,extra,donation,eventExp,otherExp,otherInc};
  },
  monthStats(y,m){
    let collected=0,spent=0;
    DB.transactions.forEach(t=>{
      const d=parseISO(t.date);
      if(d.getFullYear()===y&&d.getMonth()+1===m){
        if(INCOME_TYPES.indexOf(t.type)>=0) collected+=t.amount;
        else spent+=t.amount;
      }
    });
    return {collected,spent};
  },
  memberContribs(id){return DB.contributions.filter(c=>c.memberId===id)},
  memberExtras(id){return DB.extraPayments.filter(x=>x.memberId===id)},
  memberSummary(id){
    const cs=this.memberContribs(id);
    const expected=cs.reduce((a,b)=>a+(b.amount||0),0);
    const paid=cs.reduce((a,b)=>a+(b.paidAmount||0),0);
    const extraTotal=this.memberExtras(id).reduce((a,b)=>a+(b.amount||0),0);
    return {expected,paid,due:expected-paid,percent:expected?Math.round(paid/expected*100):0,count:cs.length,extraTotal};
  },
  totalDue(){let due=0;DB.members.forEach(m=>{const s=this.memberSummary(m.id);if(s.due>0)due+=s.due});return due},
  totalExtra(){return DB.extraPayments.reduce((a,b)=>a+(b.amount||0),0)},
  nextMemberId(){
    let max=0;
    DB.members.forEach(m=>{const n=parseInt(String(m.id||'').replace(/\D/g,''),10)||0;if(n>max)max=n});
    return 'DP-'+String(max+1).padStart(3,'0');
  },
  upcomingEvents(){return DB.events.filter(e=>!e.isCompleted).sort((a,b)=>(a.date||'').localeCompare(b.date||''))},
  pastEvents(){return DB.events.filter(e=>e.isCompleted).sort((a,b)=>(b.date||'').localeCompare(a.date||''))},
  nextEvent(){const u=this.upcomingEvents();return u.length?u[0]:null},
  recentPastEvents(n){return this.pastEvents().slice(0,n||3)},
  pendingPayments(){return DB.paymentRequests.filter(r=>r.status==='pending')}
};

function viewContributions(){
  const now=new Date();const cy=now.getFullYear(),cm=now.getMonth()+1;
  const y=state.contribYear||cy;const m=state.contribMonth||cm;

  DB.contributions.forEach(c=>{if(c.year===y&&c.month===m){expected+=c.amount||0;collected+=c.paidAmount||0}});
  const due=expected-collected;
  const pct=expected?Math.round(collected/expected*100):0;
  const rows=DB.contributions.filter(c=>c.year===y&&c.month===m).map(c=>({c,mem:DB.members.find(x=>x.id===c.memberId)})).filter(x=>x.mem).sort((a,b)=>String(a.c.memberId).localeCompare(String(b.c.memberId)));

  const years=[];for(let yy=cy-2;yy<=cy+1;yy++) years.push(yy);
  h+='<div class="chips anim anim-d1" style="margin-top:6px">'+years.map(yy=>'<button class="chip'+(yy===y?' on':'')+'" data-act="cyear" data-v="'+yy+'">'+yy+'</button>').join('')+'</div>';
  h+='<div class="chips anim anim-d2" style="margin-top:8px">'+BN_MONTHS.map((nm,i)=>{const mm=i+1;let mExp=0,mPaid=0;DB.contributions.forEach(c=>{if(c.year===y&&c.month===mm){mExp+=c.amount||0;mPaid+=c.paidAmount||0}});const full=mExp>0&&mPaid>=mExp;return '<button class="chip'+(mm===m?' on':'')+'" data-act="cmonth" data-v="'+mm+'" style="'+(full?'border-color:var(--income)':'')+'">'+MNS(mm)+(full?' ✓':'')+'</button>';}).join('')+'</div>';
  h+='<div class="sec anim anim-d3" style="margin-top:14px"><div class="stat-grid"><div class="stat"><div class="ic" style="background:var(--primary-soft);color:var(--primary)">'+icon('wallet')+'</div><div class="k">প্রত্যাশিত</div><div class="v">'+money(expected)+'</div></div><div class="stat"><div class="ic" style="background:var(--income-soft);color:var(--income)">'+icon('check')+'</div><div class="k">সংগৃহীত</div><div class="v" style="color:var(--income)">'+money(collected)+'</div></div><div class="stat"><div class="ic" style="background:var(--expense-soft);color:var(--expense)">'+icon('minus')+'</div><div class="k">বাকি</div><div class="v" style="color:var(--expense)">'+money(due)+'</div></div><div class="stat"><div class="ic" style="background:var(--info-soft);color:var(--info)">'+icon('trend')+'</div><div class="k">সংগ্রহ</div><div class="v">'+pct+'%</div></div></div><div class="prog mt14"><i style="width:'+pct+'%"></i></div></div>';
  h+='<div class="sec anim anim-d4"><div class="sec-hd"><h2>'+MN(m)+' '+y+'</h2><span class="tiny muted">'+rows.length+' জন</span></div>';
  if(!rows.length){h+='<div class="empty"><div class="eic">'+icon('wallet')+'</div><h3>এই মাসে কোনো রেকর্ড নেই</h3></div>';}
  else{
    h+='<div class="list">'+rows.map(x=>{const st=x.c.status||'due';const label=st==='paid'?'পরিশোধিত':(st==='due'?'বাকি':'আংশিক');return '<div class="li" data-act="edit-contribution" data-id="'+(x.c.id||'')+'">'+avatarHTML(x.mem,38)+'<div class="grow"><div class="t ell">'+mname(x.mem)+'</div><div class="s">'+(x.mem.id||'')+' · প্রত্যাশিত '+money(x.c.amount||0)+'</div></div><div style="text-align:right;flex:none"><div class="amt '+(st==='paid'?'pos':'neg')+'">'+money(x.c.paidAmount||0)+'</div><span class="pill '+st+'" style="margin-top:3px">'+label+'</span></div></div>';}).join('')+'</div>';
  }

async function saveEvent(eventId){
  const isEdit=!!eventId;
  const container=document.getElementById('eventForm');
  const id=eventId || (container && container.getAttribute('data-id'));
  const title=(document.getElementById('evTitle')||{}).value.trim();
  const desc=(document.getElementById('evDesc')||{}).value.trim();
  const date=(document.getElementById('evDate')||{}).value;
  const deadline=(document.getElementById('evDeadline')||{}).value;
  const fee=parseInt((document.getElementById('evFee')||{}).value)||0;
  const location=(document.getElementById('evLocation')||{}).value.trim();
  const status=(document.getElementById('evStatus')||{}).value;
  if(!title){toast('শিরোনাম দিন','error');return}
  if(!date){toast('তারিখ দিন','error');return}
  const data={title,description:desc,date,deadline:deadline||null,fee,location,isCompleted:status==='past',updatedAt:Date.now()};
  try{
    if(isEdit){await updateDoc(doc(db,'events',id),data);audit('event_edit',id,title,'','');toast('ইভেন্ট হালনাগাদ হয়েছে','success');}
    else{const newId='EV-'+Date.now();data.createdBy=state.admin.name;data.createdAt=Date.now();await setDoc(doc(db,'events',newId),data);audit('event_add',newId,title,'','');toast('নতুন ইভেন্ট তৈরি হয়েছে','success');}
    popPage();
  }catch(err){console.error(err);toast('Error: '+err.message,'error');}
}

  const all=DB.paymentRequests.slice().sort((a,b)=>(b.ts||0)-(a.ts||0));

  const approved=all.filter(r=>r.status==='approved');

  const totalPending=pending.reduce((a,b)=>a+(b.amount||0),0);

  h+='<div class="subbody">';
  h+='<div class="sec" style="margin-top:16px"><div class="stat-grid cols-3"><div class="stat"><div class="k">অপেক্ষমাণ</div><div class="v" style="color:var(--warn)">'+pending.length+'</div></div><div class="stat"><div class="k">অনুমোদিত</div><div class="v" style="color:var(--income)">'+approved.length+'</div></div><div class="stat"><div class="k">বাতিল</div><div class="v" style="color:var(--expense)">'+rejected.length+'</div></div></div>';
  if(pending.length>0){h+='<div class="card mt10" style="background:linear-gradient(135deg,var(--gold-soft),var(--warn-soft));border:none"><div class="tiny muted">অপেক্ষমাণ মোট</div><div class="bb" style="font-size:22px;color:var(--gold);margin-top:3px">'+money2(totalPending)+'</div></div>';}
  h+='</div>';
  if(pending.length>0){
    h+='<div class="sec"><div class="sec-hd"><h2>⏳ অপেক্ষমাণ</h2><span class="pill important">'+pending.length+'</span></div>';
    h+=pending.map(r=>{
      const typeLabel = r.type==='event' ? ('🎉 '+(r.eventTitle||'ইভেন্ট')) : (r.forMonth?('💰 '+MN(r.forMonth)+' '+r.forYear):'💰 মাসিক');
      return '<div class="card" style="margin-bottom:10px;border-left:4px solid var(--gold)">'+
        '<div class="row"><div class="grow"><div class="b" style="font-size:14px">'+esc(r.memberName)+' <span class="tiny muted">('+esc(r.memberId)+')</span></div>'+
        '<div class="tiny muted mt6">'+typeLabel+' · '+fmtDate(r.date)+'</div>'+
        (r.note?'<div class="tiny muted mt6">📝 '+esc(r.note)+'</div>':'')+'</div>'+
        '<div style="text-align:right;flex:none"><div class="bb" style="font-size:18px;color:var(--gold)">'+money(r.amount)+'</div></div></div>'+
        '<div class="row mt10" style="gap:8px;padding-top:10px;border-top:1px solid var(--border-2)">'+
          '<button class="btn danger small grow" data-act="reject-payment" data-id="'+esc(r.id)+'">✕ বাতিল</button>'+
          '<button class="btn small grow" style="background:linear-gradient(135deg,var(--income),#0E7A38)" data-act="approve-payment" data-id="'+esc(r.id)+'">✓ অনুমোদন</button>'+
        '</div></div>';
    }).join('');
    h+='</div>';
  }
  if(approved.length>0){
    h+='<div class="sec"><div class="sec-hd"><h2>✅ অনুমোদিত</h2></div>';
    h+='<div class="list">'+approved.slice(0,15).map(r=>{
      const typeLabel = r.type==='event' ? ('🎉 '+(r.eventTitle||'ইভেন্ট')) : (r.forMonth?('💰 '+MN(r.forMonth)+' '+r.forYear):'💰');

    }).join('')+'</div></div>';
  }
  if(rejected.length>0){
    h+='<div class="sec" style="padding-bottom:26px"><div class="sec-hd"><h2>❌ বাতিলকৃত</h2></div>';
    h+='<div class="list">'+rejected.slice(0,8).map(r=>'<div class="li"><div class="ic" style="background:var(--expense-soft);color:var(--expense)">'+icon('x')+'</div><div class="grow"><div class="t">'+esc(r.memberName)+'</div><div class="s">'+fmtDate(r.date)+(r.rejectReason?' · '+esc(r.rejectReason):'')+'</div></div><div class="amt neg">'+money(r.amount)+'</div></div>').join('')+'</div></div>';

  h+='</div>';return h;

async function approvePayment(reqId){
  const r=DB.paymentRequests.find(x=>x.id===reqId);
  if(!r){toast('রিকোয়েস্ট পাওয়া যায়নি','error');return}
  if(r.status!=='pending'){toast('এই রিকোয়েস্ট আগেই প্রসেস হয়েছে','error');return}
  const m=DB.members.find(x=>x.id===r.memberId);
  if(!m){toast('সদস্য পাওয়া যায়নি','error');return}
  const isEvent = r.type==='event';
  const typeLabel = isEvent ? ('🎉 ইভেন্ট: '+(r.eventTitle||'')) : ('💰 মাস: '+MN(r.forMonth||1)+' '+(r.forYear||new Date().getFullYear()));
  openModal({
    title:'পেমেন্ট অনুমোদন',
    body:
      '<div class="info-box"><b>'+esc(r.memberName)+'</b> ('+esc(r.memberId)+')<br>'+
      'পরিমাণ: <b style="font-size:18px;color:var(--gold)">'+money(r.amount)+'</b><br>'+
      typeLabel+'<br>তারিখ: '+fmtDate(r.date)+
      (r.note?'<br>নোট: '+esc(r.note):'')+'</div>'+
      '<div class="warn-box mt14">⚠️ অনুমোদন করলে এই টাকা '+(isEvent?'ইভেন্টে':'মাসিক চাঁদায়')+' যোগ হবে।</div>',
    footer:'<button class="btn ghost grow" data-mclose="1">বাতিল</button><button class="btn grow" style="background:linear-gradient(135deg,var(--income),#0E7A38)" id="apYes">✓ অনুমোদন</button>',
    onMount:function(mr){
      mr.querySelector('#apYes').addEventListener('click',async function(){
        closeModal();
        try{
          if(isEvent){
            await addDoc(collection(db,'transactions'),{date:r.date||toISO(new Date()),type:'contribution',amount:r.amount,category:'ইভেন্ট ফি',desc:m.name+' — '+(r.eventTitle||'ইভেন্ট')+' (payment request)',ref:r.memberId,refType:'member',eventId:r.eventId,addedBy:state.admin.name,createdAt:Date.now()});
          } else {
            const yy=r.forYear||new Date().getFullYear();
            const mm=r.forMonth||(new Date().getMonth()+1);
            const cid='CN-'+r.memberId+'-'+yy+pad2(mm);
            const existing=DB.contributions.find(c=>c.id===cid);
            if(existing){
              const newPaid=(existing.paidAmount||0)+r.amount;
              const newSt=newPaid>=existing.amount?'paid':(newPaid>0?'partial':'due');
              await updateDoc(doc(db,'contributions',cid),{paidAmount:newPaid,status:newSt,paidDate:r.date||toISO(new Date()),updatedAt:Date.now()});
            } else {
              await setDoc(doc(db,'contributions',cid),{memberId:r.memberId,year:yy,month:mm,amount:m.monthly||r.amount,paidAmount:r.amount,status:r.amount>=m.monthly?'paid':'partial',paidDate:r.date||toISO(new Date()),createdAt:Date.now()});
            }
            await addDoc(collection(db,'transactions'),{date:r.date||toISO(new Date()),type:'contribution',amount:r.amount,category:'মাসিক চাঁদা',desc:m.name+' — '+MN(mm)+' '+yy+' (payment request)',ref:r.memberId,refType:'member',addedBy:state.admin.name,createdAt:Date.now()});
          }
          await updateDoc(doc(db,'paymentRequests',reqId),{status:'approved',approvedAt:Date.now(),approvedBy:state.admin.name});
          audit('payment_approved',r.memberId,'',r.amount+'৳');
          toast('✓ অনুমোদিত! '+money(r.amount)+' যোগ হয়েছে','success');
        }catch(err){console.error(err);toast('Error: '+err.message,'error');}
      });
    }
  });
}

function formMember(existing){
  const isEdit=!!existing;
  const m=existing||{id:DATA.nextMemberId(),name:'',nameEn:'',phone:'',monthly:500,joinDate:toISO(new Date()),status:'active',color:'#0E5F30'};
  const phoneDisplay = m.phoneRaw || m.phone || '';
  openModal({
    title:isEdit?'সদস্য সম্পাদনা':'নতুন সদস্য',
    body:
      '<div class="field"><label>নাম (বাংলা) *</label><input id="fmName" value="'+esc(m.name||'')+'"/></div>'+
      '<div class="field"><label>Full Name (English)</label><input id="fmNameEn" value="'+esc(m.nameEn||'')+'"/></div>'+
      '<div class="field-row"><div class="field"><label>আইডি</label><input id="fmId" value="'+esc(m.id||'')+'" '+(isEdit?'readonly':'')+'/></div><div class="field"><label>মাসিক (৳)</label><input id="fmMonthly" type="number" value="'+(m.monthly||500)+'"/></div></div>'+
      '<div class="field"><label>ফোন নাম্বার (দেশের কোড সহ) *</label><input id="fmPhone" type="tel" value="'+esc(phoneDisplay)+'" placeholder="+880 1712 345678"/></div>'+
      '<div class="field-row"><div class="field"><label>স্ট্যাটাস</label><select id="fmStatus">'+['active','inactive','suspended','pending'].map(k=>'<option value="'+k+'" '+(m.status===k?'selected':'')+'>'+k+'</option>').join('')+'</select></div><div class="field"><label>যোগদান</label><input id="fmJoin" type="date" value="'+(m.joinDate||toISO(new Date()))+'"/></div></div>'+
      '<div class="info-box">ইউজার নিজেই "DP সেবা" অ্যাপে ফোন নাম্বার দিয়ে ৪-ডিজিট PIN সেট করবে।</div>',
    footer:'<button class="btn ghost grow" data-mclose="1">বাতিল</button><button class="btn grow" id="fmSave">'+(isEdit?'সংরক্ষণ':'যোগ করুন')+'</button>',
    onMount:function(mr){
      mr.querySelector('#fmSave').addEventListener('click',async function(){
        const name=mr.querySelector('#fmName').value.trim();
        if(!name){toast('নাম দিন','error');return}
        const rawPhone=mr.querySelector('#fmPhone').value.trim();
        if(!rawPhone){toast('ফোন নাম্বার দিন','error');return}
        const phoneNorm=normalizePhone(rawPhone);
        if(!phoneNorm||phoneNorm.length<7){toast('ফোন নাম্বার সঠিক নয়','error');return}
        const newMonthly=parseInt(mr.querySelector('#fmMonthly').value)||0;
        const data={name,nameEn:mr.querySelector('#fmNameEn').value.trim()||name,id:mr.querySelector('#fmId').value.trim(),monthly:newMonthly,phone:rawPhone,phoneRaw:rawPhone,phoneNorm:phoneNorm,authEmail:phoneNorm+AUTH_DOMAIN,status:mr.querySelector('#fmStatus').value,joinDate:mr.querySelector('#fmJoin').value,role:'সদস্য',roleEn:'Member',color:m.color||'#0E5F30',updatedAt:Date.now()};
        try{
          if(isEdit){
            await updateDoc(doc(db,'members',m._docId||m.id),data);
            if(newMonthly !== (m.monthly||0)){
              const contribs=DB.contributions.filter(c=>c.memberId===m.id && c.status==='due');
              for(const c of contribs){try{await updateDoc(doc(db,'contributions',c.id),{amount:newMonthly,updatedAt:Date.now()})}catch(e){}}
            }
            audit('member_edit',m.id,'',data.name);
          } else {
            data.createdAt = Date.now();data.accountSetup = false;
            const dupSnap = await getDocs(query(collection(db,'members'), where('phoneNorm','==',phoneNorm), limit(1)));
            if(!dupSnap.empty){ toast('এই নাম্বারে ইতিমধ্যে সদস্য আছে','error'); return; }
            await setDoc(doc(db,'members',data.id),data);
            const now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1;
            for(let mo=1;mo<=cm;mo++){const cid='CN-'+data.id+'-'+cy+pad2(mo);await setDoc(doc(db,'contributions',cid),{memberId:data.id,year:cy,month:mo,amount:data.monthly,paidAmount:0,status:'due',paidDate:null,createdAt:Date.now()});}
            audit('member_add',data.id,'',data.name);
          }
          closeModal();toast(isEdit?'হালনাগাদ হয়েছে':'সদস্য যোগ হয়েছে','success');
        }catch(err){console.error(err);toast('Error: '+err.message,'error')}
      });
    }
  });
}
function formEditExpected(memberId){
  const m=DB.members.find(x=>x.id===memberId);
  if(!m){toast('সদস্য পাওয়া যায়নি','error');return}
  const now=new Date();
  const cs=DATA.memberContribs(memberId);
  const years=[].concat.apply([],cs.map(c=>[c.year])).filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>b-a);
  if(!years.length) years.push(now.getFullYear());
  const defaultYear=years[0];
  function buildYearInputs(year){
    const yc=cs.filter(c=>c.year===year).sort((a,b)=>a.month-b.month);
    let html='';
    BN_MONTHS.forEach((mn,idx)=>{
      const mo=idx+1;const c=yc.find(x=>x.month===mo);
      if(c){html+='<div class="month-edit-row"><div class="mlbl">'+mn+'</div><input type="number" data-month="'+mo+'" value="'+(c.amount||0)+'" min="0"/></div>';}
      else{html+='<div class="month-edit-row disabled"><div class="mlbl">'+mn+'</div><input type="number" disabled placeholder="রেকর্ড নেই"/></div>';}
    });
    return html;
  }
  openModal({
    title:'প্রত্যাশিত চাঁদা এডিট',
    body:'<div class="info-box" style="margin-bottom:14px">প্রতি মাসের প্রত্যাশিত চাঁদা এডিট করুন।</div><div class="field"><label>বছর</label><select id="feYear">'+years.map(y=>'<option value="'+y+'" '+(y===defaultYear?'selected':'')+'>'+y+'</option>').join('')+'</select></div><div class="month-edit-list" id="feMonthsList">'+buildYearInputs(defaultYear)+'</div><button class="btn block" id="feReset" style="background:var(--primary-soft);color:var(--primary);box-shadow:none;font-size:13px">সব মাসে '+money(m.monthly||0)+'</button>',
    footer:'<button class="btn ghost grow" data-mclose="1">বাতিল</button><button class="btn grow" id="feSave">সংরক্ষণ</button>',
    onMount:function(mr){
      const yearSel=mr.querySelector('#feYear');const list=mr.querySelector('#feMonthsList');const resetBtn=mr.querySelector('#feReset');
      yearSel.addEventListener('change',function(){list.innerHTML=buildYearInputs(parseInt(yearSel.value))});
      resetBtn.addEventListener('click',function(){list.querySelectorAll('input[data-month]').forEach(inp=>{if(!inp.disabled) inp.value=m.monthly||500})});
      mr.querySelector('#feSave').addEventListener('click',async function(){
        const y=parseInt(yearSel.value);const yc=cs.filter(c=>c.year===y);const inputs=list.querySelectorAll('input[data-month]');
        let updated=0;
        for(const inp of inputs){
          if(inp.disabled) continue;
          const mo=parseInt(inp.dataset.month);const newAmt=Math.max(0,parseInt(inp.value)||0);const c=yc.find(x=>x.month===mo);
          if(!c||(c.amount||0)===newAmt) continue;
          try{await updateDoc(doc(db,'contributions',c.id),{amount:newAmt,updatedAt:Date.now()});updated++}catch(e){}
        }
        audit('expected_edit',m.id,'','',updated);closeModal();

/* ========= NAV ========= */
function pushPage(name,params){state.stack.push(Object.assign({name:name},params||{}));render()}
function popPage(){state.stack.pop();render()}
function switchTab(t){
  if(state.tab===t&&!state.stack.length){const c=$('#content');if(c)c.scrollTop=0;return}
  state.stack=[];state.tab=t;state.txLimit=40;render();
  const c=$('#content');if(c)c.scrollTop=0;
}
document.addEventListener('click',function(ev){
  const el=ev.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act;
  vibrate(6);
  switch(act){
    case 'login-email':doLoginEmail();break;
    case 'login-google':doLoginGoogle();break;
    case 'tab':switchTab(el.dataset.tab);break;
    case 'page':pushPage(el.dataset.page);break;
    case 'back-from-members':switchTab('more');break;
    case 'page-event':pushPage('eventEdit',{id:el.dataset.id});break;
    case 'page-event-detail':pushPage('eventDetail',{id:el.dataset.id});break;
    case 'event-edit':pushPage('eventEdit',{id:el.dataset.id});break;
    case 'event-toggle-status':toggleEventStatus(el.dataset.id);break;
    case 'event-notify':eventNotify(el.dataset.id);break;
    case 'post-view':pushPage('postDetail',{id:el.dataset.id});break;
    case 'post-delete':{
      const p=DB.userPosts.find(x=>x.id===el.dataset.id);
      if(!p) break;
      confirmDialog('পোস্ট মুছুন?',(p.userName||'')+': '+(p.statusText||'').slice(0,80),async function(){
        try{await deleteDoc(doc(db,'userPosts',p.id));audit('post_delete',p.id,'','');toast('পোস্ট মুছে ফেলা হয়েছে','success');}catch(err){toast('Error: '+err.message,'error')}
      },'মুছুন');
      break;
    }
    case 'back':popPage();break;
    case 'member':pushPage('member',{id:el.dataset.id});break;
    case 'member-message':memberMessage(el.dataset.id);break;
    case 'mfilter':state.memberFilter=el.dataset.v;render();break;
    case 'mfilter-pending':state.memberFilter='pending';state.tab='members';state.stack=[];render();break;
    case 'efilter':state.eventFilter=el.dataset.v;render();break;
    case 'cyear':state.contribYear=parseInt(el.dataset.v,10);render();break;
    case 'cmonth':state.contribMonth=parseInt(el.dataset.v,10);render();break;
    case 'fintab':state.finTab=el.dataset.v;render();break;
    case 'txtype':state.txType=el.dataset.v;state.txLimit=40;render();break;
    case 'txmore':state.txLimit+=40;render();break;
    case 'ntarget':state.notifTarget=el.dataset.v;render();break;
    case 'theme':state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;render();break;
    case 'add-member':formMember(null);break;
    case 'edit-member':{const m=DB.members.find(x=>x.id===el.dataset.id);if(m) formMember(m);break;}
    case 'edit-expected':formEditExpected(el.dataset.id);break;
    case 'toggle-status':{const m=DB.members.find(x=>x.id===el.dataset.id);if(m){const order=['active','inactive','suspended','pending'];const i=order.indexOf(m.status||'active');const newS=order[(i+1)%order.length];updateDoc(doc(db,'members',m._docId||m.id),{status:newS}).then(()=>{toast('স্ট্যাটাস: '+newS,'success');}).catch(err=>toast('Error: '+err.message,'error'));}break;}
    case 'delete-member':{const m=DB.members.find(x=>x.id===el.dataset.id);if(!m) break;confirmDialog('সদস্য মুছুন?','সব চাঁদা, অতিরিক্ত জমা মুছে যাবে।\n\n'+m.name,async function(){try{await deleteDoc(doc(db,'members',m._docId||m.id));for(const c of DB.contributions.filter(c=>c.memberId===m.id)){try{await deleteDoc(doc(db,'contributions',c.id))}catch(e){}}for(const x of DB.extraPayments.filter(x=>x.memberId===m.id)){try{await deleteDoc(doc(db,'extraPayments',x.id))}catch(e){}}audit('member_delete',m.id,m.name,'');popPage();toast('মুছে ফেলা হয়েছে','success');}catch(err){toast('Error: '+err.message,'error')}},'মুছুন');break;}
    case 'add-contribution':formAddContribution(null);break;
    case 'add-contribution-for':formAddContribution(el.dataset.id);break;
    case 'edit-contribution':formContribution(el.dataset.id);break;
    case 'add-extra-payment':formExtraPayment(el.dataset.id);break;
    case 'delete-extra':{const x=DB.extraPayments.find(v=>v.id===el.dataset.id);if(!x) break;confirmDialog('জমা মুছুন?',x.memberName+' · '+money(x.amount),async function(){try{await deleteDoc(doc(db,'extraPayments',x.id));toast('মুছে ফেলা হয়েছে','success');}catch(err){toast('Error: '+err.message,'error')}},'মুছুন');break;}
    case 'add-income':formIncome();break;
    case 'add-expense':formExpense();break;
    case 'add-announcement':formAnnouncement();break;
    case 'delete-announcement':{const a=DB.announcements.find(x=>x.id===el.dataset.id);if(!a) break;confirmDialog('ঘোষণা মুছুন?',a.title,async function(){try{await deleteDoc(doc(db,'announcements',a.id));toast('মুছে ফেলা হয়েছে','success')}catch(err){toast('Error: '+err.message,'error')}},'মুছুন');break;}
    case 'approve-payment':approvePayment(el.dataset.id);break;
    case 'reject-payment':rejectPayment(el.dataset.id);break;
    case 'add-event':pushPage('eventEdit',{id:'new'});break;
    case 'event-save-new':saveEvent(null);break;
    case 'event-save-edit':saveEvent(el.dataset.id);break;
    case 'event-delete':confirmDeleteEvent(el.dataset.id);break;
    case 'migrate-phone':{
      const noNorm=DB.members.filter(m=>!m.phoneNorm && m.phone);
      if(!noNorm.length){toast('সব সদস্য আপ-টু-ডেট ✓','success');break;}
      confirmDialog('মাইগ্রেশন?',noNorm.length+' জনের phoneNorm যোগ হবে।',async function(){
        let done=0,failed=0;
        for(const m of noNorm){
          try{
            const norm=normalizePhone(m.phone);
            if(!norm){failed++;continue;}
            await updateDoc(doc(db,'members',m._docId||m.id),{phoneNorm:norm,phoneRaw:m.phoneRaw||m.phone,authEmail:norm+AUTH_DOMAIN,updatedAt:Date.now()});
            done++;
          }catch(e){failed++;}
        }
        toast(done+' জন আপডেট হয়েছে'+(failed?' · '+failed+' ব্যর্থ':''),failed?'error':'success');
      },'মাইগ্রেট');
      break;
    }
    case 'send-notification-new':{
      const title=($('#ntTitle')||{}).value||'';
      const body=($('#ntBody')||{}).value||'';
      const amount=parseInt(($('#ntAmount')||{}).value)||0;
      const month=parseInt(($('#ntMonth')||{}).value)||new Date().getMonth()+1;
      const year=parseInt(($('#ntYear')||{}).value)||new Date().getFullYear();
      const ntype=($('#ntType')||{}).value||'monthly';
      const eventId=($('#ntEvent')||{}).value||'';
      if(!title||!body){toast('টাইটেল ও বার্তা দিন','error');break}
      if(amount<=0){toast('টাকার পরিমাণ দিন','error');break}
      if(ntype==='event'&&!eventId){toast('ইভেন্ট নির্বাচন করুন','error');break}
      const ev = eventId?DB.events.find(e=>e.id===eventId):null;
      addDoc(collection(db,'notifications'),{title:title,body:body,amount:amount,month:month,year:year,type:ntype,eventId:eventId||null,eventTitle:ev?ev.title:null,date:toISO(new Date()),read:false,target:state.notifTarget,createdAt:Date.now(),createdBy:state.admin.name}).then(()=>{toast('নোটিফিকেশন পাঠানো হয়েছে','success')}).catch(err=>toast('Error: '+err.message,'error'));
      break;
    }
    case 'logout':confirmDialog('লগআউট?','নিশ্চিত?',async function(){try{await signOut(auth)}catch(e){}},'লগআউট');break;
  }
});
document.addEventListener('change',function(ev){
  if(ev.target.id==='ntType'){
    const wrap=document.getElementById('ntEventWrap');
    if(wrap) wrap.style.display = ev.target.value==='event' ? 'block' : 'none';
  }
  if(ev.target.id==='ntEvent'){
    const opt=ev.target.selectedOptions[0];
    if(opt && opt.dataset.fee){
      const amtEl=document.getElementById('ntAmount');
      if(amtEl) amtEl.value=opt.dataset.fee;
    }
  }
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='memberSearch'){state.memberQ=ev.target.value;const pos=ev.target.selectionStart;render();const inp=$('#memberSearch');if(inp){inp.focus();try{inp.setSelectionRange(pos,pos)}catch(e){}}}
  if(ev.target.id==='globalSearch'){state.searchQ=ev.target.value;const pos=ev.target.selectionStart;render();const inp=$('#globalSearch');if(inp){inp.focus();try{inp.setSelectionRange(pos,pos)}catch(e){}}}
});

/* ========= INIT ========= */
state.loading=true;
render();
onAuthStateChanged(auth,async (user)=>{
  if(!user){state.admin=null;state.role=null;state.loading=false;render();return}
  try{
    const adminSnap=await getDoc(doc(db,'admins',user.uid));
    if(!adminSnap.exists()){toast('আপনি অ্যাডমিন নন','error');await signOut(auth);return}
    const adminData=adminSnap.data();
    state.admin={uid:user.uid,email:user.email,name:adminData.name||user.email,...adminData};
    state.role=adminData.role||'admin';
    await loadAllData();
    setupRealtimeListeners();
    state.loading=false;render();
    toast('স্বাগতম, '+state.admin.name,'success');
  }catch(err){console.error(err);toast('ত্রুটি: '+err.message,'error');state.loading=false;render();}
});
async function loadAllData(){
  try{
    const orgSnap=await getDoc(doc(db,'org','settings'));
    if(orgSnap.exists()) DB.org=orgSnap.data();
    const [m,c,tx,a,n,ep,pr,ev,up]=await Promise.all([
      getDocs(collection(db,'members')),
      getDocs(collection(db,'contributions')),
      getDocs(collection(db,'transactions')),
      getDocs(collection(db,'announcements')),
      getDocs(collection(db,'notifications')),
      getDocs(collection(db,'extraPayments')),
      getDocs(collection(db,'paymentRequests')),
      getDocs(collection(db,'events')),
      getDocs(collection(db,'userPosts'))
    ]);
    DB.members=m.docs.map(d=>({...d.data(),_docId:d.id}));
    DB.contributions=c.docs.map(d=>({...d.data(),id:d.id}));
    DB.transactions=tx.docs.map(d=>({...d.data(),id:d.id}));
    DB.announcements=a.docs.map(d=>({...d.data(),id:d.id}));
    DB.notifications=n.docs.map(d=>({...d.data(),id:d.id}));
    DB.extraPayments=ep.docs.map(d=>({...d.data(),id:d.id}));
    DB.paymentRequests=pr.docs.map(d=>({...d.data(),id:d.id}));
    DB.events=ev.docs.map(d=>({...d.data(),id:d.id}));
    DB.userPosts=up.docs.map(d=>({...d.data(),id:d.id}));
  }catch(err){console.error('Load failed:',err);toast('ডেটা লোড ব্যর্থ: '+err.message,'error')}
}
function setupRealtimeListeners(){
  onSnapshot(collection(db,'members'),s=>{DB.members=s.docs.map(d=>({...d.data(),_docId:d.id}));if(!state.loading)render()});
  onSnapshot(collection(db,'contributions'),s=>{DB.contributions=s.docs.map(d=>({...d.data(),id:d.id}));if(!state.loading)render()});
  onSnapshot(collection(db,'transactions'),s=>{DB.transactions=s.docs.map(d=>({...d.data(),id:d.id}));if(!state.loading)render()});
  onSnapshot(collection(db,'announcements'),s=>{DB.announcements=s.docs.map(d=>({...d.data(),id:d.id}));if(!state.loading)render()});
  onSnapshot(collection(db,'notifications'),s=>{DB.notifications=s.docs.map(d=>({...d.data(),id:d.id}));if(!state.loading)render()});
  onSnapshot(collection(db,'extraPayments'),s=>{DB.extraPayments=s.docs.map(d=>({...d.data(),id:d.id}));if(!state.loading)render()});
  onSnapshot(collection(db,'paymentRequests'),s=>{DB.paymentRequests=s.docs.map(d=>({...d.data(),id:d.id}));if(!state.loading)render()});
  onSnapshot(collection(db,'events'),s=>{DB.events=s.docs.map(d=>({...d.data(),id:d.id}));if(!state.loading)render()});
  onSnapshot(collection(db,'userPosts'),s=>{DB.userPosts=s.docs.map(d=>({...d.data(),id:d.id}));if(!state.loading)render()});
  onSnapshot(doc(db,'org','settings'),s=>{if(s.exists())DB.org=s.data();if(!state.loading)render()});
  onSnapshot(query(collection(db,'auditLogs'),orderBy('ts','desc'),limit(200)),s=>{DB.auditLogs=s.docs.map(d=>({...d.data(),id:d.id}));if(!state.loading&&state.stack.length&&state.stack[state.stack.length-1].name==='audit') render()});
}
window.addEventListener('online',()=>{if(state.admin){render();toast('অনলাইন','success')}});
window.addEventListener('offline',()=>{if(state.admin){toast('অফলাইন মোড')}});
</script>
</body>
