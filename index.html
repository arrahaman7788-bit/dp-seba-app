<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0E5F30"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>DP সেবা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#0E5F30;--primary-d:#083A1C;--primary-l:#1B8044;--primary-soft:#E5F2EA;--primary-soft2:#CDE6D9;--accent:#C41E3A;--accent-soft:#FCE7EC;--gold:#D4A017;--gold-soft:#FBF3DC;--income:#16A34A;--income-soft:#E6F7EE;--expense:#DC2626;--expense-soft:#FDE8ED;--event:#EA580C;--event-soft:#FEF0E7;--warn:#D97706;--warn-soft:#FEF3C7;--info:#0284C7;--info-soft:#E0F2FE;--danger:#B91C1C;--danger-soft:#FEE2E2;--bg:#F0F5F2;--bg-2:#E1EBE6;--card:#FFFFFF;--card-2:#F6FAF8;--text:#0A1A12;--text-2:#4E5F55;--text-3:#8B9A92;--border:#DCE7E1;--border-2:#E9F2ED;--shadow:0 4px 16px rgba(14,95,48,.07);--radius:20px;--nav-h:70px}
[data-theme="dark"]{--primary:#22A155;--primary-d:#0E5F30;--primary-l:#3DC76F;--primary-soft:#0A2A18;--primary-soft2:#123A22;--accent:#FF4D6D;--accent-soft:#3A0F1A;--gold:#FBBF24;--gold-soft:#3A2E10;--income:#2ECC71;--income-soft:#12301F;--expense:#FF5C7A;--expense-soft:#3A1520;--event:#FB923C;--event-soft:#3A2110;--warn:#FBBF24;--warn-soft:#3A2E10;--info:#38BDF8;--info-soft:#0C2A3A;--danger:#F87171;--danger-soft:#3A1010;--bg:#06100B;--bg-2:#030806;--card:#0F1A15;--card-2:#15241D;--text:#E8F5EE;--text-2:#95B3A5;--text-3:#627A70;--border:#1C2E24;--border-2:#15241C;--shadow:0 4px 16px rgba(0,0,0,.35)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:'Hind Siliguri',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-2);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:0;height:0}
#app{position:relative;max-width:540px;margin:0 auto;height:100dvh;height:100vh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 90px rgba(0,0,0,.12)}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + 26px)}
.hd{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd h1{font-size:20px;font-weight:700;margin:0}
.hd .sub{font-size:12px;color:var(--text-2);margin-top:2px}
.sec{padding:0 18px;margin-top:18px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-hd h2{font-size:15px;font-weight:700;margin:0}
.sec-hd .link{font-size:12px;color:var(--primary);font-weight:600;cursor:pointer}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border-2);padding:16px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--text-2)}.tiny{font-size:11px}.sm{font-size:12px}
.b{font-weight:600}.bb{font-weight:700}.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{text-align:center}.gap6{gap:6px}.gap10{gap:10px}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,var(--c,#0E5F30),#000);color:#fff;font-weight:700;flex:none;overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:10.5px;font-weight:600;line-height:1.6}
.pill.paid,.pill.active,.pill.approved,.pill.upcoming{background:var(--income-soft);color:var(--income)}
.pill.due,.pill.suspended,.pill.rejected{background:var(--expense-soft);color:var(--expense)}
.pill.partial,.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.na,.pill.inactive,.pill.past{background:var(--border);color:var(--text-3)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.extra{background:var(--accent-soft);color:var(--accent)}
.pill.urgent{background:var(--danger-soft);color:var(--danger)}
.pill.important{background:var(--warn-soft);color:var(--warn)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;color:#fff;transition:transform .12s;background:linear-gradient(135deg,var(--primary-l),var(--primary));box-shadow:0 8px 20px -8px rgba(14,95,48,.7)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--border);box-shadow:none}
.btn.soft{background:var(--primary-soft);color:var(--primary);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#E11D48,#B91C1C)}
.btn.small{padding:8px 14px;font-size:12.5px;border-radius:11px}
.btn.xs{padding:6px 11px;font-size:11.5px;border-radius:10px;gap:5px}
.btn.block{width:100%}
.icon-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border-2);color:var(--text-2);transition:transform .12s;flex:none}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px}
.balance-card{position:relative;overflow:hidden;border-radius:26px;padding:18px 20px 20px;background:radial-gradient(circle at 90% 10%,rgba(212,160,23,.35),transparent 40%),radial-gradient(circle at 10% 90%,rgba(196,30,58,.28),transparent 45%),linear-gradient(135deg,#0A4A24 0%,#0E5F30 45%,#1B8044 100%);color:#fff;box-shadow:0 22px 46px -18px rgba(14,95,48,.85);border:1px solid rgba(255,255,255,.18)}
[data-theme="dark"] .balance-card{background:radial-gradient(circle at 90% 10%,rgba(251,191,36,.28),transparent 40%),radial-gradient(circle at 10% 90%,rgba(255,77,109,.25),transparent 45%),linear-gradient(135deg,#041A0C 0%,#0E5F30 45%,#167A3A 100%)}
.bc-header{display:flex;align-items:center;gap:12px;position:relative;z-index:2;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.15)}
.bc-logo{width:52px;height:52px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;padding:4px;flex:none;overflow:hidden}
.bc-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:11px}
.bc-logo .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary-l),var(--primary));border-radius:11px;color:#fff;font-weight:700}
.bc-org{flex:1;min-width:0}
.bc-org-name{font-size:14.5px;font-weight:700;line-height:1.2}
.bc-org-sub{font-size:10.5px;opacity:.82;margin-top:2px}
.bc-label{font-size:12px;opacity:.86;font-weight:500;margin-top:14px}
.bc-amount{font-size:33px;font-weight:700;letter-spacing:-1px;margin-top:4px;line-height:1.15}
.bc-sub{font-size:11px;opacity:.72;margin-top:4px}
.bc-stats{display:flex;gap:10px;margin-top:16px;position:relative;z-index:2}
.bc-stat{flex:1;background:rgba(255,255,255,.13);border-radius:14px;padding:10px 11px;border:1px solid rgba(255,255,255,.18)}
.bc-stat .k{font-size:10px;opacity:.9}.bc-stat .v{font-size:14.5px;font-weight:700;margin-top:3px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.stat{background:linear-gradient(135deg,var(--card) 0%,var(--card-2) 100%);border:1px solid var(--border-2);border-radius:18px;padding:13px;box-shadow:var(--shadow)}
.stat .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.stat .ic svg{width:16px;height:16px}
.stat .k{font-size:10.5px;color:var(--text-2);font-weight:500;line-height:1.3}
.stat .v{font-size:16px;font-weight:700;margin-top:3px}
.list{background:var(--card);border:1px solid var(--border-2);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 15px;transition:background .15s;cursor:pointer}
.li:active{background:var(--card-2)}
.li+.li{border-top:1px solid var(--border-2)}
.li .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.li .ic svg{width:17px;height:17px}
.li .t{font-size:13.5px;font-weight:600;line-height:1.35}
.li .s{font-size:11px;color:var(--text-3);margin-top:2px}
.li .amt{font-size:14px;font-weight:700;white-space:nowrap}
.li > .chev{width:20px;height:20px;color:var(--text-3);flex:none;display:flex;align-items:center;justify-content:center}
.li > .chev svg{width:18px;height:18px}
.amt.pos{color:var(--income)}.amt.neg{color:var(--expense)}
.prog{height:8px;border-radius:99px;background:var(--border);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary-l),var(--primary));transition:width .8s}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--card);border:1px solid var(--border);color:var(--text-2);flex:none;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--primary-l),var(--primary));border-color:var(--primary);color:#fff}
.searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 13px;height:46px;box-shadow:var(--shadow)}
.searchbar svg{width:17px;height:17px;color:var(--text-3);flex:none}
.searchbar input{flex:1;border:none;outline:none;background:none;font-size:13.5px;height:100%}
.bottomnav{position:absolute;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--border-2);display:flex;z-index:40}
.bottomnav .nv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);position:relative;padding-top:2px;cursor:pointer}
.bottomnav .nv svg{width:21px;height:21px}
.bottomnav .nv span{font-size:9.5px;font-weight:600}
.bottomnav .nv.on{color:var(--primary)}
.bottomnav .nv.on::before{content:'';position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--primary-l),var(--primary))}
.subpage{position:absolute;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;animation:slideIn .26s ease}
@keyframes slideIn{from{transform:translateX(28px);opacity:.3}to{transform:translateX(0);opacity:1}}
.subhd{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border-2);flex:none;position:sticky;top:0;z-index:5}
.subhd h1{font-size:16.5px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subbody{flex:1;overflow-y:auto;padding-bottom:34px}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:120;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:540px;border-radius:26px 26px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
.modal-hd{padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border-2);flex:none}
.modal-hd h2{margin:0;font-size:16px;font-weight:700;flex:1}
.modal-body{flex:1;overflow-y:auto;padding:18px}
.modal-foot{padding:14px 18px;border-top:1px solid var(--border-2);flex:none;display:flex;gap:10px;background:var(--card)}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;height:46px;border-radius:13px;border:1.5px solid var(--border);background:var(--card);padding:0 13px;outline:none;font-size:14px;color:var(--text)}
.field textarea{height:auto;min-height:80px;padding:11px 13px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:16px;font-size:12.5px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:all .28s;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.success{background:#16A34A;color:#fff}
.toast.error{background:#DC2626;color:#fff}
.empty{padding:44px 24px;text-align:center;color:var(--text-3)}
.empty .eic{width:66px;height:66px;border-radius:22px;background:var(--card);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:32px}
.empty h3{margin:0 0 5px;font-size:14px;color:var(--text-2);font-weight:600}
.empty p{margin:0;font-size:12px}
.login{padding:0 24px;display:flex;flex-direction:column;justify-content:center;min-height:100%;position:relative;overflow:hidden}
.login-logo{width:90px;height:90px;border-radius:26px;overflow:hidden;background:#fff;padding:5px;margin:0 auto 18px;box-shadow:0 18px 38px -12px rgba(14,95,48,.6)}
.login-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:21px}
.login-logo .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary-l),var(--primary));border-radius:21px;color:#fff;font-weight:700;font-size:32px}
.login h1{font-size:22px;margin:0 0 6px;font-weight:700;text-align:center;color:var(--primary)}
.login .tag{font-size:13.5px;color:var(--text-2);margin:0 0 30px;line-height:1.6;text-align:center}
.splash{position:absolute;inset:0;background:linear-gradient(160deg,#0E5F30,#083A1C 60%,#041A0C);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:300;color:#fff}
.splash .logo-big{width:110px;height:110px;border-radius:30px;background:#fff;padding:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.splash .logo-big img{width:100%;height:100%;object-fit:contain;display:block;border-radius:24px}
.splash .logo-big .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary-l),var(--primary));border-radius:24px;color:#fff;font-weight:800;font-size:42px}
.splash h1{font-size:22px;margin:0;font-weight:700}
.splash p{margin:0;font-size:12.5px;opacity:.85}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.offline{background:var(--warn-soft);color:var(--warn);font-size:11.5px;font-weight:600;padding:7px 16px;display:flex;align-items:center;justify-content:center;gap:7px;flex:none}
.anim{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.anim-d1{animation-delay:.05s}.anim-d2{animation-delay:.1s}.anim-d3{animation-delay:.15s}.anim-d4{animation-delay:.2s}.anim-d5{animation-delay:.25s}
.info-box{background:var(--info-soft);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--info);font-weight:500;line-height:1.6}
.warn-box{background:var(--warn-soft);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--warn);font-weight:500;line-height:1.6}
.hd-logo{width:46px;height:46px;border-radius:14px;background:#fff;padding:3px;flex:none;border:1px solid var(--border-2);overflow:hidden}
.hd-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:11px}
.event-hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;background:linear-gradient(135deg,#B93A0E 0%,#EA580C 45%,#F59E0B 100%);color:#fff;box-shadow:0 20px 44px -16px rgba(234,88,12,.7);cursor:pointer}
.event-hero .eh-tag{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;background:rgba(255,255,255,.22);border-radius:99px;font-size:11px;font-weight:700}
.event-hero .eh-title{font-size:20px;font-weight:700;line-height:1.25;margin:12px 0 8px}
.event-hero .eh-desc{font-size:12.5px;line-height:1.6;opacity:.94;margin:0 0 14px}
.event-hero .eh-meta{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.event-hero .eh-cell{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;border:1px solid rgba(255,255,255,.24)}
.event-hero .eh-cell .k{font-size:10px;opacity:.92;font-weight:500}
.event-hero .eh-cell .v{font-size:14.5px;font-weight:700;margin-top:3px}
.past-card{background:var(--card);border-radius:16px;padding:12px 14px;border:1px solid var(--border-2);box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:12px;border-left:4px solid var(--text-3)}
.past-card .pc-date{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#6B7280,#4B5563);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.past-card .pc-date .d{font-size:16px;font-weight:800}
.past-card .pc-date .m{font-size:9px;opacity:.9;margin-top:2px;font-weight:600}
.past-card .pc-body{flex:1;min-width:0}
.past-card .pc-title{font-size:13.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.past-card .pc-sub{font-size:11px;color:var(--text-3);margin-top:3px}
.post-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border:1px solid var(--border-2);margin-bottom:10px}
.post-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.post-body-text{font-size:13.5px;line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word}
.post-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:10px;border-top:1px solid var(--border-2)}
.post-time{font-size:10.5px;color:var(--text-3)}
.notif-card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--border-2);margin-bottom:10px;border-left:4px solid var(--info)}
.notif-card.unread{border-left-color:var(--gold);background:linear-gradient(135deg,var(--card),var(--gold-soft))}
.notif-head{display:flex;gap:10px;align-items:flex-start}
.notif-ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;font-size:18px}
.auth-tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:16px;border:1px solid var(--border-2)}
.auth-tab{flex:1;padding:11px;text-align:center;font-size:13px;font-weight:600;color:var(--text-2);border-radius:11px;cursor:pointer;transition:all .18s}
.auth-tab.on{background:linear-gradient(135deg,var(--primary-l),var(--primary));color:#fff}
</style>
</head>

function $(s){return document.querySelector(s)}
function pad2(n){return String(n).padStart(2,'0')}
function fmtN(n){return Math.round(n).toLocaleString('en-IN')}
function shortMoney(n){n=Math.abs(n);if(n>=1e7)return '৳'+(n/1e7).toFixed(2)+'কো';if(n>=1e5)return '৳'+(n/1e5).toFixed(2)+'লা';if(n>=1e3)return '৳'+(n/1e3).toFixed(1)+'হা';return '৳'+Math.round(n)}
function MN(m){return BN_MONTHS[m-1]}
function toISO(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function parseISO(s){if(!s)return new Date();var p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function fmtDate(iso){if(!iso)return '—';try{var d=parseISO(iso);return d.getDate()+' '+MN(d.getMonth()+1)+' '+d.getFullYear()}catch(e){return iso}}
function fmtDateTime(ts){if(!ts)return '—';var d=new Date(ts);var hr=d.getHours();var ampm=hr>=12?'PM':'AM';hr=hr%12||12;return d.getDate()+' '+MN(d.getMonth()+1)+' '+hr+':'+pad2(d.getMinutes())+' '+ampm}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}

/* ============================================================
   ✅ normalizePhone — সম্পূর্ণ ইউনিভার্সাল (যেকোনো দেশ)
   ------------------------------------------------------------
   অ্যাডমিন অ্যাপের ফাংশনের সাথে HUBOHU মিল থাকতে হবে।
   শুধু ডিজিট রাখে — স্পেস, +, -, (), . সব বাদ দেয়।
   
   উদাহরণ:
     "+880 1712-345678"  → "8801712345678"
     "+1 (415) 555-1234" → "14155551234"
     "+971 50 123 4567"  → "971501234567"
     "+44 7911 123456"   → "447911123456"
     "01712345678"       → "01712345678"
   
   authEmail = phoneNorm + '@dpseba.local'
   ============================================================ */
function normalizePhone(raw){
  if(!raw) return '';
  return String(raw).trim().replace(/[^\d]/g,'');
}
function isValidPhone(norm){
  if(!norm) return false;
  return norm.length >= PHONE_MIN_DIGITS && norm.length <= PHONE_MAX_DIGITS;
}

var DATA={
  myContribs:function(){if(!state.member) return [];return DB.contributions.filter(function(c){return c.memberId===state.member.id})},
  mySummary:function(){
    var cs=this.myContribs();
    var expected=cs.reduce(function(a,b){return a+(b.amount||0)},0);
    var paid=cs.reduce(function(a,b){return a+(b.paidAmount||0)},0);
    return {expected:expected,paid:paid,due:expected-paid,percent:expected?Math.round(paid/expected*100):0};
  },
  totalFund:function(){
    var income=0,expense=0;
    DB.transactions.forEach(function(t){
      if(t.type==='contribution'||t.type==='donation'||t.type==='other_income'||t.type==='extra_payment') income+=t.amount||0;
      else expense+=t.amount||0;
    });
    return {income:income,expense:expense,balance:income-expense};
  },
  upcomingEvents:function(){return DB.events.filter(function(e){return !e.isCompleted}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'')})},
  pastEvents:function(){return DB.events.filter(function(e){return e.isCompleted}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')})},
  nextEvent:function(){var u=this.upcomingEvents();return u.length?u[0]:null},
  myNotifications:function(){
    if(!state.member) return [];
    return DB.notifications.filter(function(n){return n.userId===state.member.id||n.target==='all'||!n.userId}).sort(function(a,b){return (b.timestamp||b.createdAt||0)-(a.timestamp||a.createdAt||0)});
  },
  unreadCount:function(){return this.myNotifications().filter(function(n){return !n.read}).length},
  myPendingRequests:function(){if(!state.member) return [];return DB.paymentRequests.filter(function(r){return r.memberId===state.member.id})}
};

/* ========= LOGIN / REGISTER LOGIC ========= */
async function doLogin(){
  var phone=($('#loginPhone')||{}).value||'';
  var pin=($('#loginPin')||{}).value||'';
  if(!phone||!pin){toast('ফোন ও PIN দিন','error');return}
  if(pin.length<6){toast('PIN কমপক্ষে ৬ ডিজিট','error');return}
  var phoneNorm=normalizePhone(phone);
  if(!isValidPhone(phoneNorm)){
    toast('সঠিক ফোন নাম্বার দিন (দেশের কোড সহ, '+PHONE_MIN_DIGITS+'-'+PHONE_MAX_DIGITS+' ডিজিট)','error');
    return;
  }
  var email=phoneNorm+AUTH_DOMAIN;
  try{toast('লগইন হচ্ছে...');await auth.signInWithEmailAndPassword(email,pin);}
  catch(err){
    var msg='লগইন ব্যর্থ';
    if(err.code==='auth/wrong-password'||err.code==='auth/invalid-credential') msg='PIN ভুল';
    else if(err.code==='auth/user-not-found') msg='এই নাম্বারে অ্যাকাউন্ট নেই — প্রথমে রেজিস্ট্রেশন করুন';
    else if(err.code==='auth/too-many-requests') msg='একটু পরে চেষ্টা করুন';
    else msg='সমস্যা: '+err.message;
    toast(msg,'error');
  }
}
async function doRegister(){
  var phone=($('#regPhone')||{}).value||'';
  var pin=($('#regPin')||{}).value||'';
  var pin2=($('#regPin2')||{}).value||'';
  if(!phone||!pin){toast('সব তথ্য দিন','error');return}
  if(pin.length<6){toast('PIN কমপক্ষে ৬ ডিজিট','error');return}
  if(pin!==pin2){toast('দুইবার PIN একই দিন','error');return}
  var phoneNorm=normalizePhone(phone);
  if(!isValidPhone(phoneNorm)){
    toast('সঠিক ফোন নাম্বার দিন (দেশের কোড সহ, '+PHONE_MIN_DIGITS+'-'+PHONE_MAX_DIGITS+' ডিজিট)','error');
    return;
  }
  try{
    toast('অ্যাকাউন্ট তৈরি হচ্ছে...');
    /* ✅ অ্যাডমিন অ্যাপে রাখা phoneNorm-এর সাথে হুবহু ম্যাচ */
    var dupSnap=await db.collection('members').where('phoneNorm','==',phoneNorm).limit(1).get();
    if(dupSnap.empty){
      toast('❌ এই নাম্বারে সদস্য নেই — অ্যাডমিনের সাথে যোগাযোগ করুন','error');
      return;
    }
    if(dupSnap.docs[0].data().accountSetup===true){
      toast('❌ এই নাম্বারে অ্যাকাউন্ট আছে — লগইন করুন','error');
      return;
    }
    var email=phoneNorm+AUTH_DOMAIN;
    var userCred=await auth.createUserWithEmailAndPassword(email,pin);
    try{
      await db.collection('members').doc(dupSnap.docs[0].id).update({
        accountSetup:true,
        authUid:userCred.user.uid,
        accountCreatedAt:Date.now(),
        phoneRaw:phone
      });
    }catch(e){console.warn(e)}
    toast('✅ অ্যাকাউন্ট তৈরি হয়েছে','success');
  }catch(err){
    var msg='অ্যাকাউন্ট তৈরি ব্যর্থ';
    if(err.code==='auth/email-already-in-use') msg='এই নাম্বারে অ্যাকাউন্ট আছে — লগইন করুন';
    else if(err.code==='auth/weak-password') msg='PIN দুর্বল — ৬ ডিজিট দিন';
    else msg='❌ '+err.message;
    toast(msg,'error');
  }
}

function pageMember(id){
  var m=DB.members.filter(function(x){return x.id===id})[0];
  if(!m) return subHeader('সদস্য')+'<div class="subbody"><div class="empty"><h3>পাওয়া যায়নি</h3></div></div>';
  var isMe=id===state.member.id;
  var cs=DB.contributions.filter(function(c){return c.memberId===id});
  var expected=cs.reduce(function(a,b){return a+(b.amount||0)},0);
  var paid=cs.reduce(function(a,b){return a+(b.paidAmount||0)},0);
  var due=expected-paid;
  var pct=expected?Math.round(paid/expected*100):0;
  var years=[];cs.forEach(function(c){if(years.indexOf(c.year)<0)years.push(c.year)});years.sort(function(a,b){return b-a});
  var y=years[0]||new Date().getFullYear();
  var yearCs=cs.filter(function(c){return c.year===y}).sort(function(a,b){return b.month-a.month});
  var rightBtns = isMe ? '<span class="pill active" style="font-size:10px">আপনি</span>'
    : '<button class="btn xs" data-act="message-member" data-id="'+esc(id)+'">'+icon('message')+' মেসেজ করুন</button>';
  var h=subHeader(m.name||'সদস্য',rightBtns);
  h+='<div class="subbody">';
  h+='<div class="sec" style="margin-top:16px"><div class="card" style="text-align:center;padding:20px 16px">'+
      '<div style="display:flex;justify-content:center">'+avatarHTML(m,110)+'</div>'+
      '<div class="bb" style="font-size:18px;margin-top:12px">'+esc(m.name||'')+'</div>'+
      '<div class="sm muted" style="margin-top:3px">'+(m.id||'')+'</div>'+
    '</div></div>';
  h+='<div class="sec"><div class="stat-grid">'+
      '<div class="stat"><div class="k">প্রত্যাশিত</div><div class="v">৳ '+fmtN(expected)+'</div></div>'+
      '<div class="stat"><div class="k">পরিশোধিত</div><div class="v" style="color:var(--income)">৳ '+fmtN(paid)+'</div></div>'+
      '<div class="stat"><div class="k">বাকি</div><div class="v" style="color:'+(due>0?'var(--expense)':'var(--text-3)')+'">৳ '+fmtN(Math.max(due,0))+'</div></div>'+
      '<div class="stat"><div class="k">অগ্রগতি</div><div class="v">'+pct+'%</div></div>'+
    '</div><div class="prog mt14"><i style="width:'+pct+'%"></i></div></div>';
  h+='<div class="chips" style="margin-top:14px">'+years.map(function(yy){return '<button class="chip'+(yy===y?' on':'')+'" data-act="cyear-member" data-v="'+yy+'">'+yy+'</button>'}).join('')+'</div>';
  h+='<div class="sec" style="margin-top:14px"><div class="sec-hd"><h2>চাঁদার ইতিহাস</h2></div>';
  if(!yearCs.length){h+='<div class="empty"><h3>কোনো রেকর্ড নেই</h3></div>';}
  else{h+=yearCs.map(function(c){var st=c.status||'due';var label=st==='paid'?'পরিশোধিত':(st==='due'?'বাকি':'আংশিক');return '<div style="display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--card);border:1px solid var(--border-2);border-radius:14px;margin-bottom:7px"><div style="width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;background:var(--card-2)">'+(c.month||0)+'</div><div class="grow"><div style="font-size:13.5px;font-weight:600">'+MN(c.month||1)+' '+c.year+'</div><div class="tiny muted">প্রত্যাশিত ৳'+fmtN(c.amount||0)+' · পরিশোধিত ৳'+fmtN(c.paidAmount||0)+'</div></div><span class="pill '+st+'">'+label+'</span></div>'}).join('');}
  h+='</div></div>';
  return h;
}

  h+='<div class="sec" style="padding-bottom:26px"><div class="card" style="background:var(--card-2);text-align:center"><div class="tiny muted">দাড়িপাকা প্রবাসী কল্যাণ ফাউন্ডেশন</div><div class="tiny muted mt6">DP সেবা · v1.0</div></div></div>';
  return h;
}

/* ========= NOTIFICATIONS ========= */
function pageNotifications(){
  var list=DATA.myNotifications();
  var h=subHeader('নোটিফিকেশন', list.length?'<span class="pill info">'+list.length+'</span>':'');
  h+='<div class="subbody"><div class="sec" style="margin-top:16px">';
  if(!list.length){h+='<div class="empty"><div class="eic">🔔</div><h3>কোনো নোটিফিকেশন নেই</h3></div>';}
  else{
    list.forEach(function(n){
      var unread=!n.read;

      h+='<div class="notif-card'+(unread?' unread':'')+'" data-act="read-notif" data-id="'+esc(n.id)+'">'+
        '<div class="notif-head">'+
          '<div class="notif-ic" style="background:var(--info-soft);color:var(--info)">'+icon('bell')+'</div>'+
          '<div class="grow">'+
            '<div class="b sm">'+typeIcon+' '+esc(n.title||'নোটিফিকেশন')+'</div>'+

            (n.amount?'<div class="pill gold mt6">৳ '+fmtN(n.amount)+'</div>':'')+
            '<div class="post-time mt6">'+(ts?fmtDateTime(ts):fmtDate(n.date))+'</div>'+

        '</div>'+
      '</div>';
    });

  h+='</div></div>';

/* ========= MY PAYMENT ========= */
function pageMyPayment(){
  var me=state.member;
  var cs=DB.contributions.filter(function(c){return c.memberId===me.id}).sort(function(a,b){return (b.year||0)-(a.year||0)||(b.month||0)-(a.month||0)});
  var sum=DATA.mySummary();
  var myReqs=DATA.myPendingRequests();
  var h=subHeader('আমার চাঁদা');
  h+='<div class="subbody">';
  h+='<div class="sec" style="margin-top:16px"><div class="card" style="text-align:center;padding:20px"><div class="tiny muted">পরিশোধিত</div><div class="bb" style="font-size:28px;color:var(--primary);margin-top:5px">৳ '+fmtN(sum.paid)+'</div><div class="tiny muted mt6">প্রত্যাশিত ৳'+fmtN(sum.expected)+' · বাকি ৳'+fmtN(Math.max(sum.due,0))+'</div><div class="prog mt14"><i style="width:'+sum.percent+'%"></i></div></div></div>';
  h+='<div class="sec"><div class="card" style="background:linear-gradient(135deg,var(--gold-soft),var(--warn-soft));border:none"><div class="sm" style="line-height:1.8;color:var(--text)">১. bKash নাম্বারে টাকা পাঠান<br>২. Reference-এ লিখুন: <b>'+esc(me.id||'')+'</b><br>৩. নিচের বাটনে ক্লিক করে জানান</div><button class="btn block mt14" data-act="send-payment-request">'+icon('send')+' টাকা পাঠিয়েছি</button></div></div>';
  if(myReqs.length){
    h+='<div class="sec"><div class="sec-hd"><h2>আমার রিকোয়েস্ট</h2></div>';
    h+=myReqs.slice(0,5).map(function(r){var st=r.status||'pending';var label=st==='pending'?'অপেক্ষমাণ':(st==='approved'?'অনুমোদিত':'বাতিল');return '<div class="card" style="margin-bottom:9px;padding:13px"><div class="between"><div><div class="b sm">৳ '+fmtN(r.amount)+'</div><div class="tiny muted mt6">'+fmtDate(r.date)+'</div></div><span class="pill '+st+'">'+label+'</span></div></div>'}).join('');
    h+='</div>';
  }
  h+='<div class="sec"><div class="sec-hd"><h2>মাসিক রেকর্ড</h2></div>';
  if(!cs.length){h+='<div class="empty"><h3>কোনো রেকর্ড নেই</h3></div>';}
  else{h+=cs.slice(0,12).map(function(c){var st=c.status||'due';var label=st==='paid'?'পরিশোধিত':(st==='due'?'বাকি':'আংশিক');return '<div style="display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--card);border:1px solid var(--border-2);border-radius:14px;margin-bottom:7px"><div style="width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;background:var(--card-2)">'+(c.month||0)+'</div><div class="grow"><div style="font-size:13.5px;font-weight:600">'+MN(c.month||1)+' '+c.year+'</div><div class="tiny muted">প্রত্যাশিত ৳'+fmtN(c.amount||0)+' · পরিশোধিত ৳'+fmtN(c.paidAmount||0)+'</div></div><span class="pill '+st+'">'+label+'</span></div>'}).join('');}
  h+='</div></div>';
  return h;
}

/* ========= EVENT DETAIL ========= */
function pageEventDetail(id){
  var e=DB.events.filter(function(x){return x.id===id})[0];
  if(!e) return subHeader('ইভেন্ট')+'<div class="subbody"><div class="empty"><h3>পাওয়া যায়নি</h3></div></div>';
  var d=parseISO(e.date);

  h+='<div class="sec" style="margin-top:16px"><div class="event-hero" style="cursor:default">'+
    '<div class="eh-tag">'+(isUp?'🎯 আগামী':'✓ সম্পন্ন')+' · '+d.getDate()+' '+MN(d.getMonth()+1)+' '+d.getFullYear()+'</div>'+
    '<div class="eh-title">'+esc(e.title)+'</div>'+

    '</div>'+

/* ========= ACTIONS ========= */
async function doQuickPost(){
  var textarea=document.getElementById('quickStatus')||document.getElementById('feedStatus');
  if(!textarea){toast('টেক্সট ক্ষেত্র পাওয়া যায়নি','error');return}
  var text=(textarea.value||'').trim();
  if(!text){toast('কিছু লিখুন','error');return}
  if(text.length>1000){toast('১০০০ অক্ষরের মধ্যে লিখুন','error');return}
  try{
    await db.collection('userPosts').add({
      userId:state.member.id,userName:state.member.name||'সদস্য',
      userImage:state.member.photo||'',statusText:text,
      timestamp:Date.now(),createdAt:Date.now()
    });
    toast('✅ পোস্ট হয়েছে','success');textarea.value='';
  }catch(err){toast('❌ পোস্ট ব্যর্থ: '+err.message,'error')}
}
async function deleteMyPost(id){
  if(!confirm('পোস্ট মুছবেন?')) return;
  try{await db.collection('userPosts').doc(id).delete();toast('✅ মুছে ফেলা হয়েছে','success');}
  catch(err){toast('❌ '+err.message,'error')}
}
function openMessageModal(memberId){
  var m=DB.members.filter(function(x){return x.id===memberId})[0];
  if(!m){toast('সদস্য পাওয়া যায়নি','error');return}
  openModal({
    title:'📩 মেসেজ পাঠান',
    body:'<div class="card" style="background:var(--card-2);margin-bottom:14px"><div class="row">'+avatarHTML(m,44)+'<div class="grow"><div class="b">'+esc(m.name||'')+'</div><div class="tiny muted mt6">'+(m.id||'')+'</div></div></div></div>'+
      '<div class="field"><label>টাইটেল *</label><input id="msgTitle" placeholder="যেমন: শুভেচ্ছা"/></div>'+
      '<div class="field"><label>মেসেজ *</label><textarea id="msgBody" rows="4" placeholder="বিস্তারিত লিখুন..."></textarea></div>',
    footer:'<button class="btn ghost grow" data-mclose="1">বাতিল</button><button class="btn grow" id="msgSendBtn">'+icon('send')+' পাঠান</button>',
    onMount:function(mr){
      mr.querySelector('#msgSendBtn').addEventListener('click',async function(){
        var title=mr.querySelector('#msgTitle').value.trim();
        var body=mr.querySelector('#msgBody').value.trim();
        if(!title||!body){toast('সব তথ্য দিন','error');return}
        try{
          await db.collection('notifications').add({
            userId:m.id,memberId:m.id,memberName:m.name||'',
            title:title,body:body,amount:0,type:'message',
            date:toISO(new Date()),timestamp:Date.now(),read:false,
            target:'individual',senderId:state.member.id,
            senderName:state.member.name||'সদস্য',
            source:'member-message',createdAt:Date.now()
          });
          toast('✅ মেসেজ পাঠানো হয়েছে','success');closeModal();
        }catch(err){toast('❌ '+err.message,'error')}
      });
    }
  });
}
function openPaymentRequestModal(){
  openModal({
    title:'পেমেন্ট রিকোয়েস্ট',
    body:'<div class="info-box">bKash-এ টাকা পাঠানোর পর এই ফর্ম পূরণ করুন।</div>'+
      '<div class="field mt14"><label>টাকার পরিমাণ (৳) *</label><input id="prAmount" type="number" placeholder="500" min="1"/></div>'+
      '<div class="field"><label>টাইপ</label><select id="prType"><option value="monthly">মাসিক চাঁদা</option><option value="event">ইভেন্ট পেমেন্ট</option></select></div>'+
      '<div class="field"><label>মাস</label><select id="prMonth">'+BN_MONTHS.map(function(nm,i){return '<option value="'+(i+1)+'" '+(i+1===(new Date().getMonth()+1)?'selected':'')+'>'+nm+'</option>'}).join('')+'</select></div>'+
      '<div class="field"><label>ট্রানজেকশন নাম্বার / নোট</label><input id="prNote" placeholder="যেমন: TxID 8A7B..."/></div>',
    footer:'<button class="btn ghost grow" data-mclose="1">বাতিল</button><button class="btn grow" id="prSend">পাঠান</button>',
    onMount:function(mr){
      mr.querySelector('#prSend').addEventListener('click',async function(){
        var amount=parseInt(mr.querySelector('#prAmount').value)||0;
        if(amount<=0){toast('সঠিক পরিমাণ দিন','error');return}
        var type=mr.querySelector('#prType').value;
        var month=parseInt(mr.querySelector('#prMonth').value);
        var note=mr.querySelector('#prNote').value.trim();
        try{
          await db.collection('paymentRequests').add({
            memberId:state.member.id,memberName:state.member.name||'সদস্য',
            amount:amount,type:type,forMonth:month,forYear:new Date().getFullYear(),
            note:note,date:toISO(new Date()),ts:Date.now(),status:'pending',createdAt:Date.now()
          });
          toast('✅ রিকোয়েস্ট পাঠানো হয়েছে','success');closeModal();
        }catch(err){toast('❌ '+err.message,'error')}
      });
    }
  });
}

/* ========= NAV ========= */
function pushPage(name,params){state.stack.push(Object.assign({name:name},params||{}));render()}
function popPage(){state.stack.pop();render()}
function switchTab(t){
  if(state.tab===t&&!state.stack.length){var c=$('#content');if(c)c.scrollTop=0;return}
  state.stack=[];state.tab=t;render();
  var c=$('#content');if(c)c.scrollTop=0;
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el) return;
  var act=el.dataset.act;
  vibrate(6);
  switch(act){
    case 'auth-mode':state.authMode=el.dataset.mode;render();break;
    case 'login':doLogin();break;
    case 'register':doRegister();break;
    case 'logout':if(confirm('লগআউট করবেন?')){try{auth.signOut()}catch(e){}}break;
    case 'tab':switchTab(el.dataset.tab);break;
    case 'page':pushPage(el.dataset.page);break;
    case 'back':popPage();break;
    case 'member':pushPage('member',{id:el.dataset.id});break;
    case 'page-event':pushPage('eventDetail',{id:el.dataset.id});break;
    case 'message-member':openMessageModal(el.dataset.id);break;
    case 'quick-post':doQuickPost();break;
    case 'delete-my-post':deleteMyPost(el.dataset.id);break;
    case 'send-payment-request':openPaymentRequestModal();break;
    case 'copy-number':{
      var num=el.dataset.num;
      try{navigator.clipboard.writeText(num).then(function(){toast('✅ কপি হয়েছে','success')});}
      catch(e){toast('নাম্বার: '+num)}
      break;
    }
    case 'theme-toggle':{
      state.theme=state.theme==='dark'?'light':'dark';
      document.documentElement.dataset.theme=state.theme;
      try{localStorage.setItem('dp_theme',state.theme)}catch(e){}
      render();break;
    }
    case 'read-notif':{
      var id=el.dataset.id;
      var n=DB.notifications.filter(function(x){return x.id===id})[0];
      if(n&&!n.read){db.collection('notifications').doc(id).update({read:true}).catch(function(e){})}
      break;
    }
  }
});

/* ========= INIT ========= */
try{var savedTheme=localStorage.getItem('dp_theme');if(savedTheme){state.theme=savedTheme;document.documentElement.dataset.theme=savedTheme}}catch(e){}

state.loading=true;
render();

auth.onAuthStateChanged(async function(user){
  if(!user){state.user=null;state.member=null;state.loading=false;render();return;}
  state.user=user;
  try{
    /* ✅ প্রথমে authUid দিয়ে খুঁজি, তারপর phoneNorm দিয়ে (ইউনিভার্সাল) */
    var member=null;
    var memberSnap=await db.collection('members').doc(user.uid).get();
    if(memberSnap.exists){
      member=Object.assign({},memberSnap.data(),{_docId:memberSnap.id,id:memberSnap.data().id||memberSnap.id});
    } else {
      var phoneNorm='';
      if(user.email){phoneNorm=user.email.split('@')[0]}
      if(phoneNorm){
        var snap=await db.collection('members').where('phoneNorm','==',phoneNorm).limit(1).get();
        if(!snap.empty){
          member=Object.assign({},snap.docs[0].data(),{_docId:snap.docs[0].id,id:snap.docs[0].data().id||snap.docs[0].id});
        }
      }
    }
    if(!member){state.member=null;state.loading=false;render();return;}
    if(!member.accountSetup){
      try{await db.collection('members').doc(member._docId).update({accountSetup:true,authUid:user.uid,updatedAt:Date.now()});member.accountSetup=true;}catch(e){}
    }
    state.member=member;
    await loadAllData();
    setupListeners();
    state.loading=false;render();
    toast('স্বাগতম, '+(member.name||''),'success');
  }catch(err){
    console.error('Auth error:',err);
    state.loading=false;render();
    toast('ডেটা লোড ব্যর্থ: '+err.message,'error');
  }
});

async function loadAllData(){
  try{
    var results=await Promise.all([
      db.collection('members').get(),
      db.collection('contributions').get(),
      db.collection('transactions').get(),
      db.collection('events').get(),
      db.collection('announcements').get(),
      db.collection('notifications').get(),
      db.collection('paymentRequests').get(),
      db.collection('userPosts').get(),
      db.collection('extraPayments').get()
    ]);
    DB.members=results[0].docs.map(function(d){return Object.assign({},d.data(),{_docId:d.id})});
    DB.contributions=results[1].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.transactions=results[2].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.events=results[3].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.announcements=results[4].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.notifications=results[5].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.paymentRequests=results[6].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.userPosts=results[7].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    DB.extraPayments=results[8].docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
  }catch(err){console.error('loadAllData error:',err);throw err}
}

function setupListeners(){
  db.collection('members').onSnapshot(function(s){DB.members=s.docs.map(function(d){return Object.assign({},d.data(),{_docId:d.id})});if(!state.loading)render()});
  db.collection('contributions').onSnapshot(function(s){DB.contributions=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()});
  db.collection('transactions').onSnapshot(function(s){DB.transactions=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()});
  db.collection('events').onSnapshot(function(s){DB.events=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()});
  db.collection('announcements').onSnapshot(function(s){DB.announcements=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()});
  db.collection('notifications').onSnapshot(function(s){DB.notifications=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()});
  db.collection('paymentRequests').onSnapshot(function(s){DB.paymentRequests=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()});
  db.collection('userPosts').onSnapshot(function(s){DB.userPosts=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()});
  db.collection('extraPayments').onSnapshot(function(s){DB.extraPayments=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(!state.loading)render()});
}
window.addEventListener('online',function(){if(state.member){render();toast('অনলাইন','success')}});
window.addEventListener('offline',function(){if(state.member){toast('অফলাইন মোড')}});
</script>
